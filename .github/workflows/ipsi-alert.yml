name: 입시 알림 (전형 일정)

# 원서접수 기간(2026.9.7~9.11)에만 자주 돌린다. 접수가 끝나면 경쟁률이 더 안 바뀜.
# cron은 UTC 기준 — KST 09:00~19:00 = UTC 00:00~10:00
# 예약 실행은 껐다 — GitHub이 하루 17회 중 2회꼴만 실제로 돌렸고(9/11은 0회),
# 두 곳이 getUpdates를 나눠 읽으면 ✅ 버튼 기록이 서로 꼬인다. 일정 알림은 맥 launchd(ALERT_MODE=all)가 맡는다.
on:
  workflow_dispatch:

# 상태 파일(ipsi_state.json)을 커밋해 다음 실행이 변동을 비교할 수 있게 한다
concurrency:
  group: ipsi-alert
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 상태를 레포에 커밋하면 로컬 작업과 매번 충돌한다 → 캐시로 옮김
      - uses: actions/cache@v4
        with:
          path: tools/ipsi_state.json
          key: ipsi-state-${{ github.run_id }}
          restore-keys: ipsi-state-

      - name: 일정 확인 후 알림
        env:
          TG_BOT_TOKEN: ${{ secrets.IPSI_TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.IPSI_TG_CHAT_ID }}
          IPSI_SYNC_KEY: ${{ secrets.IPSI_SYNC_KEY }}   # 학습포털과 완료 현황 동기화
          # 경쟁률은 맥(한국 IP)이 맡는다. 해외 IP는 Cloudflare가 원본에 붙지 못해(521) 실패한다
          ALERT_MODE: deadline
        run: python3 tools/ipsi_alert.py

