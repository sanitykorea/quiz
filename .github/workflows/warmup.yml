# Render 무료 플랜은 15분 무활동이면 서비스가 잠들고, 다음 첫 요청이 30~60초 걸린다.
# 시험 당일 채점처럼 "바로 써야 하는" 시간대에 미리 깨워두기 위한 핑.
name: keep-warm

on:
  schedule:
    # UTC 기준. 05:00~09:59 UTC = 한국시간 14:00~18:59 · 10분 간격
    - cron: '*/10 5-9 * * *'
  workflow_dispatch:        # 필요할 때 수동 실행도 가능

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: 서비스 깨우기
        run: |
          URL="https://jisik-tower.onrender.com/api/session"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 180 "$URL" || echo 000)
            t=$(date -u '+%H:%M:%S UTC')
            echo "시도 $i · $t · HTTP $code"
            if [ "$code" = "200" ]; then
              echo "✅ 서비스 준비됨"
              exit 0
            fi
            sleep 20
          done
          echo "⚠️ 깨우지 못함 (다음 스케줄에 재시도)"
          exit 0
