<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  a{ color:var(--accent-b); text-decoration:none; } a:hover{ color:var(--gold); }
  ::selection{ background:rgba(255,224,102,.28); color:#fff; }
  textarea,input,select,button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  @keyframes bossPulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,84,104,.30);} 50%{ box-shadow:0 0 28px rgba(255,84,104,.62);} }
  @keyframes goldGlow{ 0%,100%{ text-shadow:0 0 12px rgba(255,224,102,.45);} 50%{ text-shadow:0 0 22px rgba(255,224,102,.85);} }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }
  @keyframes orbGlow{ 0%,100%{ box-shadow:0 0 32px rgba(46,230,166,.45), inset 0 0 30px rgba(255,224,102,.22);} 50%{ box-shadow:0 0 58px rgba(46,230,166,.72), inset 0 0 42px rgba(255,224,102,.4);} }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  @keyframes blink{ 0%,100%{ opacity:.25;} 50%{ opacity:1;} }
  @keyframes toastUp{ 0%{opacity:0;transform:translate(-50%,12px) scale(.85);} 14%{opacity:1;transform:translate(-50%,0) scale(1.08);} 28%{transform:translate(-50%,0) scale(1);} 78%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-46px) scale(1);} }
  @keyframes popIn{ 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.12);} 100%{transform:scale(1);opacity:1;} }
  @keyframes shakeX{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }
  @keyframes sheen{ 0%{background-position:-140% 0;} 100%{background-position:240% 0;} }
  [data-theme="light"]{ --bg:#ece3d0 !important; --bg2:#f3ecdb !important; --panel:#fffdf6 !important; --panel2:#f4ecd9 !important; --border:#ddceac !important; --line:#e7dcc4 !important; --header:rgba(255,251,240,.9) !important; --text:#2a2620 !important; --text2:#6a6250 !important; --text3:#9a9075 !important; --accent:#0f6a53 !important; --accent-b:#0d855f !important; --gold:#a9781a !important; --gold-d:#7d580f !important; --danger:#c0392b !important; --danger-b:#c94636 !important; --inset:#efe6d2 !important; --tintB:rgba(70,110,200,.10) !important; --tintO:rgba(200,120,40,.11) !important; --tintP:rgba(170,80,190,.10) !important; --blue:#2f56c0 !important; --orange:#a85712 !important; --pink:#9a2fae !important; --bluebd:rgba(70,110,200,.4) !important; --orangebd:rgba(200,120,40,.42) !important; --pinkbd:rgba(170,80,190,.4) !important; background: radial-gradient(1100px 640px at 50% -12%, #fffaf0, rgba(255,250,240,0) 60%), radial-gradient(820px 560px at 100% 100%, rgba(15,106,83,.10), rgba(0,0,0,0) 55%), var(--bg) !important; }
  input,textarea,select{ outline:none; }
</style>
</head>
<body>
<div id="root" data-theme="dark" style="--bg:#06090f;--bg2:#0b1120;--panel:#101a2c;--panel2:#0b1322;--border:#213152;--line:#182541;--header:rgba(8,12,20,.82);--text:#e9eef8;--text2:#9db0d0;--text3:#5d6f8f;--accent:#14755C;--accent-b:#2ee6a6;--gold:#FFE066;--gold-d:#c9a227;--danger:#ff5468;--danger-b:#ff8093;--inset:#0a1120;--tintB:rgba(30,52,96,.5);--tintO:rgba(70,44,20,.5);--tintP:rgba(66,26,74,.5);--blue:#9ab6ff;--orange:#ffb673;--pink:#e6a0f2;--bluebd:rgba(122,162,255,.42);--orangebd:rgba(255,160,80,.42);--pinkbd:rgba(226,120,240,.45); min-height:100vh; background: radial-gradient(1200px 720px at 50% -12%, #12233f 0%, rgba(18,35,63,0) 58%), radial-gradient(900px 640px at 100% 100%, rgba(20,117,92,.20), rgba(0,0,0,0) 55%), radial-gradient(760px 520px at 0% 92%, rgba(255,224,102,.08), rgba(0,0,0,0) 55%), var(--bg); color:var(--text); font-family:'Pretendard', system-ui, -apple-system, sans-serif; line-height:1.55; -webkit-tap-highlight-color:transparent;"></div>

<script>
const EXAM_DATE = '2026-08-11';
const $ = document.getElementById('root');
const h = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// AI(마크다운) 응답용 경량 렌더: **볼드** *이탤릭* `코드` 불릿 → HTML (먼저 이스케이프)
const mdLite = s => h(s)
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>')
  .replace(/`([^`]+?)`/g,'<code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:.92em;">$1</code>')
  .replace(/^\s*[-*]\s+/gm,'• ')
  .replace(/^\s*#{1,4}\s*(.+)$/gm,'<b>$1</b>');

const S = {
  gateMode:'loading', setup:false, isAdmin:false,
  entry:'', setupFirst:'', gateError:'',
  theme:'dark', tab:'camp', now:Date.now(),
  sleepDone:false, wakeDone:false,
  mins:{math:0,sci:0,kor:0,nc2:0}, running:null, runStart:0,
  nc2Pick:['사회','한국사'], lockPreview:false,
  towerUnit:0, deckIdx:0, flipped:false, known:{}, dodgeText:'', dodgeLoading:false,
  topic:'', blankText:'', blankResult:'', blankLoading:false, recording:false,
  checklist:{acad:false,comm:false,self:false,dili:false},
  ai:null,
  stance:'A', messages:[], input:'', chatLoading:false,
  units:[], cards:[], schedule:[], studyStats:null, explain:{},
  qFacets:{subject:[],year:[],exam_round:[],level:[]}, qFilter:{}, qList:[], qCurrent:null, qMsg:'',
  quizItems:[], quizIdx:0, quizMarks:{}, showRaw:false, streak:0,
  bankMode:'instant', picks:{}, graded:false,
  wrongData:null, wrongAnalysis:'', wrongPdfMsg:'', wrongGradeMsg:'', wrongGradeResult:null,
  examSel:{}, examKeys:null, examInputs:{}, examScore:null, examResults:[], examMsg:'',
  history:[],
  towerSubject:'도덕', dodeok:null, towerConcept:{},
  adminTab:'questions', adminMsg:'', muted:false,
};
const PTS=subj=>subj==='수학'?5:4;   // 배점: 수학 5점/문항, 나머지 4점/문항
let _barrierActive = null;

// ---------- api ----------
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  let j = {}; try{ j = await r.json(); }catch(e){}
  return {ok:r.ok, status:r.status, ...j};
}
const jbody = o => ({body: JSON.stringify(o)});

// ---------- persistence ----------
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let _saveT=0;
function persist(){
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    const st={ day:ymd(new Date()), theme:S.theme, sleepDone:S.sleepDone, wakeDone:S.wakeDone,
      mins:S.mins, nc2Pick:S.nc2Pick, towerUnit:S.towerUnit, deckIdx:S.deckIdx, known:S.known,
      checklist:S.checklist, stance:S.stance, muted:S.muted, messages:(S.messages||[]).slice(-40) };
    api('/api/state', {method:'POST', ...jbody({state:st})});
  }, 400);
}
function patch(o){ Object.assign(S,o); persist(); render(); }

// ---------- boot ----------
async function boot(){
  const s = await api('/api/session');
  S.setup = !!s.setup; S.isAdmin = !!s.isAdmin; S.ai = s.ai || null;
  if(s.authed){ await openApp(); }
  else { S.gateMode = s.setup ? 'setup' : 'locked'; render(); }
  setInterval(tick, 1000);
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }
async function loadStudy(){
  const r=await api('/api/study?today='+ymd(new Date())+'&weekStart='+daysAgo(6)+'&periodStart='+daysAgo(20));
  if(r.today) S.mins = r.today;
  S.studyStats = {week:r.week||{}, period:r.period||{}, total:r.total||{}, days:r.days||[]};
}
let _studyT=0;
function saveStudy(){
  clearTimeout(_studyT);
  _studyT=setTimeout(()=>api('/api/study',{method:'POST',...jbody({date:ymd(new Date()), mins:S.mins})}), 500);
}
async function openApp(){
  const [st, u, c, sc] = await Promise.all([api('/api/state'), api('/api/units'), api('/api/cards'), api('/api/schedule')]);
  S.units = u.units||[]; S.cards = c.cards||[]; S.schedule = sc.schedule||[];
  const saved = st.state || {};
  const today = ymd(new Date());
  const daily = saved.day===today ? saved : {};
  S.theme = saved.theme || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  S.sleepDone = !!daily.sleepDone; S.wakeDone = !!daily.wakeDone;
  await loadStudy();   // 학습시간은 서버 로그에서 (새로고침해도 유지 + 이력)
  S.nc2Pick = saved.nc2Pick || ['사회','한국사'];
  S.towerUnit = saved.towerUnit||0; S.deckIdx = saved.deckIdx||0; S.known = saved.known||{};
  S.checklist = saved.checklist || {acad:false,comm:false,self:false,dili:false};
  S.stance = saved.stance || 'A';
  S.muted = !!saved.muted;
  S.messages = (saved.messages&&saved.messages.length) ? saved.messages
    : [{role:'assistant', text:'수영! 《지식의 탑》에 잘 왔어 ⚔️ 나는 너의 수호령이야.\n오늘 첫 퀘스트부터 같이 정해볼까? 아래 스펠을 눌러도 좋아.'}];
  S.gateMode = 'open';
  if(saved.day!==today) persist(); // 일일 초기화 저장
  render();
  if(S.towerSubject==='도덕' && !S.dodeok) loadDodeok().then(render);   // 도덕 노트 미리 로드(초기 탭이 수련의 탑이어도 표시)
}

// ---------- gate ----------
async function tapKey(n){
  if(S.entry.length>=4) return;
  S.entry += String(n); S.gateError=''; render();
  if(S.entry.length===4){ setTimeout(submitPin, 120); }
}
function delKey(){ S.entry=S.entry.slice(0,-1); S.gateError=''; render(); }
async function submitPin(){
  const pin=S.entry;
  if(S.gateMode==='setup'){
    if(!S.setupFirst){ S.setupFirst=pin; S.entry=''; render(); return; }
    if(S.setupFirst===pin){
      const r=await api('/api/setup',{method:'POST',...jbody({pin})});
      if(r.ok){ S.entry=''; S.setupFirst=''; S.isAdmin=true; await openApp(); }
      else { S.entry=''; S.setupFirst=''; S.gateError='봉인 등록 실패. 다시 시도해줘.'; render(); }
    } else { S.entry=''; S.setupFirst=''; S.gateError='봉인 문양이 일치하지 않아. 처음부터 다시 새겨줘.'; render(); }
  } else {
    const r=await api('/api/unlock',{method:'POST',...jbody({pin})});
    if(r.ok){ S.entry=''; S.gateError=''; S.isAdmin=true; await openApp(); }
    else { S.entry=''; S.gateError='봉인 해제 실패. 문양을 다시 확인해.'; render(); }
  }
}
async function relock(){ await api('/api/relock',{method:'POST'}); S.gateMode='locked'; S.entry=''; S.setupFirst=''; S.gateError=''; render(); }

// ---------- study logic ----------
function examDate(){ const p=EXAM_DATE.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dday(){ const t=examDate(),n=new Date(S.now); return Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000); }
function bossDateStr(){ const t=examDate(); return ymd(t)+' ('+['일','월','화','수','목','금','토'][t.getDay()]+')'; }
function liveMins(sub){ const base=S.mins[sub]||0; return S.running===sub ? base+(S.now-S.runStart)/60000 : base; }
function toggleTimer(sub){ if(barrier().active) return; if(S.running===sub){ commit(); } else { if(S.running) commit(); S.running=sub; S.runStart=Date.now(); render(); } }
function commit(){ const sub=S.running; if(!sub) return; const add=(Date.now()-S.runStart)/60000; S.mins={...S.mins,[sub]:(S.mins[sub]||0)+add}; S.running=null; S.runStart=0; saveStudy(); render(); }
function addMins(sub,d){ S.mins={...S.mins,[sub]:Math.max(0,(S.mins[sub]||0)+d)}; saveStudy(); render(); }
function pickNc2(sub){ let p=[...S.nc2Pick]; if(p.includes(sub)){ if(p.length>1) p=p.filter(x=>x!==sub); } else { p.push(sub); if(p.length>2) p.shift(); } patch({nc2Pick:p}); }
const WD=['일','월','화','수','목','금','토'];
function hm(s){ const p=String(s||'0:0').split(':'); return (+p[0]||0)+(+p[1]||0)/60; }
function barrierFor(kind, tag){
  return kind==='seal'
    ? {active:true,icon:'🔒',title:'수호령의 결계 발동 중!',tag,text:'현재는 탑 밖의 의무에 집중할 시간입니다. 학습 타이머와 알림이 봉인됩니다.'}
    : {active:true,icon:'🛡️',title:'정찰 임무 수행 중',tag,text:'외부 정찰 임무(고정일정)에 집중할 시간입니다. 타이머가 잠시 봉인됩니다.'};
}
function barrier(){
  if(S.lockPreview) return barrierFor('seal','미리보기 · 결계 테스트');
  const d=new Date(S.now),wd=WD[d.getDay()],hh=d.getHours()+d.getMinutes()/60;
  for(const s of (S.schedule||[])){
    if(s.day===wd && hh>=hm(s.t_start) && hh<hm(s.t_end))
      return barrierFor(s.kind, `${wd} ${s.t_start}–${s.t_end} · ${s.name}`);
  }
  return {active:false};
}
function nextUnit(){ const n=S.units.filter(u=>u.subject===S.towerSubject).length; if(!n) return; patch({towerUnit:(S.towerUnit+1)%n}); }
function flip(){ S.flipped=!S.flipped; render(); }
function critical(){ const c=S.cards[S.deckIdx]; if(!c) return; toast('🗡 치명타!  몬스터 처치','good'); patch({known:{...S.known,[c.id]:true}, deckIdx:(S.deckIdx+1)%S.cards.length, flipped:false, dodgeText:''}); }
function renderSegs(body){ return String(body||'').split('**').map((t,i)=> i%2 ? `<span style="color:var(--gold);font-weight:800;text-shadow:0 0 10px rgba(255,224,102,.5);background:rgba(255,224,102,.10);padding:0 3px;border-radius:4px;">${h(t)}</span>` : h(t)).join(''); }

// ---------- AI ----------
function ctx(){ const r=v=>Math.round(liveMins(v)); const b=barrier();
  return `[학생 현재 상태] D-${dday()} (검정고시 ${EXAM_DATE}). 오늘 학습: 수학 ${r('math')}/120분, 과학 ${r('sci')}/60분, 국어 ${r('kor')}/60분, ${S.nc2Pick.join('+')} ${r('nc2')}/120분. 루틴: 취침체크 ${S.sleepDone?'O':'X'}, 기상체크 ${S.wakeDone?'O':'X'}.${b.active?' 현재 '+b.tag+' (봉인 상태).':''}`; }
function systemFor(stance){ const base = stance==='A'
  ? "너는 RPG '동반 수호령'이야. 검정고시와 성공회대 입시를 준비하는 '수영'의 든든한 동료 요정이야. 반말로, 따뜻하지만 솔직하게 멘탈과 루틴을 케어해. 판타지 톤(퀘스트·EXP·결계·탑)을 가볍게 섞고, 답은 짧고 힘이 나게. 이모지는 절제해서 사용해."
  : "당신은 RPG '현자 수호령'입니다. 검정고시 개념과 백지테스트를 지도하는 튜터입니다. 존댓말로 정확하고 구조적으로 설명하며, '핵심 → 예시 → 암기 팁' 순서로 간결하게 안내하세요.";
  return base+"\n\n"+ctx(); }
async function callAI(messages, system, max){
  const r=await api('/api/ai',{method:'POST',...jbody({system,messages,max_tokens:max||700})});
  if(r.status===503) throw new Error('no-ai');
  if(!r.ok || r.text==null) throw new Error('fail');
  return r.text;
}
async function send(text){
  const t=(text!=null?text:S.input).trim(); if(!t||S.chatLoading) return;
  const msgs=[...S.messages,{role:'user',text:t}];
  S.messages=msgs; S.input=''; S.chatLoading=true; persist(); render(); scrollChat();
  try{ const out=await callAI(msgs.map(m=>({role:m.role,content:m.text})), systemFor(S.stance), 700);
    S.messages=[...msgs,{role:'assistant',text:(out||'').trim()}]; }
  catch(e){ const msg = e.message==='no-ai' ? '아직 수호령이 강림하지 않았어… (AI 미연결). 서버 폴더에 gemini_key.txt로 Google AI Studio 키를 넣으면 소환돼.' : '수호령과의 연결이 잠시 흔들렸어. 잠시 후 다시 시도해줘.';
    S.messages=[...msgs,{role:'assistant',text:msg}]; }
  S.chatLoading=false; persist(); render(); scrollChat();
}
async function dodge(){ if(S.dodgeLoading) return; const c=S.cards[S.deckIdx]; if(!c) return;
  S.dodgeLoading=true; S.dodgeText=''; render();
  try{ const out=await callAI([{role:'user',content:`다음 개념을 검정고시 수험생이 이해하기 쉽게 3~4문장으로 설명하고, 외우기 좋은 한 줄 팁을 붙여줘.\n개념: ${c.q}\n(참고 정답: ${c.a})`}], systemFor('B'), 500);
    S.dodgeText=(out||'').trim(); }
  catch(e){ S.dodgeText = e.message==='no-ai' ? '수호령 미연결. gemini_key.txt에 Google AI Studio 키를 넣어 주세요.' : '수호령의 응답을 불러오지 못했어. 잠시 후 다시 시도해줘.'; }
  S.dodgeLoading=false; render();
}
async function verify(){ const text=S.blankText.trim(); if(!text||S.blankLoading) return;
  const topic=(S.topic.trim())||(S.units[S.towerUnit]&&S.units[S.towerUnit].title)||'주제';
  S.blankLoading=true; S.blankResult=''; render();
  try{ const out=await callAI([{role:'user',content:`아래는 학생이 '${topic}'에 대해 백지에 쓴 내용입니다. 1) 잘한 점 2) 빠지거나 틀린 핵심 3) 보완 한 줄 요약 순서로 존댓말로 채점·피드백해 주세요.\n\n---\n${text}`}], systemFor('B'), 700);
    S.blankResult=(out||'').trim(); }
  catch(e){ S.blankResult = e.message==='no-ai' ? '수호령 미연결. gemini_key.txt에 Google AI Studio 키를 넣어 주세요.' : '검증에 실패했어요. 잠시 후 다시 시도해 주세요.'; }
  S.blankLoading=false; render();
}

// ---------- question bank ----------
async function loadFacets(){ const r=await api('/api/questions/facets'); S.qFacets=r; }
async function loadQuestions(random){
  const q=Object.assign({}, S.qFilter); if(random) q.random='1';
  const qs=Object.entries(q).filter(([k,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const r=await api('/api/questions'+(qs?'?'+qs:''));
  S.qList=r.questions||[]; S.qCurrent = random ? (S.qList[0]||null) : (S.qCurrent);
  S.qMsg = S.qList.length ? '' : '해당 조건의 기출이 없어요.';
  if(random) await loadQuiz();
  render();
}
async function loadQuiz(){
  S.quizItems=[]; S.quizIdx=0; S.quizMarks={}; S.showRaw=false; S.explain={}; S.streak=0; S.picks={}; S.graded=false;
  if(!S.qCurrent) return;
  const r=await api('/api/quiz?question_id='+S.qCurrent.id); S.quizItems=r.items||[];
  // 이미지 문항 미리 로드 → '다음' 즉시 반응
  S.quizItems.filter(it=>it.img).forEach(it=>{ const im=new Image(); im.src='/api/qimage?question_id='+S.qCurrent.id+'&qnum='+it.qnum; });
}
async function explainQ(qnum){
  const it=S.quizItems.find(x=>x.qnum===qnum); if(!it || S.explain[qnum]==='...') return;
  const m=S.quizMarks[qnum]||{};
  S.explain[qnum]='...'; render();
  const raw=(S.qCurrent&&S.qCurrent.raw_text)||'';
  const ctx = it.image ? `${S.qCurrent.subject} 기출 ${qnum}번 문항입니다. (원문 발췌)\n${raw.slice(0,3000)}` :
    `[지문]\n${it.passage||'(없음)'}\n\n[문항 ${qnum}] ${it.stem}\n선지: ${it.choices.map(c=>c.n+') '+c.text).join(' / ')}`;
  const chosen = m.chosen===0?'모름(안 풂)':(m.chosen?m.chosen+'번':'-');
  try{
    const out=await callAI([{role:'user',content:`아래 ${S.qCurrent.subject} 문제를 학생이 풀었습니다. 학생 선택: ${chosen}, 정답: ${it.answer}번.\n왜 정답이 ${it.answer}번인지, 그리고 학생이 고른/헷갈릴 선지는 왜 틀렸는지 핵심만 존댓말로 쉽게 설명해 주세요. 3~5문장.\n\n${ctx}`}], systemFor('B'), 600);
    S.explain[qnum]=(out||'').trim();
  }catch(e){ S.explain[qnum] = e.message==='no-ai' ? '수호령 미연결(GEMINI_API_KEY 필요).' : '해설을 불러오지 못했어요. 잠시 후 다시.'; }
  render();
}
async function pickQuestion(id){ S.qCurrent=S.qList.find(x=>x.id==id)||null; await loadQuiz(); render(); }
async function mark(qnum, choice){
  if(!S.qCurrent || S.quizMarks[qnum]) return;   // 이미 채점된 문항은 재채점 안 함
  const r=await api('/api/attempt',{method:'POST',...jbody({question_id:S.qCurrent.id, qnum, chosen:choice})});
  if(r.ok){
    S.quizMarks[qnum]={chosen:choice, correct:r.correct, answer:r.answer};
    if(r.correct){ S.streak=(S.streak||0)+1; const xp=10*Math.min(S.streak,5); toast(S.streak>=2?`🔥 ${S.streak} 연속!  +${xp} XP`:`⚔️ 명중!  +10 XP`, 'good'); }
    else { const had=S.streak; S.streak=0; toast(choice===0?'🤔 다음엔 맞혀보자':(had>=2?`💥 콤보 끊김…`:'💧 아쉬워요'), 'bad'); }
    render();
  } else if(r.error==='no_key'){
    toast('🔑 이 문제는 정답키가 아직 없어요', 'bad');   // 정답표 미등록 → 채점 불가
  }
}
function toast(text, kind){
  const good=kind==='good';
  const el=document.createElement('div');
  el.textContent=text;
  el.style.cssText=`position:fixed;left:50%;top:20%;z-index:300;transform:translateX(-50%);padding:12px 24px;border-radius:999px;font-weight:800;font-size:17px;pointer-events:none;white-space:nowrap;color:${good?'#2a1c00':'#fff'};background:${good?'linear-gradient(180deg,#ffe58a,#f2b705)':'linear-gradient(180deg,#ff8093,#e0384b)'};box-shadow:0 10px 34px rgba(0,0,0,.4),0 0 22px ${good?'rgba(255,200,60,.6)':'rgba(255,80,104,.5)'};animation:toastUp 1.4s ease forwards;`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1450);
}
function quizNav(d){ const n=S.quizItems.length; if(!n) return; S.quizIdx=(S.quizIdx+d+n)%n; render(); scrollTop(); }
function scrollTop(){ const el=document.getElementById('quizCard'); if(el) el.scrollIntoView({block:'start',behavior:'smooth'}); }
async function loadWrong(){ const r=await api('/api/wrong'); S.wrongData=r; S.wrongAnalysis=''; render(); }
async function reviewWrong(qid, subject, year, round, qnum){
  S.tab='bank'; S.qFilter={subject, year, exam_round:round};
  if(!S.qFacets.subject.length) await loadFacets();
  await loadQuestions(false);
  await pickQuestion(qid);
  const idx=S.quizItems.findIndex(it=>it.qnum==qnum);   // 해당 문항으로 바로 이동
  if(idx>=0) S.quizIdx=idx;
  render();
}
async function scoreQuestion(){ const q=S.qCurrent; if(!q) return;
  S.qMsg='🧚 수호령이 기출을 분석하는 중...'; render();
  try{ const out=await callAI([{role:'user',content:`다음은 검정고시 ${q.subject} 기출 지문/문항 원문입니다. 수험생이 공부에 활용하도록 (1) 핵심 출제 포인트 3가지 (2) 자주 헷갈리는 함정 (3) 암기 팁을 존댓말로 정리해 주세요.\n\n---\n${(q.raw_text||'').slice(0,3500)}`}], systemFor('B'), 800);
    S.qMsg=''; S.qCurrent=Object.assign({}, q, {_ai:(out||'').trim()}); }
  catch(e){ S.qMsg = e.message==='no-ai' ? '수호령 미연결(gemini_key.txt에 Google AI Studio 키 필요).' : '분석 실패. 잠시 후 다시.'; }
  render();
}

async function adminReload(){
  const t=S.adminTab, r=await api('/api/'+t);
  S.adminList = r[t] || [];
  if(t==='units') S.units=S.adminList; if(t==='cards') S.cards=S.adminList; if(t==='schedule') S.schedule=S.adminList;

function adminFields(tab){ return {questions:['year','exam_round','level','subject','raw_text'], units:['subject','title','body','ord'], cards:['q','a','ord'], schedule:['day','t_start','t_end','name','kind','ord']}[tab]; }
async function adminSave(id){
  const tab=S.adminTab, obj={};
  adminFields(tab).forEach(f=>{ const el=document.getElementById('f_'+(id||'new')+'_'+f); if(el) obj[f]=el.value; });
  let r;
  if(id) r=await api('/api/'+tab+'/'+id,{method:'PUT',...jbody(obj)});
  else r=await api('/api/'+tab,{method:'POST',...jbody(obj)});
  S.adminMsg = r.ok ? '저장됨 ✅' : ('저장 실패: '+(r.error||r.status));
  await adminReload();
}
async function adminDelete(id){ if(!confirm('삭제할까요?')) return; await api('/api/'+S.adminTab+'/'+id,{method:'DELETE'}); S.adminMsg='삭제됨'; await adminReload(); }

// ---------- ticker ----------
function tick(){
  S.now=Date.now();
  if(S.gateMode!=='open') return;
  const b=barrier();
  if(S.running && b.active) commit();
  if(b.active!==_barrierActive){ _barrierActive=b.active; render(); return; }
  if(S.tab==='camp' && S.running) render(); // 타이머 작동 중에만 갱신(입력창 없어 안전)
}

function fmtMin(t){ t=Math.round(t); return t>=60 ? `${Math.floor(t/60)}시간 ${t%60}분` : `${t}분`; }
function studyStatsCard(){
  const s=S.studyStats; if(!s) return '';
  const sum=o=>Math.round((o.math||0)+(o.sci||0)+(o.kor||0)+(o.nc2||0));
  const today=sum(S.mins), week=sum(s.week||{}), total=sum(s.total||{});
  const period=s.period||{};
  const byDate={}; (s.days||[]).forEach(d=>byDate[d.date]=Math.round((d.math||0)+(d.sci||0)+(d.kor||0)+(d.nc2||0)));
  const tk=ymd(new Date());
  const stat=(lb,v,col)=>`<div style="flex:1;min-width:100px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--panel2);"><div style="font-size:12px;color:var(--text2);">${lb}</div><div style="font-size:18px;font-weight:800;color:${col};margin-top:4px;">${fmtMin(v)}</div></div>`;
  // 과목별 (최근 3주)
  const subs=[['math','수학','#2ee6a6'],['sci','과학','#ffb35c'],['kor','국어','#8ab4ff'],['nc2',(S.nc2Pick||[]).join('·')||'선택','#ffe066']];
  const smax=Math.max(1,...subs.map(([k])=>period[k]||0));
  const subRows=subs.map(([k,lb,col])=>{ const v=Math.round(period[k]||0); return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><span style="width:64px;font-size:13px;color:var(--text2);">${lb}</span><div style="flex:1;height:14px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;"><div style="height:100%;width:${v/smax*100}%;background:${col};border-radius:999px;transition:width .4s;"></div></div><span style="width:64px;text-align:right;font-size:12.5px;font-weight:700;color:${col};">${fmtMin(v)}</span></div>`; }).join('');
  // 최근 21일(3주) 일별 막대
  const bars=[...Array(21)].map((_,i)=>{ const dt=new Date(); dt.setDate(dt.getDate()-(20-i)); const key=ymd(dt); const v=key===tk?today:(byDate[key]||0); const hp=Math.min(100,v/360*100); const on=key===tk; const dd=dt.getDate();
    return `<div title="${key} · ${v}분" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;"><div style="width:100%;height:56px;display:flex;align-items:flex-end;"><div style="width:100%;background:${v?'linear-gradient(180deg,#2ee6a6,#14755C)':'var(--panel2)'};border:1px solid ${on?'var(--gold-d)':'var(--border)'};border-radius:3px 3px 0 0;height:${Math.max(3,hp)}%;"></div></div><div style="font-size:8px;color:${on?'var(--gold)':'var(--text3)'};">${(dt.getDay()===1||on)?dd:''}</div></div>`;
  }).join('');
  return `<section style="background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;padding:18px;">
    <h3 style="margin:0 0 14px;font-size:16px;font-weight:800;">📊 학습 통계 <span style="font-size:12px;color:var(--text2);font-weight:600;">· 서버에 계속 쌓여요</span></h3>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">${stat('오늘',today,'var(--accent-b)')}${stat('이번 주',week,'var(--gold)')}${stat('최근 3주',sum(period),'#e6a0f2')}${stat('누적',total,'#8ab4ff')}</div>
    <div style="font-size:12px;color:var(--text2);font-weight:700;margin-bottom:10px;">과목별 (최근 3주)</div>
    ${subRows}
    <div style="font-size:11px;color:var(--text3);margin:16px 0 8px;">최근 3주 (막대 = 하루 학습량, 목표 360분 · 월요일에 날짜 표시)</div>
    <div style="display:flex;gap:3px;align-items:flex-end;">${bars}</div>
  </section>`;
}

let _upFiles=[];   // 선택한 업로드 파일(재렌더로 input이 비워져도 유지)
const SUBJS=['국어','수학','영어','사회','과학','도덕','한국사'];
function parseMeta(fn){
  // 파일명에서 연도·회차·과정·과목을 유연하게 추출 (구분자·순서 무관)
  // 맥 파일명은 NFD(자모 분리)라 NFC로 정규화해야 한글 매칭됨
  const base=fn.replace(/\.[pP][dD][fF]$/,'').normalize('NFC');
  const type=/정답|답안/.test(base)?'정답':'문제';
  const ym=base.match(/(20\d\d)/);
  const rm=base.match(/([12])\s*(?:차|회|교시)/) || base.replace(/20\d\d/,'').match(/(?:^|[_\-\s])([12])(?:[_\-\s]|$)/);
  const level=/고졸/.test(base)?'고졸학력':(/고등/.test(base)?'고등':'');
  const subject=SUBJS.find(s=>base.includes(s))||'';   // 정답표엔 과목이 없으면 회차 전체로 반영
  const meta={type, year:ym?ym[1]+'년도':'', exam_round:rm?rm[1]+'차시험':'', level, subject};
  const ok=meta.year&&meta.exam_round&&meta.level&&(type==='정답'||subject);
  return ok?meta:null;
}
async function uploadPdf(){
  const inp=document.getElementById('up_file');
  let files=_upFiles.length?_upFiles:(inp?[...inp.files]:[]);   // 저장분 우선(재렌더 대비)
  if(!files.length){ S.adminMsg='⚠️ 파일을 선택하세요.'; render(); return; }
  // 문제를 먼저 처리해야 정답표가 붙을 문제가 존재함(정답은 맨 뒤로)
  files=files.slice().sort((a,b)=>(/정답|답안/.test(a.name.normalize('NFC'))?1:0)-(/정답|답안/.test(b.name.normalize('NFC'))?1:0));
  const form={type:document.getElementById('up_type').value, year:document.getElementById('up_year').value.trim(), exam_round:document.getElementById('up_round').value, level:document.getElementById('up_level').value, subject:document.getElementById('up_subject').value.trim()};
  let ok=0, fail=0, errs=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    let meta=parseMeta(f.name);
    if(!meta){ if(files.length===1 && form.year && (form.type!=='문제'||form.subject)) meta=form; else { fail++; errs.push(f.name+'(파일명 인식 실패)'); continue; } }
    S.adminMsg=`📤 ${i+1}/${files.length} 처리 중… ${f.name}`; render();
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    const res=await api('/api/upload',{method:'POST',...jbody({...meta, data})});
    if(res.ok) ok++; else { fail++; errs.push(f.name+'('+(res.error||res.status)+')'); }
  }
  _upFiles=[];   // 처리 끝 → 저장분 비움(다음 선택 위해)
  S.adminMsg=`✅ ${ok}건 완료${fail?` · ❌ ${fail}건 실패: ${errs.join(', ')}`:''}`;
  if(!S.qFacets.subject.length) await loadFacets(); await adminReload();
}

    if(big) return `<textarea id="${id}" placeholder="${ph}" style="width:100%;min-height:${f==='raw_text'?'120px':'70px'};padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;line-height:1.6;">${h(val||'')}</textarea>`;
    return `<input id="${id}" placeholder="${ph}" title="${ph}" value="${h(val==null?'':val)}" style="padding:9px 11px;border-radius:8px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:13px;min-width:90px;flex:${f==='q'||f==='a'||f==='name'?'1':'0 0 auto'};">`;
  };
  const newForm=`<div style="border:1px dashed var(--gold-d);border-radius:14px;padding:16px;background:rgba(255,224,102,.05);margin-bottom:18px;">
    <div style="font-weight:800;margin-bottom:10px;color:var(--gold);">➕ 새 항목 추가</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;">${fields.map(f=>fieldInput(null,f,'')).join('')}</div>
    <button data-act="asave" data-arg="new" style="margin-top:10px;padding:9px 18px;border-radius:10px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.2);color:var(--accent-b);font-weight:700;cursor:pointer;">저장</button></div>`;
  const list=(S.adminList||[]).map(row=>`<div style="border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--panel);margin-bottom:12px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><span style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--text3);">#${row.id}</span>
    <button data-act="adel" data-arg="${row.id}" style="padding:5px 12px;border-radius:8px;border:1px solid rgba(255,84,104,.5);background:rgba(255,84,104,.1);color:var(--danger-b);font-size:12px;cursor:pointer;">삭제</button></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;">${fields.map(f=>fieldInput(row.id,f,row[f])).join('')}</div>
    <button data-act="asave" data-arg="${row.id}" style="margin-top:10px;padding:8px 16px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text2);font-weight:700;cursor:pointer;">수정 저장</button></div>`).join('');

    <h2 style="margin:6px 0 0;font-size:22px;font-weight:800;">🛠 관리소 <span style="font-size:13px;color:var(--text2);font-weight:600;">· 내용 추가/수정</span></h2>
    <p style="margin:6px 0 0;color:var(--text2);font-size:13px;">기출 문제 · 학습 지문(<b>**단어**</b>=금색 강조) · 플래시카드 · 고정일정(결계)을 편집합니다.</p></div>
    ${uploadCard()}
    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;">${nav}</div>
    ${S.adminMsg?`<div style="margin-bottom:12px;color:var(--accent-b);font-size:13px;">${h(S.adminMsg)}</div>`:''}
    ${newForm}${list||'<div style="color:var(--text3);">항목이 없습니다.</div>'}</div>`;
}

const CIRC=['','①','②','③','④','⑤'];
function quiz(){
  const its=S.quizItems;
  if(!its.length) return `<div style="border:1px solid var(--border);border-radius:16px;padding:24px;color:var(--text3);font-size:14px;text-align:center;">문항을 불러오는 중이거나 분해할 수 없는 기출이에요. <b>📄 전체 원문</b>으로 확인하세요.</div>`;
  const idx=Math.min(S.quizIdx,its.length-1), it=its[idx];
  const batch = S.bankMode==='batch' && !S.graded;   // 한번에 채점: 풀 땐 정답 숨김
  const picked = S.picks[it.qnum];
  const m=S.quizMarks[it.qnum];
  const marked=Object.keys(S.quizMarks).length, got=Object.values(S.quizMarks).filter(x=>x.correct).length;
  const prev=idx>0?its[idx-1]:null;
  const samePassage = it.passage && prev && prev.passage===it.passage;
  // 지문 (같은 지문 연속이면 그대로 노출)
  const passage = it.passage ? `<div style="border:1px solid var(--bluebd);background:var(--tintB);border-radius:14px;padding:14px 16px;margin-bottom:14px;">
      <div style="font-family:'Cinzel',serif;font-size:11px;color:var(--blue);letter-spacing:1px;margin-bottom:8px;">📖 지문 ${samePassage?'· 앞 문항과 동일':''}</div>
      <div style="max-height:34vh;overflow:auto;white-space:pre-wrap;font-size:14.5px;line-height:1.85;color:var(--text);">${h(it.passage)}</div></div>` : '';
  // 발문 (수학 등: PDF 원본 이미지)
  const stem = it.img
    ? `<img src="/api/qimage?question_id=${S.qCurrent.id}&qnum=${it.qnum}" alt="${it.qnum}번 문항" style="width:100%;max-width:680px;border-radius:12px;background:#fff;display:block;margin:0 auto 4px;">`
    : it.image
    ? `<div style="font-size:17px;font-weight:700;line-height:1.6;">${it.stem?h(it.stem):''}</div><div style="margin-top:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--gold-d);background:rgba(255,224,102,.08);color:var(--gold);font-size:13px;">🖼 원문 이미지를 준비하지 못한 문항이에요. <b>📄 전체 원문</b>으로 확인하세요.</div>`
    : `<div style="font-size:18px;font-weight:700;line-height:1.7;white-space:pre-wrap;font-family:'Nanum Myeongjo','Batang',serif;">${h(it.stem)}</div>`;
  // 선지 (이미지 문항은 원 버튼만; 텍스트 문항은 선지 텍스트 포함)
  const act = batch ? 'pick' : 'mark';
  const disabled = batch ? false : !!m;
  const choices=it.choices.map(c=>{
    let bg='var(--panel2)', bd='var(--border)', col='var(--text)', extra='';
    if(batch && picked===c.n){ bg='rgba(255,224,102,.16)'; bd='var(--gold-d)'; col='var(--gold)'; extra='●'; }   // 선택만 표시(정답 숨김)
    else if(m){
      if(c.n===it.answer){ bg='rgba(20,117,92,.28)'; bd='rgba(46,230,166,.6)'; col='var(--accent-b)'; extra='✓'; }
      else if(c.n===m.chosen){ bg='rgba(255,84,104,.18)'; bd='rgba(255,84,104,.6)'; col='var(--danger-b)'; extra='✗'; }
      else { col='var(--text3)'; }
    }
    if(it.img) return `<button data-act="${act}" data-arg="${it.qnum}:${c.n}" ${disabled?'disabled':''} style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0;border-radius:12px;border:1px solid ${bd};background:${bg};color:${col};font-size:20px;cursor:${disabled?'default':'pointer'};">${CIRC[c.n]}<span style="font-size:15px;font-weight:800;">${extra}</span></button>`;
    return `<button data-act="${act}" data-arg="${it.qnum}:${c.n}" ${disabled?'disabled':''} style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid ${bd};background:${bg};color:${col};font-size:15.5px;cursor:${disabled?'default':'pointer'};font-family:'Nanum Myeongjo','Batang',serif;">
      <span style="font-size:18px;flex:0 0 auto;">${CIRC[c.n]}</span><span style="flex:1;${c.text?'':'color:var(--text3)'}">${h(c.text)||'(원문·이미지 참조)'}</span><span style="color:inherit;font-weight:800;">${extra}</span></button>`;
  }).join('');
  const choiceWrap = it.img ? 'display:flex;gap:9px;' : 'display:grid;gap:9px;';
  const unknownBtn = (m||batch) ? '' : `<button data-act="mark" data-arg="${it.qnum}:0" style="width:100%;margin-top:9px;padding:11px;border-radius:12px;border:1px dashed var(--border);background:var(--panel2);color:var(--text3);font-size:14px;font-weight:600;cursor:pointer;">🤔 모름 · 정답 보기</button>`;
  const result = m ? `<div style="margin-top:12px;font-size:15px;font-weight:800;color:${m.correct?'var(--accent-b)':(m.chosen===0?'var(--pink)':'var(--danger-b)')};">${m.correct?'✓ 정답!':(m.chosen===0?`🤔 모름 — 정답은 ${CIRC[it.answer]}`:`✗ 오답 · 정답은 ${CIRC[it.answer]}`)}</div>` : '';
  const ex = S.explain[it.qnum];
  const explainBox = m ? (
    ex==='...' ? `<div style="margin-top:10px;font-size:13px;color:var(--pink);display:flex;align-items:center;gap:8px;"><span style="animation:blink 1s infinite;">🧚</span> 수호령이 해설을 영창하는 중...</div>`
    : ex ? `<div style="margin-top:10px;background:var(--inset);border:1px solid var(--pinkbd);color:var(--text);border-radius:12px;padding:13px;font-size:14px;line-height:1.75;white-space:pre-wrap;">${mdLite(ex)}</div>`
    : `<button data-act="explainq" data-arg="${it.qnum}" style="margin-top:10px;padding:9px 14px;border-radius:10px;border:1px solid var(--pinkbd);background:var(--tintP);color:var(--pink);font-size:13px;font-weight:700;cursor:pointer;">🧚 왜 이게 정답인지 해설 보기</button>`
  ) : '';
  const subj=S.qCurrent?S.qCurrent.subject:'', pts=PTS(subj);
  const gradeBtn = (S.bankMode==='batch'&&!S.graded) ? `<button data-act="gradeall" style="width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--gold-d);background:linear-gradient(180deg,rgba(255,224,102,.2),rgba(255,180,60,.12));color:var(--gold);font-weight:800;font-size:15px;cursor:pointer;">🎯 한번에 채점하기 (${Object.keys(S.picks).length}/${its.length} 선택)</button>` : '';
  const scoreBanner = S.graded ? `<div style="margin-top:14px;border-radius:14px;padding:16px;text-align:center;background:rgba(20,117,92,.14);border:1px solid rgba(46,230,166,.5);">
      <div style="font-size:13px;color:var(--text2);">${h(subj)} · 문항당 ${pts}점</div>
      <div style="font-size:30px;font-weight:900;color:var(--accent-b);margin:2px 0;">${got*pts}<span style="font-size:15px;">점</span> <span style="font-size:15px;color:var(--text2);">/ ${its.length*pts}</span></div>
      <div style="font-size:14px;color:var(--text2);">맞음 ${got} · 틀림 ${marked-got} · 총 ${its.length}문항</div></div>` : '';
  return `<div id="quizCard">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);">${it.qnum}번 · ${idx+1}/${its.length}</span>${S.streak>=2?`<span style="font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;background:linear-gradient(180deg,#ff8a3d,#e0384b);padding:4px 8px;border-radius:8px;box-shadow:0 0 12px rgba(255,120,60,.6);animation:popIn .3s ease;">🔥 ${S.streak} 연속</span>`:''}</div>
      <div style="font-size:12.5px;color:var(--text2);">맞음 <b style="color:var(--accent-b);">${got}</b> / 채점 ${marked} · 총 ${its.length}</div>
    </div>
    <div style="height:6px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;"><div style="height:100%;width:${(idx+1)/its.length*100}%;background:linear-gradient(90deg,#14755C,#2ee6a6,#ffe066);transition:width .3s;"></div></div>
    ${passage}
    <div style="border:1px solid var(--border);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:16px;padding:20px;box-shadow:0 10px 26px rgba(0,0,0,.35);">
      ${stem}
      <div style="${choiceWrap}margin-top:16px;">${choices}</div>
      ${unknownBtn}
      ${result}
      ${explainBox}
    </div>
    ${scoreBanner}
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button data-act="qnav" data-arg="-1" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text2);font-weight:700;font-size:14px;cursor:pointer;">◀ 이전</button>
      <button data-act="qnav" data-arg="1" style="flex:2;padding:12px;border-radius:12px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.2);color:var(--accent-b);font-weight:700;font-size:14px;cursor:pointer;">다음 문제 ▶</button>
    </div>
    ${gradeBtn}</div>`;
}

function vWrong(){
  const d=S.wrongData;
  if(!d) return '<div style="color:var(--text3);">불러오는 중...</div>';
  const subs=Object.entries(d.by_subject||{}).sort((a,b)=>b[1]-a[1]);
  const totalWrong=(d.wrong||[]).length;
  const chips=subs.length?subs.map(([s,n])=>`<div style="padding:10px 14px;border-radius:12px;border:1px solid rgba(255,84,104,.4);background:rgba(255,84,104,.08);display:flex;gap:10px;align-items:center;"><span style="font-weight:700;">${h(s)}</span><span style="font-family:'Press Start 2P',monospace;font-size:12px;color:var(--danger-b);">${n}</span></div>`).join(''):'<div style="color:var(--text3);">아직 틀린 문제가 없어요 🎉</div>';
  const item=w=>`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid ${w.repeat?'rgba(255,140,40,.55)':'var(--border)'};border-radius:12px;padding:12px 14px;background:${w.repeat?'rgba(255,140,40,.08)':'var(--panel)'};">
      ${w.repeat?`<span style="font-size:11px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ff9a3d,#e0603b);padding:3px 8px;border-radius:7px;">🔁 반복 ${w.wrong_count}회</span>`:''}
      <span style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);">${h(w.subject)}</span>
      <span style="font-size:13px;color:var(--text2);">${h(w.year)} · ${h(w.exam_round)}</span>
      <span style="font-size:14px;font-weight:700;">${w.qnum}번</span>
      <span style="font-size:13px;color:${w.chosen?'var(--danger-b)':'var(--pink)'};">${w.chosen?'내 선택 '+CIRC[w.chosen]:'🤔 모름'}</span>
      <span style="font-size:13px;color:var(--accent-b);">정답 ${CIRC[w.answer]}</span>
      <div style="margin-left:auto;display:flex;gap:6px;">
        ${w.wrong_count>1?`<button data-act="wrongdec" data-arg="${w.question_id}|${w.qnum}" title="오답 횟수 1회 차감" style="padding:6px 11px;border-radius:999px;border:1px solid var(--orangebd);background:var(--tintO);color:var(--orange);font-size:12.5px;font-weight:700;cursor:pointer;">−1 차감</button>`:''}
        <button data-act="wrongremove" data-arg="${w.question_id}|${w.qnum}" title="이 문제를 오답노트에서 제거" style="padding:6px 11px;border-radius:999px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.14);color:var(--accent-b);font-size:12.5px;font-weight:700;cursor:pointer;">✓ 해결</button>
        <button data-act="review" data-arg="${w.question_id}|${h(w.subject)}|${h(w.year)}|${h(w.exam_round)}|${w.qnum}" style="padding:6px 13px;border-radius:999px;border:1px solid var(--bluebd);background:var(--tintB);color:var(--blue);font-size:12.5px;font-weight:700;cursor:pointer;">↺ 복습</button>
      </div>
    </div>`;
  const repeats=(d.wrong||[]).filter(w=>w.repeat), normals=(d.wrong||[]).filter(w=>!w.repeat);
  const items=`${repeats.length?`<div style="font-size:14px;font-weight:800;color:var(--orange);margin:2px 0 8px;">🔁 반복해서 틀리는 문제 <span style="font-size:12px;color:var(--text3);">· 복습·PDF에서 또 틀린 ${repeats.length}문항</span></div><div style="display:grid;gap:10px;margin-bottom:16px;">${repeats.map(item).join('')}</div>`:''}
    ${normals.length?`${repeats.length?`<div style="font-size:14px;font-weight:800;color:var(--text2);margin:2px 0 8px;">📕 그 외 오답 ${normals.length}문항</div>`:''}<div style="display:grid;gap:10px;">${normals.map(item).join('')}</div>`:''}`;
  return `<div><div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
      <div><div style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold-d);letter-spacing:1px;">WRONG-ANSWER LOG</div>
      <h2 style="margin:6px 0 0;font-size:22px;font-weight:800;">📕 오답노트 <span style="font-size:13px;color:var(--text2);font-weight:600;">· 틀린 문제 모음 (채점 ${d.answered||0}문항)</span></h2></div>
      <div style="display:flex;gap:8px;">${totalWrong?`<button data-act="wrongpdf" style="padding:8px 14px;border-radius:10px;border:1px solid var(--bluebd);background:var(--tintB);color:var(--blue);font-size:13px;font-weight:700;cursor:pointer;">📄 오답 PDF 출력</button>
      <button data-act="wrongclear" style="padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text3);font-size:13px;cursor:pointer;">기록 초기화</button>`:''}</div></div>
    ${S.wrongPdfMsg?`<div style="margin-bottom:12px;color:var(--blue);font-size:13px;">${h(S.wrongPdfMsg)}</div>`:''}
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;">${d.repeat?`<div style="padding:10px 14px;border-radius:12px;border:1px solid rgba(255,140,40,.5);background:rgba(255,140,40,.1);display:flex;gap:10px;align-items:center;"><span style="font-weight:800;color:var(--orange);">🔁 반복 오답</span><span style="font-family:'Press Start 2P',monospace;font-size:12px;color:var(--orange);">${d.repeat}</span></div>`:''}${chips}</div>
    ${totalWrong?wrongGradeCard():''}
    ${totalWrong?analyzeBox():''}
    ${items}
    ${totalWrong?'<p style="margin-top:14px;color:var(--text3);font-size:12.5px;">문제은행에서 다시 풀어 맞히면 목록에서 사라져요. <b>🔁 반복 오답</b>은 복습·PDF 채점에서 또 틀린 문항이에요.</p>':''}</div>`;
}
function analyzeBox(){
  const a=S.wrongAnalysis;
  if(a==='...') return `<div style="margin-bottom:18px;font-size:13px;color:var(--pink);display:flex;align-items:center;gap:8px;"><span style="animation:blink 1s infinite;">🧚</span> 수호령이 오답 패턴을 분석하는 중...</div>`;
  if(a) return `<div style="margin-bottom:18px;border:1px solid var(--pinkbd);border-radius:14px;padding:16px;background:var(--inset);color:var(--text);white-space:pre-wrap;font-size:14px;line-height:1.75;"><div style="font-weight:800;color:var(--pink);margin-bottom:8px;">🧚 내 오답 분석</div>${mdLite(a)}</div>`;
  return `<button data-act="analyzewrong" style="margin-bottom:18px;padding:11px 18px;border-radius:12px;border:1px solid var(--pinkbd);background:var(--tintP);color:var(--pink);font-weight:800;font-size:14px;cursor:pointer;">🧚 자주 틀리는 유형·이유 분석받기</button>`;
}
async function analyzeWrong(){
  if(S.wrongAnalysis==='...') return;
  S.wrongAnalysis='...'; render();
  const r=await api('/api/wrong/analyze');
  if(r.analysis) S.wrongAnalysis=r.analysis;
  else if(r.empty) S.wrongAnalysis='아직 분석할 오답이 없어요.';
  else S.wrongAnalysis = r.status===503||r.error==='no-ai' ? '수호령 미연결(GEMINI_API_KEY 필요).' : '분석 실패. 잠시 후 다시.';
  render();
}

// ========== 실전 채점 (시험 당일) ==========
const EXAM_SUBJECTS=['국어','수학','사회','과학','한국사','도덕'];   // 영어 제외(이미 응시) · 평균은 영어 100 포함해 7로 나눔
async function loadExamRecords(){
  const r=await api('/api/examresults'); S.examResults=r.results||[];
  const hr=await api('/api/history'); S.history=hr.history||[];
}
async function loadExamKeys(){
  const s=S.examSel;
  if(!s.year||!s.exam_round||!s.level){ S.examMsg='연도·회차·과정을 모두 고르세요.'; render(); return; }
  S.examMsg='정답키 불러오는 중...'; render();
  const r=await api(`/api/examkeys?year=${encodeURIComponent(s.year)}&exam_round=${encodeURIComponent(s.exam_round)}&level=${encodeURIComponent(s.level)}`);

function gradeExam(){
  if(!S.examKeys) return;
  const detail={}; let sum=0, cnt=0;
  for(const subj of EXAM_SUBJECTS){
    const key=S.examKeys[subj]; if(!key) continue;
    const raw=(S.examInputs[subj]||'').match(/[1-5]/g)||[];   // 내가 적은 답(숫자만 추출)
    const nums=Object.keys(key).map(Number).sort((a,b)=>a-b);
    let correct=0, wrongList=[];
    nums.forEach((qn,i)=>{ const mine=+raw[i]; if(mine===key[qn]) correct++; else wrongList.push(qn); });
    const score=correct*PTS(subj);
    detail[subj]={total:nums.length, entered:raw.length, correct, wrong:nums.length-correct, score, wrongList, pts:PTS(subj)};
    sum+=score; cnt++;
  }
  const avg=cnt?Math.round((sum+100)/7*10)/10:0;   // 영어 100 포함, 7과목 평균
  S.examScore={detail, avg, cnt, pass:avg>=60};
  render();
}

let _ac;
function tone(freq,dur,type='square',vol=0.11,when=0){
  if(!_ac) return;
  const t=_ac.currentTime+when, o=_ac.createOscillator(), g=_ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t+dur+0.02);
}
const seq=(notes,type='square',vol=0.11)=>notes.forEach(([f,w],i)=>tone(f,0.12,type,vol,w));

  qload:()=>loadQuestions(false), qrandom:()=>loadQuestions(true),
  qpick:id=>pickQuestion(id), qscore:scoreQuestion,
  mark:arg=>{const[n,c]=arg.split(':').map(Number); mark(n,c);},
  qnav:d=>quizNav(+d), toggleraw:()=>{S.showRaw=!S.showRaw;render();}, explainq:n=>explainQ(+n),
  review:arg=>{const[id,s,y,r,qn]=arg.split('|'); reviewWrong(+id,s,y,r,+qn);},
  wrongclear:async()=>{ if(confirm('오답노트 기록을 모두 지울까요?')){ await api('/api/wrong/clear',{method:'POST'}); await loadWrong(); } },
  atab:async id=>{S.adminTab=id;S.adminMsg='';await adminReload();},
  asave:arg=>adminSave(arg==='new'?null:+arg), adel:id=>adminDelete(+id),
  uploadpdf:()=>uploadPdf(), analyzewrong:()=>analyzeWrong(),
  mute:()=>patch({muted:!S.muted}),
  bankmode:m=>{ S.bankMode=m; S.picks={}; S.quizMarks={}; S.graded=false; S.quizIdx=0; render(); },
  pick:arg=>{const[n,c]=arg.split(':').map(Number); S.picks[n]=c; render();},
  gradeall:()=>gradeAll(),
  towersub:s=>{ S.towerSubject=s; render(); if(s==='도덕'&&!S.dodeok) loadDodeok().then(render); },
  towerconcept:()=>towerConcept(),
  examload:()=>loadExamKeys(),
  examgrade:()=>gradeExam(),
  examsave:()=>saveExam(),
  wrongpdf:()=>downloadWrongPdf(),
  wronggrade:()=>gradeWrongNote(),
  wrongdec:arg=>{const[id,qn]=arg.split('|'); wrongAdjust(id,qn,'dec');},
  wrongremove:arg=>{const[id,qn]=arg.split('|'); wrongAdjust(id,qn,'remove');},
};
$.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=el.getAttribute('data-act'); playSfx(a); if(ACTS[a]) ACTS[a](el.getAttribute('data-arg'), el); });
function bindInputs(){
  $.querySelectorAll('[data-model]').forEach(el=>{ el.oninput=()=>{ S[el.getAttribute('data-model')]=el.value; }; });
  $.querySelectorAll('[data-filter]').forEach(el=>{ el.onchange=()=>{ S.qFilter[el.getAttribute('data-filter')]=el.value; }; });
  const uf=document.getElementById('up_file'); if(uf) uf.onchange=()=>{ _upFiles=[...uf.files]; };  // 선택 즉시 저장 → 재렌더에도 안 날아감
  const wf=document.getElementById('wn_file'); if(wf) wf.onchange=()=>{ _wnFile=wf.files[0]||null; };
  $.querySelectorAll('[data-exam]').forEach(el=>{ el.onchange=()=>{ S.examSel[el.getAttribute('data-exam')]=el.value; }; });
  $.querySelectorAll('[data-examin]').forEach(el=>{ el.oninput=()=>{ S.examInputs[el.getAttribute('data-examin')]=el.value; }; });
  const ci=document.getElementById('chatInput'); if(ci) ci.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
}

// mic (native Web Speech)
let _rec=null;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('이 브라우저는 받아쓰기를 지원하지 않아요.'); return; }
  if(S.recording){ if(_rec) try{_rec.stop();}catch(e){} S.recording=false; render(); return; }
  const rec=new SR(); rec.lang='ko-KR'; rec.interimResults=false; rec.continuous=false;
  rec.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; S.blankText=(S.blankText?S.blankText+' ':'')+t; render(); };
  rec.onend=()=>{ S.recording=false; render(); }; rec.onerror=()=>{ S.recording=false; render(); };
  _rec=rec; try{ rec.start(); S.recording=true; render(); }catch(e){ S.recording=false; }
}

boot();
</script>
