<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지식의 탑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  a{ color:var(--accent-b); text-decoration:none; } a:hover{ color:var(--gold); }
  ::selection{ background:rgba(255,224,102,.28); color:#fff; }
  textarea,input,select,button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  @keyframes bossPulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,84,104,.30);} 50%{ box-shadow:0 0 28px rgba(255,84,104,.62);} }
  @keyframes goldGlow{ 0%,100%{ text-shadow:0 0 12px rgba(255,224,102,.45);} 50%{ text-shadow:0 0 22px rgba(255,224,102,.85);} }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }
  @keyframes orbGlow{ 0%,100%{ box-shadow:0 0 32px rgba(46,230,166,.45), inset 0 0 30px rgba(255,224,102,.22);} 50%{ box-shadow:0 0 58px rgba(46,230,166,.72), inset 0 0 42px rgba(255,224,102,.4);} }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  @keyframes blink{ 0%,100%{ opacity:.25;} 50%{ opacity:1;} }
  @keyframes toastUp{ 0%{opacity:0;transform:translate(-50%,12px) scale(.85);} 14%{opacity:1;transform:translate(-50%,0) scale(1.08);} 28%{transform:translate(-50%,0) scale(1);} 78%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-46px) scale(1);} }
  @keyframes popIn{ 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.12);} 100%{transform:scale(1);opacity:1;} }
  @keyframes shakeX{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }
  @keyframes sheen{ 0%{background-position:-140% 0;} 100%{background-position:240% 0;} }
  [data-theme="light"]{ --bg:#ece3d0 !important; --bg2:#f3ecdb !important; --panel:#fffdf6 !important; --panel2:#f4ecd9 !important; --border:#ddceac !important; --line:#e7dcc4 !important; --header:rgba(255,251,240,.9) !important; --text:#2a2620 !important; --text2:#6a6250 !important; --text3:#9a9075 !important; --accent:#0f6a53 !important; --accent-b:#0d855f !important; --gold:#a9781a !important; --gold-d:#7d580f !important; --danger:#c0392b !important; --danger-b:#c94636 !important; --inset:#efe6d2 !important; --tintB:rgba(70,110,200,.10) !important; --tintO:rgba(200,120,40,.11) !important; --tintP:rgba(170,80,190,.10) !important; --blue:#2f56c0 !important; --orange:#a85712 !important; --pink:#9a2fae !important; --bluebd:rgba(70,110,200,.4) !important; --orangebd:rgba(200,120,40,.42) !important; --pinkbd:rgba(170,80,190,.4) !important; background: radial-gradient(1100px 640px at 50% -12%, #fffaf0, rgba(255,250,240,0) 60%), radial-gradient(820px 560px at 100% 100%, rgba(15,106,83,.10), rgba(0,0,0,0) 55%), var(--bg) !important; }
  input,textarea,select{ outline:none; }
</style>
</head>
<body>
<div id="root" data-theme="dark" style="--bg:#06090f;--bg2:#0b1120;--panel:#101a2c;--panel2:#0b1322;--border:#213152;--line:#182541;--header:rgba(8,12,20,.82);--text:#e9eef8;--text2:#9db0d0;--text3:#5d6f8f;--accent:#14755C;--accent-b:#2ee6a6;--gold:#FFE066;--gold-d:#c9a227;--danger:#ff5468;--danger-b:#ff8093;--inset:#0a1120;--tintB:rgba(30,52,96,.5);--tintO:rgba(70,44,20,.5);--tintP:rgba(66,26,74,.5);--blue:#9ab6ff;--orange:#ffb673;--pink:#e6a0f2;--bluebd:rgba(122,162,255,.42);--orangebd:rgba(255,160,80,.42);--pinkbd:rgba(226,120,240,.45); min-height:100vh; background: radial-gradient(1200px 720px at 50% -12%, #12233f 0%, rgba(18,35,63,0) 58%), radial-gradient(900px 640px at 100% 100%, rgba(20,117,92,.20), rgba(0,0,0,0) 55%), radial-gradient(760px 520px at 0% 92%, rgba(255,224,102,.08), rgba(0,0,0,0) 55%), var(--bg); color:var(--text); font-family:'Pretendard', system-ui, -apple-system, sans-serif; line-height:1.55; -webkit-tap-highlight-color:transparent;"></div>

<script>
const EXAM_DATE = '2026-08-11';
const $ = document.getElementById('root');
const h = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// AI(마크다운) 응답용 경량 렌더: **볼드** *이탤릭* `코드` 불릿 → HTML (먼저 이스케이프)
const mdLite = s => h(s)
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>')
  .replace(/`([^`]+?)`/g,'<code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:.92em;">$1</code>')
  .replace(/^\s*[-*]\s+/gm,'• ')
  .replace(/^\s*#{1,4}\s*(.+)$/gm,'<b>$1</b>');

const S = {
  gateMode:'loading', setup:false, isAdmin:false,
  entry:'', setupFirst:'', gateError:'',
  theme:'dark', tab:'camp', now:Date.now(),
  sleepDone:false, wakeDone:false,
  mins:{math:0,sci:0,kor:0,nc2:0}, running:null, runStart:0,
  nc2Pick:['사회','한국사'], lockPreview:false,
  towerUnit:0, deckIdx:0, flipped:false, known:{}, dodgeText:'', dodgeLoading:false,
  topic:'', blankText:'', blankResult:'', blankLoading:false, recording:false,
  checklist:{acad:false,comm:false,self:false,dili:false},
  ai:null,
  stance:'A', messages:[], input:'', chatLoading:false,
  units:[], cards:[], schedule:[], studyStats:null, explain:{},
  qFacets:{subject:[],year:[],exam_round:[],level:[]}, qFilter:{}, qList:[], qCurrent:null, qMsg:'',
  quizItems:[], quizIdx:0, quizMarks:{}, showRaw:false, streak:0, showImg:{},
  bankMode:'instant', picks:{}, graded:false, onlyNew:false,
  diag:null, diagText:'', diagLoading:false,
  wrongData:null, wrongAnalysis:'', wrongPdfMsg:'', wrongGradeMsg:'', wrongGradeResult:null,
  examSel:{}, examKeys:null, examInputs:{}, examScore:null, examResults:[], examMsg:'',
  history:[],
  towerSubject:'도덕', dodeok:null, towerConcept:{},
  dodeokMode:'read', dq:null, dodeokExam:null,
  recommend:null, mock:null, askImg:{busy:false,text:'',q:''}, similar:null,
  today:null, checkExam:{}, cq:null,
  adminTab:'questions', adminMsg:'', muted:false,
};
const PTS=subj=>subj==='수학'?5:4;   // 배점: 수학 5점/문항, 나머지 4점/문항
let _barrierActive = null;

// ---------- api ----------
async function api(path, opts){
  const r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  let j = {}; try{ j = await r.json(); }catch(e){}
  return {ok:r.ok, status:r.status, ...j};
}
const jbody = o => ({body: JSON.stringify(o)});

// ---------- persistence ----------
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let _saveT=0;
function persist(){
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    const st={ day:ymd(new Date()), theme:S.theme, sleepDone:S.sleepDone, wakeDone:S.wakeDone,
      mins:S.mins, nc2Pick:S.nc2Pick, towerUnit:S.towerUnit, deckIdx:S.deckIdx, known:S.known,
      checklist:S.checklist, stance:S.stance, muted:S.muted, messages:(S.messages||[]).slice(-40) };
    api('/api/state', {method:'POST', ...jbody({state:st})});
  }, 400);
}
function patch(o){ Object.assign(S,o); persist(); render(); }

// ---------- boot ----------
async function boot(){
  const s = await api('/api/session');
  S.setup = !!s.setup; S.isAdmin = !!s.isAdmin; S.ai = s.ai || null;
  if(s.authed){ await openApp(); }
  else { S.gateMode = s.setup ? 'setup' : 'locked'; render(); }
  setInterval(tick, 1000);
}
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return ymd(d); }
async function loadStudy(){
  const r=await api('/api/study?today='+ymd(new Date())+'&weekStart='+daysAgo(6)+'&periodStart='+daysAgo(20));
  if(r.today) S.mins = r.today;
  S.studyStats = {week:r.week||{}, period:r.period||{}, total:r.total||{}, days:r.days||[]};
}
let _studyT=0;
function saveStudy(){
  clearTimeout(_studyT);
  _studyT=setTimeout(()=>api('/api/study',{method:'POST',...jbody({date:ymd(new Date()), mins:S.mins})}), 500);
}
async function openApp(){
  const [st, u, c, sc] = await Promise.all([api('/api/state'), api('/api/units'), api('/api/cards'), api('/api/schedule')]);
  S.units = u.units||[]; S.cards = c.cards||[]; S.schedule = sc.schedule||[];
  const saved = st.state || {};
  const today = ymd(new Date());
  const daily = saved.day===today ? saved : {};
  S.theme = saved.theme || (matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
  S.sleepDone = !!daily.sleepDone; S.wakeDone = !!daily.wakeDone;
  await loadStudy();   // 학습시간은 서버 로그에서 (새로고침해도 유지 + 이력)
  S.nc2Pick = saved.nc2Pick || ['사회','한국사'];
  S.towerUnit = saved.towerUnit||0; S.deckIdx = saved.deckIdx||0; S.known = saved.known||{};
  S.checklist = saved.checklist || {acad:false,comm:false,self:false,dili:false};
  S.stance = saved.stance || 'A';
  S.muted = !!saved.muted;
  S.messages = (saved.messages&&saved.messages.length) ? saved.messages
    : [{role:'assistant', text:'수영! 《지식의 탑》에 잘 왔어 ⚔️ 나는 너의 수호령이야.\n오늘 첫 퀘스트부터 같이 정해볼까? 아래 스펠을 눌러도 좋아.'}];
  S.gateMode = 'open';
  if(saved.day!==today) persist(); // 일일 초기화 저장
  render();
  if(S.towerSubject==='도덕' && !S.dodeok) loadDodeok().then(render);   // 도덕 노트 미리 로드(초기 탭이 수련의 탑이어도 표시)
}

// ---------- gate ----------
async function tapKey(n){
  if(S.entry.length>=4) return;
  S.entry += String(n); S.gateError=''; render();
  if(S.entry.length===4){ setTimeout(submitPin, 120); }
}
function delKey(){ S.entry=S.entry.slice(0,-1); S.gateError=''; render(); }
async function submitPin(){
  const pin=S.entry;
  if(S.gateMode==='setup'){
    if(!S.setupFirst){ S.setupFirst=pin; S.entry=''; render(); return; }
    if(S.setupFirst===pin){
      const r=await api('/api/setup',{method:'POST',...jbody({pin})});
      if(r.ok){ S.entry=''; S.setupFirst=''; S.isAdmin=true; await openApp(); }
      else { S.entry=''; S.setupFirst=''; S.gateError='봉인 등록 실패. 다시 시도해줘.'; render(); }
    } else { S.entry=''; S.setupFirst=''; S.gateError='봉인 문양이 일치하지 않아. 처음부터 다시 새겨줘.'; render(); }
  } else {
    const r=await api('/api/unlock',{method:'POST',...jbody({pin})});
    if(r.ok){ S.entry=''; S.gateError=''; S.isAdmin=true; await openApp(); }
    else { S.entry=''; S.gateError='봉인 해제 실패. 문양을 다시 확인해.'; render(); }
  }
}
async function relock(){ await api('/api/relock',{method:'POST'}); S.gateMode='locked'; S.entry=''; S.setupFirst=''; S.gateError=''; render(); }

// ---------- study logic ----------
function examDate(){ const p=EXAM_DATE.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dday(){ const t=examDate(),n=new Date(S.now); return Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000); }
function bossDateStr(){ const t=examDate(); return ymd(t)+' ('+['일','월','화','수','목','금','토'][t.getDay()]+')'; }
function liveMins(sub){ const base=S.mins[sub]||0; return S.running===sub ? base+(S.now-S.runStart)/60000 : base; }
function toggleTimer(sub){ if(barrier().active) return; if(S.running===sub){ commit(); } else { if(S.running) commit(); S.running=sub; S.runStart=Date.now(); render(); } }
function commit(){ const sub=S.running; if(!sub) return; const add=(Date.now()-S.runStart)/60000; S.mins={...S.mins,[sub]:(S.mins[sub]||0)+add}; S.running=null; S.runStart=0; saveStudy(); render(); }
function addMins(sub,d){ S.mins={...S.mins,[sub]:Math.max(0,(S.mins[sub]||0)+d)}; saveStudy(); render(); }
function pickNc2(sub){ let p=[...S.nc2Pick]; if(p.includes(sub)){ if(p.length>1) p=p.filter(x=>x!==sub); } else { p.push(sub); if(p.length>2) p.shift(); } patch({nc2Pick:p}); }
const WD=['일','월','화','수','목','금','토'];
function hm(s){ const p=String(s||'0:0').split(':'); return (+p[0]||0)+(+p[1]||0)/60; }
function barrierFor(kind, tag){
  return kind==='seal'
    ? {active:true,icon:'🔒',title:'수호령의 결계 발동 중!',tag,text:'현재는 탑 밖의 의무에 집중할 시간입니다. 학습 타이머와 알림이 봉인됩니다.'}
    : {active:true,icon:'🛡️',title:'정찰 임무 수행 중',tag,text:'외부 정찰 임무(고정일정)에 집중할 시간입니다. 타이머가 잠시 봉인됩니다.'};
}
function barrier(){
  if(S.lockPreview) return barrierFor('seal','미리보기 · 결계 테스트');
  const d=new Date(S.now),wd=WD[d.getDay()],hh=d.getHours()+d.getMinutes()/60;
  for(const s of (S.schedule||[])){
    if(s.day===wd && hh>=hm(s.t_start) && hh<hm(s.t_end))
      return barrierFor(s.kind, `${wd} ${s.t_start}–${s.t_end} · ${s.name}`);
  }
  return {active:false};
}
function nextUnit(){ const n=S.units.filter(u=>u.subject===S.towerSubject).length; if(!n) return; patch({towerUnit:(S.towerUnit+1)%n}); }
function flip(){ S.flipped=!S.flipped; render(); }
function critical(){ const c=S.cards[S.deckIdx]; if(!c) return; toast('🗡 치명타!  몬스터 처치','good'); patch({known:{...S.known,[c.id]:true}, deckIdx:(S.deckIdx+1)%S.cards.length, flipped:false, dodgeText:''}); }
function renderSegs(body){ return String(body||'').split('**').map((t,i)=> i%2 ? `<span style="color:var(--gold);font-weight:800;text-shadow:0 0 10px rgba(255,224,102,.5);background:rgba(255,224,102,.10);padding:0 3px;border-radius:4px;">${h(t)}</span>` : h(t)).join(''); }

// ---------- AI ----------
function ctx(){ const r=v=>Math.round(liveMins(v)); const b=barrier();
  return `[학생 현재 상태] D-${dday()} (검정고시 ${EXAM_DATE}). 오늘 학습: 수학 ${r('math')}/120분, 과학 ${r('sci')}/60분, 국어 ${r('kor')}/60분, ${S.nc2Pick.join('+')} ${r('nc2')}/120분. 루틴: 취침체크 ${S.sleepDone?'O':'X'}, 기상체크 ${S.wakeDone?'O':'X'}.${b.active?' 현재 '+b.tag+' (봉인 상태).':''}`; }
function systemFor(stance){ const base = stance==='A'
  ? "너는 RPG '동반 수호령'이야. 검정고시와 성공회대 입시를 준비하는 '수영'의 든든한 동료 요정이야. 반말로, 따뜻하지만 솔직하게 멘탈과 루틴을 케어해. 판타지 톤(퀘스트·EXP·결계·탑)을 가볍게 섞고, 답은 짧고 힘이 나게. 이모지는 절제해서 사용해."
  : "당신은 RPG '현자 수호령'입니다. 검정고시 개념과 백지테스트를 지도하는 튜터입니다. 존댓말로 정확하고 구조적으로 설명하며, '핵심 → 예시 → 암기 팁' 순서로 간결하게 안내하세요.";
  return base+"\n\n"+ctx(); }
async function callAI(messages, system, max){
  const r=await api('/api/ai',{method:'POST',...jbody({system,messages,max_tokens:max||700})});
  if(r.status===503) throw new Error('no-ai');
  if(!r.ok || r.text==null) throw new Error('fail');
  return r.text;
}
async function send(text){
  const t=(text!=null?text:S.input).trim(); if(!t||S.chatLoading) return;
  const msgs=[...S.messages,{role:'user',text:t}];
  S.messages=msgs; S.input=''; S.chatLoading=true; persist(); render(); scrollChat();
  try{ const out=await callAI(msgs.map(m=>({role:m.role,content:m.text})), systemFor(S.stance), 700);
    S.messages=[...msgs,{role:'assistant',text:(out||'').trim()}]; }
  catch(e){ const msg = e.message==='no-ai' ? '아직 수호령이 강림하지 않았어… (AI 미연결). 서버 폴더에 gemini_key.txt로 Google AI Studio 키를 넣으면 소환돼.' : '수호령과의 연결이 잠시 흔들렸어. 잠시 후 다시 시도해줘.';
    S.messages=[...msgs,{role:'assistant',text:msg}]; }
  S.chatLoading=false; persist(); render(); scrollChat();
}
async function dodge(){ if(S.dodgeLoading) return; const c=S.cards[S.deckIdx]; if(!c) return;
  S.dodgeLoading=true; S.dodgeText=''; render();
  try{ const out=await callAI([{role:'user',content:`다음 개념을 검정고시 수험생이 이해하기 쉽게 3~4문장으로 설명하고, 외우기 좋은 한 줄 팁을 붙여줘.\n개념: ${c.q}\n(참고 정답: ${c.a})`}], systemFor('B'), 500);
    S.dodgeText=(out||'').trim(); }
  catch(e){ S.dodgeText = e.message==='no-ai' ? '수호령 미연결. gemini_key.txt에 Google AI Studio 키를 넣어 주세요.' : '수호령의 응답을 불러오지 못했어. 잠시 후 다시 시도해줘.'; }
  S.dodgeLoading=false; render();
}
async function verify(){ const text=S.blankText.trim(); if(!text||S.blankLoading) return;
  const topic=(S.topic.trim())||(S.units[S.towerUnit]&&S.units[S.towerUnit].title)||'주제';
  S.blankLoading=true; S.blankResult=''; render();
  try{ const out=await callAI([{role:'user',content:`아래는 학생이 '${topic}'에 대해 백지에 쓴 내용입니다. 1) 잘한 점 2) 빠지거나 틀린 핵심 3) 보완 한 줄 요약 순서로 존댓말로 채점·피드백해 주세요.\n\n---\n${text}`}], systemFor('B'), 700);
    S.blankResult=(out||'').trim(); }
  catch(e){ S.blankResult = e.message==='no-ai' ? '수호령 미연결. gemini_key.txt에 Google AI Studio 키를 넣어 주세요.' : '검증에 실패했어요. 잠시 후 다시 시도해 주세요.'; }
  S.blankLoading=false; render();
}

// ---------- question bank ----------
async function loadFacets(){ const r=await api('/api/questions/facets'); S.qFacets=r; }
async function loadQuestions(random){
  const q=Object.assign({}, S.qFilter); if(random) q.random='1';
  const qs=Object.entries(q).filter(([k,v])=>v).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
  const r=await api('/api/questions'+(qs?'?'+qs:''));
  S.qList=r.questions||[]; S.qCurrent = random ? (S.qList[0]||null) : (S.qCurrent);
  S.qMsg = S.qList.length ? '' : '해당 조건의 기출이 없어요.';
  if(random) await loadQuiz();
  render();
}
async function loadQuiz(){
  S.quizItems=[]; S.quizIdx=0; S.quizMarks={}; S.showRaw=false; S.explain={}; S.streak=0; S.picks={}; S.graded=false;
  if(!S.qCurrent) return;
  const r=await api('/api/quiz?question_id='+S.qCurrent.id); S.quizItems=r.items||[]; S.showImg={};

async function explainQ(qnum){
  const it=S.quizItems.find(x=>x.qnum===qnum); if(!it || S.explain[qnum]==='...') return;
  const m=S.quizMarks[qnum]||{};
  S.explain[qnum]='...'; render();
  const raw=(S.qCurrent&&S.qCurrent.raw_text)||'';
  const ctx = it.image ? `${S.qCurrent.subject} 기출 ${qnum}번 문항입니다. (원문 발췌)\n${raw.slice(0,3000)}` :
    `[지문]\n${it.passage||'(없음)'}\n\n[문항 ${qnum}] ${it.stem}\n선지: ${it.choices.map(c=>c.n+') '+c.text).join(' / ')}`;
  const chosen = m.chosen===0?'모름(안 풂)':(m.chosen?m.chosen+'번':'-');
  try{
    const out=await callAI([{role:'user',content:`아래 ${S.qCurrent.subject} 문제를 학생이 풀었습니다. 학생 선택: ${chosen}, 정답: ${it.answer}번.\n왜 정답이 ${it.answer}번인지, 그리고 학생이 고른/헷갈릴 선지는 왜 틀렸는지 핵심만 존댓말로 쉽게 설명해 주세요. 3~5문장.\n\n${ctx}`}], systemFor('B'), 600);
    S.explain[qnum]=(out||'').trim();
  }catch(e){ S.explain[qnum] = e.message==='no-ai' ? '수호령 미연결(GEMINI_API_KEY 필요).' : '해설을 불러오지 못했어요. 잠시 후 다시.'; }
  render();
}

async function mark(qnum, choice){
  if(!S.qCurrent || S.quizMarks[qnum]) return;   // 이미 채점된 문항은 재채점 안 함
  const r=await api('/api/attempt',{method:'POST',...jbody({question_id:S.qCurrent.id, qnum, chosen:choice})});
  if(r.ok){
    S.quizMarks[qnum]={chosen:choice, correct:r.correct, answer:r.answer};
    if(r.correct){ S.streak=(S.streak||0)+1; const xp=10*Math.min(S.streak,5); toast(S.streak>=2?`🔥 ${S.streak} 연속!  +${xp} XP`:`⚔️ 명중!  +10 XP`, 'good'); }
    else { const had=S.streak; S.streak=0; toast(choice===0?'🤔 다음엔 맞혀보자':(had>=2?`💥 콤보 끊김…`:'💧 아쉬워요'), 'bad'); }
    render();

    toast('🔑 이 문제는 정답키가 아직 없어요', 'bad');   // 정답표 미등록 → 채점 불가
  }
}

// ---------- ticker ----------
function tick(){
  S.now=Date.now();
  if(S.gateMode!=='open') return;
  const b=barrier();
  if(S.running && b.active) commit();
  if(b.active!==_barrierActive){ _barrierActive=b.active; render(); return; }
  if(S.mock){                                  // 모의고사 카운트다운
    if(S.now>=S.mock.endAt){ mockSubmit(true); return; }
    render(); return;
  }
  if(S.tab==='camp' && S.running) render(); // 타이머 작동 중에만 갱신(입력창 없어 안전)
}

function studyStatsCard(){
  const s=S.studyStats; if(!s) return '';

  const today=sum(S.mins), week=sum(s.week||{}), total=sum(s.total||{});

  const byDate={}; (s.days||[]).forEach(d=>byDate[d.date]=Math.round((d.math||0)+(d.sci||0)+(d.kor||0)+(d.nc2||0)));
  const tk=ymd(new Date());

// ===== 도덕 학습 모드: 빈칸 · 용어 4지선다 · OX (라벨↔내용 카드 활용) =====
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const DGEN=new Set('의미 뜻 특징 성격 예 방법 배경 입장 관점 원칙 종류 정의 개념 구분 관계 문제점 해결책 조건 목적 역할 기능 내용 사례 요소 특성 장점 단점 한계 효과 유형'.split(' '));
const DSAGE=/공자|맹자|순자|노자|장자|석가|부처|칸트|밀|벤담|롤스|노직|싱어|요나스|프롬|아리스토텔레스|플라톤|소크라테스|흄|하버마스|레건|테일러|슈바이처|레오폴드|네스|베이컨|데카르트|스피노자|니부어|왈처|에피쿠로스|홉스|로크|루소|마르크스|정약용|이황|이이/;
const DJUNK=/소단원|^PART$|^\d|^[A-Za-z0-9 ()]+$/;
const dqPlain=s=>s.replace(/\*\*(.+?)\*\*/g,'$1');
const dqFirst=s=>dqPlain(s).split(' / ')[0].trim();   // 첫 문단만(런온·나열 방지)
const dqRunon=s=>/(다|음|함|됨|임|기)[가-힣]{2}/.test(s.replace(/다음|다양|다만|다수|다문화|다각|다시|기준|기술|기후|기본|기업|기능/g,''));
function dodeokItems(){   // 빈칸/4지선다용: 프레임 있는 문항 (품질 필터)
  const cards=(S.dodeok&&S.dodeok.cards)||[]; const items=[];
  cards.forEach(c=>{
    if(DJUNK.test(c.label) || DGEN.has(c.label)) return;
    const hlm=c.content.match(/\*\*(.+?)\*\*/);
    if(hlm && hlm[1].trim().length>=2 && hlm[1].trim().length<=24){   // 내용 속 핵심어 빈칸
      const term=hlm[1].trim();
      const seg=c.content.split(' / ').find(x=>x.includes('**')) || c.content.split(' / ')[0];
      const body=seg.replace(/\*\*.+?\*\*/,'§').replace(/\*\*(.+?)\*\*/g,'$1');
      if(body.length<=90 && body.length>=6) items.push({body, frame:`「${c.topic}」 · ${c.label}`, answer:term, dk:'term', blank:true, topic:c.topic, label:c.label});
    } else {                                     // 설명→용어/사상가 (첫 문단만, 품질 게이트)
      const desc=dqFirst(c.content);
      const ok = desc.length>=10 && desc.length<=74 && c.label.length>=2 && c.label.length<=16
                 && !desc.includes(c.label) && /[가-힣]/.test(desc) && !dqRunon(desc);
      if(ok) items.push({body:desc, frame: DSAGE.test(c.label)?'다음 주장을 한 사상가는?':'다음 설명에 해당하는 것은?', answer:c.label, dk: DSAGE.test(c.label)?'sage':'concept', blank:false, topic:c.topic, label:c.label});
    }
  });
  items.forEach(i=>{ i.hit=examHit(i.answer); i.grp=!!examGroup(i.answer); });
  // 기출에 실제 출제된 개념 우선(기출 선지묶음 보유 > 빈출 > 그 외)
  items.sort((a,b)=>(b.grp-a.grp)||(b.hit-a.hit));
  return items;
}
function dodeokStart(mode){
  S.dodeokMode=mode;
  if(mode==='read'){ S.dq=null; render(); return; }
  if(mode==='ox'){
    const cards=((S.dodeok&&S.dodeok.cards)||[]).filter(c=>{
      if(DGEN.has(c.label)||DJUNK.test(c.label)||c.label.length<2||c.label.length>16) return false;
      const d=dqFirst(c.content);
      return d.length>=10 && d.length<=74 && !d.includes(c.label) && /[가-힣]/.test(d) && !dqRunon(d);
    });
    S.dq={mode, cards:shuffle(cards), idx:0, pick:null, score:0, answered:0, ox:null};
    dodeokMakeOX();
  } else {
    let items=dodeokItems();
    if(mode==='quiz'){
      const exam=items.filter(i=>i.grp);      // 기출 4지선다 묶음이 있는 개념만 = 기출 난이도 보장
      items = exam.length>=12 ? shuffle(exam) : shuffle(items.filter(i=>i.grp||i.hit>0)).concat(shuffle(items.filter(i=>!i.grp&&!i.hit)));
    } else {
      const hot=items.filter(i=>i.hit>0);     // 빈칸도 기출 빈출 개념 먼저
      items = shuffle(hot).concat(shuffle(items.filter(i=>!i.hit)));
    }
    S.dq={mode, items, idx:0, reveal:false, pick:null, score:0, answered:0, choices:[]};
    if(mode==='quiz') dodeokMakeChoices();
  }
  render();
}
function dodeokMakeChoices(){
  const q=S.dq, cur=q.items[q.idx]; if(!cur) return;
  q.pick=null; q.fromExam=false;
  // ① 실제 기출 4지선다 묶음이 있으면 그대로 사용 (출제자가 만든 오답 = 기출 난이도)
  const eg=examGroup(cur.answer);
  if(eg){ q.choices=shuffle(eg.group); q.answerText=eg.exact; q.fromExam=true; return; }
  q.answerText=cur.answer;
  // ② 없으면 같은 유형·같은 주제의 형제 개념을 오답으로
  const uniq=arr=>[...new Set(arr)].filter(a=>a!==cur.answer);
  const sameTopic=uniq(q.items.filter(i=>i.dk===cur.dk&&i.topic===cur.topic).map(i=>i.answer));
  const sameKind =uniq(q.items.filter(i=>i.dk===cur.dk).map(i=>i.answer));
  let picks=shuffle(sameTopic).slice(0,3);
  if(picks.length<3) picks=picks.concat(shuffle(sameKind.filter(a=>!picks.includes(a))).slice(0,3-picks.length));
  q.choices=shuffle([cur.answer, ...picks]);
}
function dodeokMakeOX(){
  const q=S.dq, cur=q.cards[q.idx]; if(!cur) return;
  const mkFalse=Math.random()<0.5;
  let shown=cur.label;
  if(mkFalse){
    const sameKind=q.cards.filter(c=>c.label!==cur.label && DSAGE.test(c.label)===DSAGE.test(cur.label));  // 사상가↔사상가
    const sameTopic=sameKind.filter(c=>c.topic===cur.topic);   // 같은 주제의 형제(인접) 우선
    const o=shuffle(sameTopic.length?sameTopic:(sameKind.length?sameKind:q.cards.filter(c=>c.label!==cur.label)))[0];
    if(o) shown=o.label;
  }
  q.ox={shown, statement:dqFirst(cur.content), truth:cur.label, answer:(shown===cur.label?'O':'X')}; q.pick=null;
}
function dodeokPick(v){
  const q=S.dq; if(!q||q.pick!=null) return;
  q.pick=v; q.answered++;
  const ok = q.mode==='ox' ? (v===q.ox.answer) : (v===(q.answerText||q.items[q.idx].answer));
  if(ok){ q.score++; toast('⚔️ 정답!','good'); } else toast('💧 오답','bad');
  render();
}
function dodeokNext(){
  const q=S.dq; if(!q) return;
  const n=(q.mode==='ox'?q.cards:q.items).length;
  q.idx=(q.idx+1)%n; q.reveal=false; q.pick=null;
  if(q.mode==='quiz') dodeokMakeChoices();
  if(q.mode==='ox') dodeokMakeOX();
  render();
}
const dqCounter=(a,b)=>`<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;"><span style="color:var(--text3);">${a}</span><span style="color:var(--accent-b);font-weight:700;">${b}</span></div>`;

function dodeokOXView(){

// ===== 기출 발문 속사포 퀴즈 (도덕 외 과목) =====
async function cqStart(subject){
  S.cq={loading:true, subject}; render();
  const r=await api('/api/conceptquiz?subject='+encodeURIComponent(subject));
  const items=shuffle(r.items||[]);
  S.cq={subject, items, idx:0, pick:null, score:0, answered:0};
  render();
}
function cqPick(n){
  const q=S.cq; if(!q||q.pick!=null) return;
  q.pick=n; q.answered++;
  if(n===q.items[q.idx].answer){ q.score++; toast('⚔️ 정답!','good'); } else toast('💧 오답','bad');
  render();
}
function cqNext(){ const q=S.cq; if(!q||!q.items.length) return; q.idx=(q.idx+1)%q.items.length; q.pick=null; render(); }
function cqView(){
  const q=S.cq;
  if(!q) return '';
  if(q.loading) return `<div style="font-size:13px;color:var(--orange);">기출 문항을 불러오는 중...</div>`;
  if(!q.items.length) return `<div style="color:var(--text3);font-size:13.5px;">이 과목은 텍스트로 풀 수 있는 기출이 아직 없어요. 문제은행에서 이미지 문항으로 풀어보세요.</div>`;
  const it=q.items[q.idx];
  const choices=it.choices.map(c=>{
    let bg='var(--panel2)',bd='var(--border)',col='var(--text)';
    if(q.pick!=null){ if(c.n===it.answer){bg='rgba(20,117,92,.28)';bd='rgba(46,230,166,.6)';col='var(--accent-b)';} else if(c.n===q.pick){bg='rgba(255,84,104,.18)';bd='rgba(255,84,104,.6)';col='var(--danger-b)';} else col='var(--text3)'; }
    return `<button data-act="cqpick" data-arg="${c.n}" ${q.pick!=null?'disabled':''} style="display:flex;gap:9px;align-items:center;text-align:left;padding:12px 14px;border-radius:11px;border:1px solid ${bd};background:${bg};color:${col};font-size:14.5px;line-height:1.6;cursor:${q.pick!=null?'default':'pointer'};"><span style="font-size:17px;flex:0 0 auto;">${CIRC[c.n]}</span><span>${h(c.text)}</span></button>`;
  }).join('');
  return `<div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;">
      <span style="color:var(--text3);">${h(it.year)} ${h(it.exam_round)} ${it.qnum}번 · ${q.idx+1}/${q.items.length}</span>
      <span style="color:var(--accent-b);font-weight:700;">점수 ${q.score} / ${q.answered}</span></div>
    ${it.passage?`<div style="max-height:22vh;overflow:auto;border:1px solid var(--bluebd);background:var(--tintB);border-radius:10px;padding:11px 13px;margin-bottom:9px;font-size:13px;line-height:1.75;white-space:pre-wrap;color:var(--text);">${h(it.passage)}</div>`:''}
    <div style="background:var(--inset);border:1px solid var(--orangebd);border-radius:12px;padding:15px;font-size:15.5px;line-height:1.75;white-space:pre-wrap;color:var(--text);margin-bottom:10px;">${h(it.stem)}</div>
    <div style="display:grid;gap:8px;">${choices}</div>
    ${q.pick!=null?`<button data-act="cqnext" style="width:100%;margin-top:11px;padding:12px;border-radius:12px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.2);color:var(--accent-b);font-weight:800;font-size:14px;cursor:pointer;">다음 문제 ▶</button>`:''}`;

let _upFiles=[];   // 선택한 업로드 파일(재렌더로 input이 비워져도 유지)
const SUBJS=['국어','수학','영어','사회','과학','도덕','한국사'];
function parseMeta(fn){
  // 파일명에서 연도·회차·과정·과목을 유연하게 추출 (구분자·순서 무관)
  // 맥 파일명은 NFD(자모 분리)라 NFC로 정규화해야 한글 매칭됨
  const base=fn.replace(/\.[pP][dD][fF]$/,'').normalize('NFC');
  const type=/정답|답안/.test(base)?'정답':'문제';
  const ym=base.match(/(20\d\d)/);
  const rm=base.match(/([12])\s*(?:차|회|교시)/) || base.replace(/20\d\d/,'').match(/(?:^|[_\-\s])([12])(?:[_\-\s]|$)/);
  const level=/고졸/.test(base)?'고졸학력':(/고등/.test(base)?'고등':'');
  const subject=SUBJS.find(s=>base.includes(s))||'';   // 정답표엔 과목이 없으면 회차 전체로 반영
  const meta={type, year:ym?ym[1]+'년도':'', exam_round:rm?rm[1]+'차시험':'', level, subject};
  const ok=meta.year&&meta.exam_round&&meta.level&&(type==='정답'||subject);
  return ok?meta:null;
}
async function uploadPdf(){
  const inp=document.getElementById('up_file');
  let files=_upFiles.length?_upFiles:(inp?[...inp.files]:[]);   // 저장분 우선(재렌더 대비)
  if(!files.length){ S.adminMsg='⚠️ 파일을 선택하세요.'; render(); return; }
  // 문제를 먼저 처리해야 정답표가 붙을 문제가 존재함(정답은 맨 뒤로)
  files=files.slice().sort((a,b)=>(/정답|답안/.test(a.name.normalize('NFC'))?1:0)-(/정답|답안/.test(b.name.normalize('NFC'))?1:0));
  const form={type:document.getElementById('up_type').value, year:document.getElementById('up_year').value.trim(), exam_round:document.getElementById('up_round').value, level:document.getElementById('up_level').value, subject:document.getElementById('up_subject').value.trim()};
  let ok=0, fail=0, errs=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    let meta=parseMeta(f.name);
    if(!meta){ if(files.length===1 && form.year && (form.type!=='문제'||form.subject)) meta=form; else { fail++; errs.push(f.name+'(파일명 인식 실패)'); continue; } }
    S.adminMsg=`📤 ${i+1}/${files.length} 처리 중… ${f.name}`; render();
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    const res=await api('/api/upload',{method:'POST',...jbody({...meta, data})});
    if(res.ok) ok++; else { fail++; errs.push(f.name+'('+(res.error||res.status)+')'); }
  }
  _upFiles=[];   // 처리 끝 → 저장분 비움(다음 선택 위해)

function gradeExam(){
  if(!S.examKeys) return;
  const detail={}; let sum=0, cnt=0;
  for(const subj of EXAM_SUBJECTS){
    const key=S.examKeys[subj]; if(!key) continue;
    const raw=(S.examInputs[subj]||'').match(/[1-5]/g)||[];   // 내가 적은 답(숫자만 추출)
    const nums=Object.keys(key).map(Number).sort((a,b)=>a-b);
    let correct=0, wrongList=[];
    nums.forEach((qn,i)=>{ const mine=+raw[i]; if(mine===key[qn]) correct++; else wrongList.push(qn); });
    const score=correct*PTS(subj);
    detail[subj]={total:nums.length, entered:raw.length, correct, wrong:nums.length-correct, score, wrongList, pts:PTS(subj)};
    sum+=score; cnt++;
  }
  const avg=cnt?Math.round((sum+100)/7*10)/10:0;   // 영어 100 포함, 7과목 평균
  S.examScore={detail, avg, cnt, pass:avg>=60};
  render();
}

// 기출 개념 매칭: 정답 용어가 실제 기출 선지에 등장하는지 (부분일치 포함)
function examHit(term){
  const f=(S.dodeokExam&&S.dodeokExam.freq)||{}; if(f[term]) return f[term];
  const t=term.replace(/\s|\(.*?\)|（.*?）/g,'');
  for(const k in f){ const kk=k.replace(/\s/g,''); if(kk&&(kk.includes(t)||t.includes(kk))&&Math.min(kk.length,t.length)>=2) return f[k]; }
  return 0;
}
// 정답이 포함된 '실제 기출 4지선다 묶음' → 출제자가 만든 오답 보기 그대로 사용
function examGroup(term){
  const gs=(S.dodeokExam&&S.dodeokExam.groups)||[];
  const t=term.replace(/\s|\(.*?\)/g,'');
  for(const g of gs){ const hit=g.find(x=>{const xx=x.replace(/\s/g,''); return xx===t||(xx.length>=2&&t.length>=2&&(xx.includes(t)||t.includes(xx)));});
    if(hit) return {group:g, exact:hit}; }
  return null;
}

let _ac;
function tone(freq,dur,type='square',vol=0.11,when=0){
  if(!_ac) return;
  const t=_ac.currentTime+when, o=_ac.createOscillator(), g=_ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t+dur+0.02);
}

const EXAM6=[['국어',25,4],['수학',20,5],['사회',25,4],['과학',25,4],['한국사',25,4],['도덕',25,4]];
const LASTYEAR={국어:88,수학:75,사회:96,과학:72,한국사:92,도덕:72};   // 전년도 실적(데이터 없는 과목 기본값)
const BANDS=[[100,100,2,484],[98,99.99,3,476],[96,97.99,4,468],[94,95.99,5,460],[91,93.99,6,452],[88,90.99,7,444],[84,87.99,8,436],[0,83.99,9,428]];
const GYOGWA=[['사회융합',478.0],['미디어콘텐츠융합',485.0],['경영',484.0],['인문융합콘텐츠',476.0],['자유전공',476.0],['미래융합',476.0],['소프트웨어융합',475.0]];
function convert(avg){ const b=BANDS.find(x=>avg>=x[0]&&avg<=x[1])||BANDS[BANDS.length-1]; return {grade:b[2], score:b[3]}; }
function predict(){
  const acc=(S.diag||[]).reduce((m,s)=>(m[s.subject]=s.acc/100,m),{});
  let lost=0; const per=[];
  EXAM6.forEach(([subj,n,pt])=>{
    const a = acc[subj]!=null ? acc[subj] : (LASTYEAR[subj]||80)/100;
    const wrong=Math.round(n*(1-a)), l=wrong*pt;
    lost+=l; per.push({subj, acc:Math.round(a*100), wrong, lost:l, src:acc[subj]!=null?'풀이':'전년'});
  });
  const avg=(700-lost)/7, cv=convert(Math.round(avg*100)/100);
  return {avg:Math.round(avg*100)/100, lost, wrongTotal:per.reduce((s,x)=>s+x.wrong,0), per, ...cv};
}

function trendCard(){
  const rs=(S.examResults||[]).slice().reverse();
  if(rs.length<1) return '';
  const W=560,H=140,P=26, max=100, min=Math.min(80,...rs.map(r=>r.avg))-2;
  const x=i=>P+(rs.length<2?0:i*(W-2*P)/(rs.length-1)), y=v=>H-P-((v-min)/(max-min))*(H-2*P);
  const pts=rs.map((r,i)=>`${x(i)},${y(r.avg)}`).join(' ');
  const line=v=>`<line x1="${P}" y1="${y(v)}" x2="${W-P}" y2="${y(v)}" stroke="${v>=98?'rgba(46,230,166,.5)':'rgba(255,224,102,.45)'}" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-P+2}" y="${y(v)+3}" font-size="9" fill="var(--text3)">${v}</text>`;
  return `<div style="border:1px solid var(--bluebd);border-radius:16px;padding:18px;background:linear-gradient(180deg,var(--tintB),var(--panel2));margin-bottom:18px;">
    <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--blue);letter-spacing:1px;margin-bottom:10px;">SCORE TREND · 성적 추이</div>
    <div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;">
      ${line(98)}${line(94)}
      ${rs.length>1?`<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
      ${rs.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.avg)}" r="4.5" fill="${r.avg>=98?'#2ee6a6':r.avg>=94?'#ffe066':'#ff5468'}"/>
        <text x="${x(i)}" y="${y(r.avg)-9}" font-size="10" fill="var(--text)" text-anchor="middle" font-weight="700">${r.avg}</text>
        <text x="${x(i)}" y="${H-8}" font-size="9" fill="var(--text3)" text-anchor="middle">${h((r.year||'').replace('년도','')+' '+(r.exam_round||'').replace('시험',''))}</text>`).join('')}

}

  timer:sub=>toggleTimer(sub), add:arg=>{const[s,d]=arg.split(':');addMins(s,+d);}, nc2:pickNc2, preview:()=>{S.lockPreview=!S.lockPreview;render();},

  mic:toggleMic,
  check:id=>patch({checklist:{...S.checklist,[id]:!S.checklist[id]}}),
  stance:s=>patch({stance:s}), send:()=>send(), quick:msg=>send(msg),
  qload:()=>loadQuestions(false), qrandom:()=>loadQuestions(true),
  qpick:id=>pickQuestion(id), qscore:scoreQuestion,
  mark:arg=>{const[n,c]=arg.split(':').map(Number); mark(n,c);},
  qnav:d=>quizNav(+d), toggleraw:()=>{S.showRaw=!S.showRaw;render();}, explainq:n=>explainQ(+n),
  showimg:n=>{ S.showImg[n]=!S.showImg[n]; render(); },
  review:arg=>{const[id,s,y,r,qn]=arg.split('|'); reviewWrong(+id,s,y,r,+qn);},
  wrongclear:async()=>{ if(confirm('오답노트 기록을 모두 지울까요?')){ await api('/api/wrong/clear',{method:'POST'}); await loadWrong(); } },
  atab:async id=>{S.adminTab=id;S.adminMsg='';await adminReload();},
  asave:arg=>adminSave(arg==='new'?null:+arg), adel:id=>adminDelete(+id),
  uploadpdf:()=>uploadPdf(), analyzewrong:()=>analyzeWrong(),
  mute:()=>patch({muted:!S.muted}),
  bankmode:m=>{ S.bankMode=m; S.picks={}; S.quizMarks={}; S.graded=false; S.quizIdx=0; render(); },
  pick:arg=>{const[n,c]=arg.split(':').map(Number); S.picks[n]=c; render();},
  gradeall:()=>gradeAll(),
  towersub:s=>{ S.towerSubject=s; render(); if(s==='도덕'&&!S.dodeok) loadDodeok().then(render); },
  towerconcept:()=>towerConcept(),
  dodeokmode:m=>dodeokStart(m),
  dodeokreveal:()=>{ if(S.dq){S.dq.reveal=true;render();} },
  dodeoknext:()=>dodeokNext(),
  dodeokpick:t=>dodeokPick(decodeURIComponent(t)),
  examload:()=>loadExamKeys(),
  examgrade:()=>gradeExam(),
  examsave:()=>saveExam(),
  wrongpdf:()=>downloadWrongPdf(),
  wronggrade:()=>gradeWrongNote(),
  onlynew:()=>{ S.onlyNew=!S.onlyNew; render(); },
  diagai:()=>loadDiag(true),
  mockstart:()=>mockStart(), mocksubmit:()=>mockSubmit(false),
  similar:n=>loadSimilar(+n),
  gosimilar:async arg=>{ const[id,qn]=arg.split('|'); S.tab='bank'; S.similar=null; await pickQuestionById(+id); S.quizIdx=Math.max(0,S.quizItems.findIndex(x=>x.qnum==+qn)); render(); scrollTop(); },
  gosolve:async id=>{ S.tab='bank'; await pickQuestionById(+id); render(); scrollTop(); },
  goreview:async subj=>{ S.tab='wrong'; await loadWrong(); await loadDiag(false); render(); },
  askimg:()=>askImage(),
  wrongtag:async arg=>{ const[id,qn,tg]=arg.split('|');
    const cur=(S.wrongData.wrong||[]).find(x=>x.question_id==id&&x.qnum==qn);
    await api('/api/wrong/tag',{method:'POST',...jbody({question_id:+id,qnum:+qn,tag:(cur&&cur.tag===tg)?null:tg})});
    await loadWrong(); await loadDiag(false); render(); },
  chkexam:i=>{ S.checkExam={...S.checkExam,[i]:!S.checkExam[i]}; render(); },
  cqstart:s=>cqStart(s), cqclose:()=>{ S.cq=null; render(); },
  cqpick:n=>cqPick(+n), cqnext:()=>cqNext(),
  wrongdec:arg=>{const[id,qn]=arg.split('|'); wrongAdjust(id,qn,'dec');},
  wrongremove:arg=>{const[id,qn]=arg.split('|'); wrongAdjust(id,qn,'remove');},
};
$.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=el.getAttribute('data-act'); playSfx(a); if(ACTS[a]) ACTS[a](el.getAttribute('data-arg'), el); });
function bindInputs(){
  $.querySelectorAll('[data-model]').forEach(el=>{ el.oninput=()=>{ S[el.getAttribute('data-model')]=el.value; }; });
  $.querySelectorAll('[data-filter]').forEach(el=>{ el.onchange=()=>{ S.qFilter[el.getAttribute('data-filter')]=el.value; }; });
  const uf=document.getElementById('up_file'); if(uf) uf.onchange=()=>{ _upFiles=[...uf.files]; };  // 선택 즉시 저장 → 재렌더에도 안 날아감
  const wf=document.getElementById('wn_file'); if(wf) wf.onchange=()=>{ _wnFile=wf.files[0]||null; };
  $.querySelectorAll('[data-exam]').forEach(el=>{ el.onchange=()=>{ S.examSel[el.getAttribute('data-exam')]=el.value; }; });
  $.querySelectorAll('[data-examin]').forEach(el=>{ el.oninput=()=>{ S.examInputs[el.getAttribute('data-examin')]=el.value; }; });
  const af=document.getElementById('ask_file'); if(af) af.onchange=()=>{ _askFile=af.files[0]||null; };
  $.querySelectorAll('[data-model="askq"]').forEach(el=>{ el.oninput=()=>{ S.askImg.q=el.value; }; });
  const ci=document.getElementById('chatInput'); if(ci) ci.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
}

// mic (native Web Speech)
let _rec=null;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('이 브라우저는 받아쓰기를 지원하지 않아요.'); return; }
  if(S.recording){ if(_rec) try{_rec.stop();}catch(e){} S.recording=false; render(); return; }
  const rec=new SR(); rec.lang='ko-KR'; rec.interimResults=false; rec.continuous=false;
  rec.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; S.blankText=(S.blankText?S.blankText+' ':'')+t; render(); };
  rec.onend=()=>{ S.recording=false; render(); }; rec.onerror=()=>{ S.recording=false; render(); };
  _rec=rec; try{ rec.start(); S.recording=true; render(); }catch(e){ S.recording=false; }
}

boot();
</script>
