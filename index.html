<style>
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  a{ color:var(--accent-b); text-decoration:none; } a:hover{ color:var(--gold); }
  ::selection{ background:rgba(255,224,102,.28); color:#fff; }
  textarea,input,select,button{ font-family:inherit; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
  @keyframes bossPulse{ 0%,100%{ box-shadow:0 0 14px rgba(255,84,104,.30);} 50%{ box-shadow:0 0 28px rgba(255,84,104,.62);} }
  @keyframes goldGlow{ 0%,100%{ text-shadow:0 0 12px rgba(255,224,102,.45);} 50%{ text-shadow:0 0 22px rgba(255,224,102,.85);} }
  @keyframes floaty{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-9px);} }
  @keyframes orbGlow{ 0%,100%{ box-shadow:0 0 32px rgba(46,230,166,.45), inset 0 0 30px rgba(255,224,102,.22);} 50%{ box-shadow:0 0 58px rgba(46,230,166,.72), inset 0 0 42px rgba(255,224,102,.4);} }
  @keyframes fadeUp{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }
  @keyframes blink{ 0%,100%{ opacity:.25;} 50%{ opacity:1;} }
  @keyframes toastUp{ 0%{opacity:0;transform:translate(-50%,12px) scale(.85);} 14%{opacity:1;transform:translate(-50%,0) scale(1.08);} 28%{transform:translate(-50%,0) scale(1);} 78%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-46px) scale(1);} }
  @keyframes popIn{ 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.12);} 100%{transform:scale(1);opacity:1;} }
  @keyframes shakeX{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-5px);} 40%,80%{transform:translateX(5px);} }
  @keyframes sheen{ 0%{background-position:-140% 0;} 100%{background-position:240% 0;} }
  [data-theme="light"]{ --bg:#ece3d0 !important; --bg2:#f3ecdb !important; --panel:#fffdf6 !important; --panel2:#f4ecd9 !important; --border:#ddceac !important; --line:#e7dcc4 !important; --header:rgba(255,251,240,.9) !important; --text:#2a2620 !important; --text2:#6a6250 !important; --text3:#9a9075 !important; --accent:#0f6a53 !important; --accent-b:#0d855f !important; --gold:#a9781a !important; --gold-d:#7d580f !important; --danger:#c0392b !important; --danger-b:#c94636 !important; --inset:#efe6d2 !important; --tintB:rgba(70,110,200,.10) !important; --tintO:rgba(200,120,40,.11) !important; --tintP:rgba(170,80,190,.10) !important; --blue:#2f56c0 !important; --orange:#a85712 !important; --pink:#9a2fae !important; --bluebd:rgba(70,110,200,.4) !important; --orangebd:rgba(200,120,40,.42) !important; --pinkbd:rgba(170,80,190,.4) !important; background: radial-gradient(1100px 640px at 50% -12%, #fffaf0, rgba(255,250,240,0) 60%), radial-gradient(820px 560px at 100% 100%, rgba(15,106,83,.10), rgba(0,0,0,0) 55%), var(--bg) !important; }
  input,textarea,select{ outline:none; }
  /* ---- 접근성: 키보드 포커스 링 ---- */
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{ outline:2px solid var(--accent-b); outline-offset:2px; }
  button{ transition:transform .08s ease, filter .15s ease; }
  button:active{ transform:scale(.97); }
  @media (hover:hover){ button:hover{ filter:brightness(1.14); } }
  /* ---- 모바일 헤더 압축 (기존: 헤더가 화면 76% 차지) ---- */
  .hdrMenuBtn{ display:none; }
  @media (max-width:860px){
    .hdrWrap{ padding:7px 12px !important; gap:9px !important; flex-wrap:nowrap !important; }
    .hdrBrandTop{ display:none !important; }
    .hdrBrandMain{ font-size:15px !important; }
    .hdrBrandIcon{ font-size:20px !important; }
    .hdrBoss{ min-width:0 !important; flex:1 1 auto !important; justify-content:flex-end !important; }
    .hdrBossTxt{ display:none !important; }
    .hdrBossWrap{ padding:5px 9px !important; gap:6px !important; }
    .hdrMenuBtn{ display:inline-flex !important; align-items:center; justify-content:center; flex:0 0 auto; }
    .hdrRest{ display:none !important; }
    .hdrRest.open{ display:flex !important; position:absolute; right:10px; top:calc(100% - 2px); flex-direction:column; align-items:stretch !important; gap:10px !important; background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:13px; box-shadow:0 18px 44px rgba(0,0,0,.55); z-index:60; min-width:230px; }
    .hdrNav{ padding:0 6px !important; }
    .hdrNav button{ padding:11px 10px !important; font-size:13.5px !important; }
    main{ padding:16px 13px 96px !important; }
  }
  /* 섹션 바로가기 바: 스크롤바 숨기고 상단에 고정 */
  .jumpBar{ scrollbar-width:none; position:sticky; top:104px; z-index:20; background:var(--bg); padding-top:6px !important; }
  .jumpBar::-webkit-scrollbar{ display:none; }
  @media (max-width:860px){ .jumpBar{ top:100px; } }
  /* 물리 키보드 없는 기기에선 단축키 안내 숨김 */
  @media (hover:none) and (pointer:coarse){ .kbdHint{ display:none !important; } }
  /* 좁은 화면에서 버튼 글자 깨짐 방지 */
  @media (max-width:520px){ .noWrapBtn{ white-space:nowrap !important; font-size:12.5px !important; padding-left:9px !important; padding-right:9px !important; } }
  /* ---- 맨 위로 버튼 ---- */
  #toTop{ position:fixed; right:16px; bottom:18px; width:46px; height:46px; border-radius:50%; border:1px solid var(--border); background:var(--panel); color:var(--text2); font-size:17px; cursor:pointer; z-index:45; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; box-shadow:0 10px 26px rgba(0,0,0,.4); }
  #toTop.on{ opacity:1; pointer-events:auto; }
  /* ---- 커맨드 팔레트 ---- */
  #cmdk{ position:fixed; inset:0; z-index:200; background:rgba(4,7,13,.72); backdrop-filter:blur(5px); display:flex; align-items:flex-start; justify-content:center; padding:12vh 16px 16px; }
  #cmdk .box{ width:100%; max-width:520px; background:var(--panel); border:1px solid var(--gold-d); border-radius:16px; box-shadow:0 26px 70px rgba(0,0,0,.6); overflow:hidden; }
  #cmdk input{ width:100%; padding:16px 18px; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--text); font-size:16px; }
  #cmdk .row{ padding:11px 18px; display:flex; gap:10px; align-items:center; cursor:pointer; font-size:14.5px; color:var(--text); }
  #cmdk .row.sel{ background:rgba(255,224,102,.13); color:var(--gold); }
  kbd{ font-family:ui-monospace,monospace; font-size:11px; border:1px solid var(--border); border-bottom-width:2px; border-radius:5px; padding:1px 5px; color:var(--text3); background:var(--panel2); }
  /* ---- 연결 끊김 배너 ---- */
  #netBanner{ position:fixed; left:50%; transform:translateX(-50%); bottom:16px; z-index:250; padding:11px 20px; border-radius:999px; font-size:13.5px; font-weight:700; color:#fff; background:linear-gradient(180deg,#ff8093,#d43148); box-shadow:0 12px 32px rgba(0,0,0,.45); animation:popIn .3s cubic-bezier(.34,1.56,.64,1); max-width:92vw; text-align:center; }
  .printOnly{ display:none; }
  .sheetImg img{ max-width:520px; max-height:260px; object-fit:contain; background:#fff; }
  /* ---- 인쇄: 최종 요약 시트만 흑백으로 깔끔하게 ---- */
  @media print{
    header, nav, .noPrint, #toTop, #cmdk, #eyePip, #vidModal, #rpWrap, #netBanner{ display:none !important; }
    #root{ background:#fff !important; color:#000 !important; }
    main{ padding:0 !important; max-width:none !important; }
    #root:not(.printReview) > div > main > div > *:not(#sheetWrap){ display:none !important; }
    /* ---- 개념 총정리: 과목별 1페이지 · A4 가로 2단 ---- */
    #root.printReview .printOnly{ display:block !important; }
    #root.printReview main > div > *{ display:none !important; }
    #root.printReview main > div > .reviewRoot{ display:block !important; }
    #root.printReview #reviewPrint{ display:block !important; color:#000; }
    .rvPage{ break-after:page; page-break-after:always; }
    .rvPage:last-child{ break-after:auto; page-break-after:auto; }
    .rvHead{ border-bottom:2.5px solid #111; padding-bottom:5px; margin-bottom:9px;
             display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
    .rvHead h1{ margin:0; font-size:20pt; font-weight:900; letter-spacing:-.5px; }
    .rvHead span{ font-size:8.5pt; color:#555; }
    .rvGrid{ column-count:2; column-gap:9mm; }
    .rvCard{ break-inside:avoid; page-break-inside:avoid; border:1px solid #bbb; border-radius:4px;
             padding:7px 9px 8px; margin:0 0 5mm; background:#fff; }
    .rvCard h2{ margin:0 0 4px; font-size:12.5pt; font-weight:800; display:flex;
                align-items:baseline; gap:6px; flex-wrap:wrap; }
    .rvCnt{ font-size:8pt; font-weight:600; color:#a11; border:1px solid #d99; border-radius:3px; padding:0 4px; }
    .rvConf{ margin:0 0 5px; font-size:9.5pt; line-height:1.5; color:#333; }
    .rvConf b, .rvTrap b{ font-size:8pt; background:#eee; border-radius:3px; padding:1px 4px; margin-right:4px; }
    .rvCore{ margin:0 0 5px; padding-left:15px; }
    .rvCore li{ font-size:10.5pt; line-height:1.55; margin-bottom:2px; }
    .rvTrap{ margin:0 0 5px; font-size:9.5pt; line-height:1.5; color:#333; }
    .rvMem{ margin:0 0 4px; font-size:11pt; font-weight:800; border:1.5px solid #111;
            border-radius:4px; padding:5px 8px; }
    .rvMem::before{ content:'기억 '; font-size:8pt; font-weight:700; color:#666; }
    .rvRefs{ margin:0; font-size:8pt; color:#777; }
    .rvOrig{ margin:0 0 5px; font-size:9pt; font-weight:700; border:1px dashed #666; border-radius:3px; padding:3px 6px; }
    #sheetWrap{ border:none !important; padding:0 !important; background:#fff !important; box-shadow:none !important; }
    #sheetWrap *{ color:#000 !important; background:transparent !important; }
    #sheetWrap h3{ color:#000 !important; border-color:#000 !important; }
    .sheetRow{ border-bottom:1px solid #ccc !important; break-inside:avoid; page-break-inside:avoid; }
    .sheetImg img{ max-width:150mm !important; max-height:62mm !important; object-fit:contain; }
    @page{ margin:12mm; }
  }
</style>

<body>
<div id="root" data-theme="dark" style="--bg:#06090f;--bg2:#0b1120;--panel:#101a2c;--panel2:#0b1322;--border:#213152;--line:#182541;--header:rgba(8,12,20,.82);--text:#e9eef8;--text2:#9db0d0;--text3:#5d6f8f;--accent:#14755C;--accent-b:#2ee6a6;--gold:#FFE066;--gold-d:#c9a227;--danger:#ff5468;--danger-b:#ff8093;--inset:#0a1120;--tintB:rgba(30,52,96,.5);--tintO:rgba(70,44,20,.5);--tintP:rgba(66,26,74,.5);--blue:#9ab6ff;--orange:#ffb673;--pink:#e6a0f2;--bluebd:rgba(122,162,255,.42);--orangebd:rgba(255,160,80,.42);--pinkbd:rgba(226,120,240,.45); min-height:100vh; background: radial-gradient(1200px 720px at 50% -12%, #12233f 0%, rgba(18,35,63,0) 58%), radial-gradient(900px 640px at 100% 100%, rgba(20,117,92,.20), rgba(0,0,0,0) 55%), radial-gradient(760px 520px at 0% 92%, rgba(255,224,102,.08), rgba(0,0,0,0) 55%), var(--bg); color:var(--text); font-family:'Pretendard', system-ui, -apple-system, sans-serif; line-height:1.55; -webkit-tap-highlight-color:transparent;"></div>

<script>
const EXAM_DATE = '2026-08-11';
const $ = document.getElementById('root');
const h = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// AI(마크다운) 응답용 경량 렌더: **볼드** *이탤릭* `코드` 불릿 → HTML (먼저 이스케이프)
// 설명란 텍스트의 URL만 링크로 (h()로 먼저 이스케이프하므로 안전)
const linkify = s => h(s).replace(/(https?:\/\/[^\s<]+)/g,
  '<a href="$1" target="_blank" rel="noopener" style="color:var(--gold);">$1</a>');
const mdLite = s => h(s)
  .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
  .replace(/(^|[^*])\*(?!\s)([^*\n]+?)\*(?!\*)/g,'$1<em>$2</em>')
  .replace(/`([^`]+?)`/g,'<code style="background:rgba(255,255,255,.1);padding:1px 5px;border-radius:5px;font-size:.92em;">$1</code>')
  .replace(/^\s*[-*]\s+/gm,'• ')
  .replace(/^\s*#{1,4}\s*(.+)$/gm,'<b>$1</b>');

const S = {
  gateMode:'loading', setup:false, isAdmin:false,
  entry:'', setupFirst:'', gateError:'',
  theme:'dark', tab:'camp', now:Date.now(),
  sleepDone:false, wakeDone:false,
  mins:{math:0,sci:0,kor:0,nc2:0}, running:null, runStart:0,
  nc2Pick:['사회','한국사'], lockPreview:false,
  towerUnit:0, deckIdx:0, flipped:false, known:{}, dodgeText:'', dodgeLoading:false,
  topic:'', blankText:'', blankResult:'', blankLoading:false, recording:false,
  checklist:{acad:false,comm:false,self:false,dili:false},
  ai:null,
  stance:'A', messages:[], input:'', chatLoading:false,
  units:[], cards:[], schedule:[], studyStats:null, explain:{},
  qFacets:{subject:[],year:[],exam_round:[],level:[]}, qFilter:{}, qList:[], qCurrent:null, qMsg:'',
  quizItems:[], quizIdx:0, quizMarks:{}, showRaw:false, streak:0, showImg:{},
  bankMode:'instant', picks:{}, graded:false, onlyNew:false,
  diag:null, diagText:'', diagLoading:false,
  wrongData:null, wrongAnalysis:'', wrongPdfMsg:'', wrongGradeMsg:'', wrongGradeResult:null, wrongSubjFilter:'',
  defense:null, weakspots:null, recap:null, allocHours:6, report:null, reportLoading:false, openLetter:null,
  examItems:null, examReveal:null, examLetter:null, examLetterLoading:false,
  examSel:{}, examKeys:null, examInputs:{}, examScore:null, examResults:[], examMsg:'',
  history:[],
  towerSubject:'도덕', dodeok:null, towerConcept:{},
  dodeokMode:'read', dq:null, dodeokExam:null,
  recommend:null, mock:null, askImg:{busy:false,text:'',q:''}, similar:null,
  today:null, checkExam:{}, cq:null, eye:null, focusHist:null,
  adminTab:'questions', adminMsg:'', muted:false,
  hdrMenu:false, cmdk:null, sheet:null, sheetLoading:false, bankSearch:'', resumeBank:null, flash:null, sim:null, cram:null, grading:false, video:null, review:null, replay:null, reviewSkip:{},
};
const PTS=subj=>subj==='수학'?5:4;   // 배점: 수학 5점/문항, 나머지 4점/문항
let _barrierActive = null;

// ---------- api ----------
// 네트워크가 끊겨도 앱이 죽지 않도록: fetch 실패를 정상 응답 객체로 흡수
async function api(path, opts){
  let r;
  try{
    r = await fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts));
  }catch(e){
    netDown(true);
    return {ok:false, status:0, offline:true, error:'offline'};
  }
  netDown(false);
  let j = {}; try{ j = await r.json(); }catch(e){}
  return {ok:r.ok, status:r.status, ...j};
}
// 연결 끊김 배너 (재렌더와 무관하게 body에 직접 붙임)
let _netDown=false;
function netDown(down){
  if(down===_netDown) return;
  _netDown=down;
  let el=document.getElementById('netBanner');
  if(down){
    if(!el){
      el=document.createElement('div'); el.id='netBanner';
      el.innerHTML='📡 연결이 끊겼어요 — 기록은 다시 연결되면 저장돼요';
      document.body.appendChild(el);
    }
  } else if(el) el.remove();
}
addEventListener('online', ()=>netDown(false));
addEventListener('offline', ()=>netDown(true));
const jbody = o => ({body: JSON.stringify(o)});

// ---------- persistence ----------
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
let _saveT=0;
function persist(){
  clearTimeout(_saveT);
  _saveT = setTimeout(()=>{
    const st={ day:ymd(new Date()), theme:S.theme, sleepDone:S.sleepDone, wakeDone:S.wakeDone,
      mins:S.mins, nc2Pick:S.nc2Pick, towerUnit:S.towerUnit, deckIdx:S.deckIdx, known:S.known,
      checklist:S.checklist, stance:S.stance, muted:S.muted, messages:(S.messages||[]).slice(-40),
      eyeCfg: S.eye ? {mouthX:S.eye.mouthX, mouthY:S.eye.mouthY, voiceURI:S.eye.voiceURI, pitch:S.eye.pitch, rate:S.eye.rate, interval:S.eye.interval, useScreen:S.eye.useScreen, muteTTS:S.eye.muteTTS} : undefined,
      cq: (S.cq && !S.cq.loading) ? {subject:S.cq.subject, topic:S.cq.topic, items:S.cq.items, idx:S.cq.idx, pick:S.cq.pick, score:S.cq.score, answered:S.cq.answered, fromWrong:S.cq.fromWrong, showImg:S.cq.showImg} : undefined,
      examItems: S.examItems || undefined,
      reviewSkip: Object.keys(S.reviewSkip||{}).length?S.reviewSkip:undefined,
      cram: S.cram || undefined,
      // 풀던 회차 이어서 하기(새로고침·앱 종료 대비)
      bank: (S.qCurrent && S.quizItems.length) ? {qid:S.qCurrent.id, idx:S.quizIdx, marks:S.quizMarks,
              picks:S.picks, graded:S.graded, mode:S.bankMode,
              label:`${S.qCurrent.subject} · ${S.qCurrent.year} ${S.qCurrent.exam_round}`,
              total:S.quizItems.length, ts:Date.now()} : undefined };
    api('/api/state', {method:'POST', ...jbody({state:st})});
  }, 400);
}
function patch(o){ Object.assign(S,o); persist(); render(); }

// ---------- boot ----------
// 서버가 잠들어 있으면(무료 플랜 15분 idle) 첫 응답이 수십 초 걸림 → 빈 화면 대신 진행 상황 표시
function bootScreen(sec){
  $.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;">
    <div style="max-width:340px;">
      <div style="width:96px;height:96px;border-radius:50%;margin:0 auto 20px;background:radial-gradient(circle at 34% 30%, #2ee6a6, #14755C 46%, #0a3b2e 82%);animation:orbGlow 2.2s ease-in-out infinite, floaty 4s ease-in-out infinite;display:flex;align-items:center;justify-content:center;font-size:42px;">🏰</div>
      <div style="font-family:'Press Start 2P',monospace;font-size:9px;letter-spacing:2px;color:var(--gold);">TOWER OF KNOWLEDGE</div>
      <div style="margin-top:14px;font-size:15px;font-weight:800;color:var(--text);">탑을 깨우는 중…</div>
      <div style="margin-top:6px;font-size:12.5px;color:var(--text2);line-height:1.7;">
        서버가 잠들어 있어 처음 열 때 조금 걸려요.<br>${sec}초 경과 · 보통 30~60초면 열려요</div>
      <div style="margin-top:16px;height:5px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;">
        <div style="height:100%;width:${Math.min(96, sec/60*100)}%;background:linear-gradient(90deg,#14755C,#2ee6a6,#ffe066);transition:width .9s linear;"></div></div>
      ${sec>=75?`<div style="margin-top:14px;font-size:12px;color:var(--pink);">오래 걸리네요 — <button onclick="location.reload()" style="padding:6px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);color:var(--text2);font-size:12px;cursor:pointer;">새로고침</button></div>`:''}
    </div></div>`;
}
async function boot(){
  let sec=0, shown=false;
  const t=setInterval(()=>{ sec++; if(sec>=2){ shown=true; bootScreen(sec); } }, 1000);
  let s=null;
  for(let i=0;i<3 && !(s&&s.ok);i++){                 // 콜드 스타트로 첫 요청이 실패할 수 있어 재시도
    s = await api('/api/session');
    if(!s.ok) await new Promise(r=>setTimeout(r, 2500));
  }
  clearInterval(t);
  if(!s || !s.ok){

function examDate(){ const p=EXAM_DATE.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function dday(){ const t=examDate(),n=new Date(S.now); return Math.round((Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())-Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()))/86400000); }
function bossDateStr(){ const t=examDate(); return ymd(t)+' ('+['일','월','화','수','목','금','토'][t.getDay()]+')'; }
function liveMins(sub){ const base=S.mins[sub]||0; return S.running===sub ? base+(S.now-S.runStart)/60000 : base; }
function toggleTimer(sub){ if(barrier().active) return; if(S.running===sub){ commit(); } else { if(S.running) commit(); S.running=sub; S.runStart=Date.now(); render(); } }
function commit(){ const sub=S.running; if(!sub) return; const add=(Date.now()-S.runStart)/60000; S.mins={...S.mins,[sub]:(S.mins[sub]||0)+add}; S.running=null; S.runStart=0; saveStudy(); render(); }
function addMins(sub,d){ S.mins={...S.mins,[sub]:Math.max(0,(S.mins[sub]||0)+d)}; saveStudy(); render(); }
function pickNc2(sub){ let p=[...S.nc2Pick]; if(p.includes(sub)){ if(p.length>1) p=p.filter(x=>x!==sub); } else { p.push(sub); if(p.length>2) p.shift(); } patch({nc2Pick:p}); }
const WD=['일','월','화','수','목','금','토'];
function hm(s){ const p=String(s||'0:0').split(':'); return (+p[0]||0)+(+p[1]||0)/60; }
function barrierFor(kind, tag){
  return kind==='seal'
    ? {active:true,icon:'🔒',title:'수호령의 결계 발동 중!',tag,text:'현재는 탑 밖의 의무에 집중할 시간입니다. 학습 타이머와 알림이 봉인됩니다.'}
    : {active:true,icon:'🛡️',title:'정찰 임무 수행 중',tag,text:'외부 정찰 임무(고정일정)에 집중할 시간입니다. 타이머가 잠시 봉인됩니다.'};
}
function barrier(){
  if(S.lockPreview) return barrierFor('seal','미리보기 · 결계 테스트');
  const d=new Date(S.now),wd=WD[d.getDay()],hh=d.getHours()+d.getMinutes()/60;
  for(const s of (S.schedule||[])){
    if(s.day===wd && hh>=hm(s.t_start) && hh<hm(s.t_end))
      return barrierFor(s.kind, `${wd} ${s.t_start}–${s.t_end} · ${s.name}`);
  }
  return {active:false};
}

    `[지문]\n${it.passage||'(없음)'}\n\n[문항 ${qnum}] ${it.stem}\n선지: ${it.choices.map(c=>c.n+') '+c.text).join(' / ')}`;

    S.quizMarks[qnum]={chosen:choice, correct:r.correct, answer:r.answer};
    if(r.correct){ S.streak=(S.streak||0)+1; const xp=10*Math.min(S.streak,5); toast(S.streak>=2?`🔥 ${S.streak} 연속!  +${xp} XP`:`⚔️ 명중!  +10 XP`, 'good'); }
    else { const had=S.streak; S.streak=0; toast(choice===0?'🤔 다음엔 맞혀보자':(had>=2?`💥 콤보 끊김…`:'💧 아쉬워요'), 'bad'); }

    toast('🔑 이 문제는 정답키가 아직 없어요', 'bad');   // 정답표 미등록 → 채점 불가

// ========== 만점 방어전: 과목 전체 오답을 여러 회차에서 모아 한 번에 풀기 ==========
async function defenseStart(subject){
  S.defense={loading:true, subject}; S.tab='wrong'; render();
  const wrongs=(S.wrongData&&S.wrongData.wrong||[]).filter(w=>w.subject===subject);
  const byQid={};
  wrongs.forEach(w=>{ (byQid[w.question_id]=byQid[w.question_id]||new Set()).add(w.qnum); });
  // 회차마다 순차로 부르면 회차 수만큼 왕복이 쌓임 → 한꺼번에 병렬로
  const qids=Object.keys(byQid).map(Number);
  const res=await Promise.all(qids.map(qid=>api('/api/quiz?question_id='+qid)));
  const items=[];
  qids.forEach((qid,i)=>{
    const r=res[i]||{}, meta=r.meta||{};
    (r.items||[]).forEach(it=>{ if(byQid[qid].has(it.qnum)) items.push({...it, qid, year:meta.year, exam_round:meta.exam_round}); });
  });

async function defenseMark(qid, qnum, choice){

  if(r.ok){
    d.marks[key]={chosen:choice, correct:r.correct, answer:r.answer};
    if(r.correct) toast('⚔️ 명중!  +10 XP','good'); else toast(choice===0?'🤔 다음엔 맞혀보자':'💧 아쉬워요','bad');

    toast('🔑 이 문제는 정답키가 아직 없어요','bad');

async function scoreQuestion(){ const q=S.qCurrent; if(!q) return;

// ---------- ticker ----------
function tick(){
  S.now=Date.now();
  if(S.gateMode!=='open') return;
  const b=barrier();
  if(S.running && b.active) commit();
  if(b.active!==_barrierActive){ _barrierActive=b.active; render(); return; }
  if(S.mock){                                  // 모의고사 카운트다운
    if(S.now>=S.mock.endAt){ mockSubmit(true); return; }
    render(); return;
  }
  if(S.tab==='camp' && S.running) render(); // 타이머 작동 중에만 갱신(입력창 없어 안전)
}

async function cramPlay(y,r,s){
  S.video={loading:true, y, r, s};

  S.video={y, r, s, video:vid, failed:!vid};

  }

// ===== 도덕 학습 모드: 빈칸 · 용어 4지선다 · OX (라벨↔내용 카드 활용) =====
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const DGEN=new Set('의미 뜻 특징 성격 예 방법 배경 입장 관점 원칙 종류 정의 개념 구분 관계 문제점 해결책 조건 목적 역할 기능 내용 사례 요소 특성 장점 단점 한계 효과 유형'.split(' '));
const DSAGE=/공자|맹자|순자|노자|장자|석가|부처|칸트|밀|벤담|롤스|노직|싱어|요나스|프롬|아리스토텔레스|플라톤|소크라테스|흄|하버마스|레건|테일러|슈바이처|레오폴드|네스|베이컨|데카르트|스피노자|니부어|왈처|에피쿠로스|홉스|로크|루소|마르크스|정약용|이황|이이/;
const DJUNK=/소단원|^PART$|^\d|^[A-Za-z0-9 ()]+$/;
const dqPlain=s=>s.replace(/\*\*(.+?)\*\*/g,'$1');
const dqFirst=s=>dqPlain(s).split(' / ')[0].trim();   // 첫 문단만(런온·나열 방지)
const dqRunon=s=>/(다|음|함|됨|임|기)[가-힣]{2}/.test(s.replace(/다음|다양|다만|다수|다문화|다각|다시|기준|기술|기후|기본|기업|기능/g,''));
function dodeokItems(){   // 빈칸/4지선다용: 프레임 있는 문항 (품질 필터)
  const cards=(S.dodeok&&S.dodeok.cards)||[]; const items=[];
  cards.forEach(c=>{
    if(DJUNK.test(c.label) || DGEN.has(c.label)) return;
    const hlm=c.content.match(/\*\*(.+?)\*\*/);
    if(hlm && hlm[1].trim().length>=2 && hlm[1].trim().length<=24){   // 내용 속 핵심어 빈칸
      const term=hlm[1].trim();
      const seg=c.content.split(' / ').find(x=>x.includes('**')) || c.content.split(' / ')[0];
      const body=seg.replace(/\*\*.+?\*\*/,'§').replace(/\*\*(.+?)\*\*/g,'$1');
      if(body.length<=90 && body.length>=6) items.push({body, frame:`「${c.topic}」 · ${c.label}`, answer:term, dk:'term', blank:true, topic:c.topic, label:c.label});
    } else {                                     // 설명→용어/사상가 (첫 문단만, 품질 게이트)
      const desc=dqFirst(c.content);
      const ok = desc.length>=10 && desc.length<=74 && c.label.length>=2 && c.label.length<=16
                 && !desc.includes(c.label) && /[가-힣]/.test(desc) && !dqRunon(desc);
      if(ok) items.push({body:desc, frame: DSAGE.test(c.label)?'다음 주장을 한 사상가는?':'다음 설명에 해당하는 것은?', answer:c.label, dk: DSAGE.test(c.label)?'sage':'concept', blank:false, topic:c.topic, label:c.label});
    }
  });
  items.forEach(i=>{ i.hit=examHit(i.answer); i.grp=!!examGroup(i.answer); });
  // 기출에 실제 출제된 개념 우선(기출 선지묶음 보유 > 빈출 > 그 외)
  items.sort((a,b)=>(b.grp-a.grp)||(b.hit-a.hit));
  return items;
}
function dodeokStart(mode){
  S.dodeokMode=mode;
  if(mode==='read'){ S.dq=null; render(); return; }
  if(mode==='ox'){
    const cards=((S.dodeok&&S.dodeok.cards)||[]).filter(c=>{
      if(DGEN.has(c.label)||DJUNK.test(c.label)||c.label.length<2||c.label.length>16) return false;
      const d=dqFirst(c.content);
      return d.length>=10 && d.length<=74 && !d.includes(c.label) && /[가-힣]/.test(d) && !dqRunon(d);
    });
    S.dq={mode, cards:shuffle(cards), idx:0, pick:null, score:0, answered:0, ox:null};
    dodeokMakeOX();
  } else {
    let items=dodeokItems();
    if(mode==='quiz'){
      const exam=items.filter(i=>i.grp);      // 기출 4지선다 묶음이 있는 개념만 = 기출 난이도 보장
      items = exam.length>=12 ? shuffle(exam) : shuffle(items.filter(i=>i.grp||i.hit>0)).concat(shuffle(items.filter(i=>!i.grp&&!i.hit)));
    } else {
      const hot=items.filter(i=>i.hit>0);     // 빈칸도 기출 빈출 개념 먼저
      items = shuffle(hot).concat(shuffle(items.filter(i=>!i.hit)));
    }
    S.dq={mode, items, idx:0, reveal:false, pick:null, score:0, answered:0, choices:[]};
    if(mode==='quiz') dodeokMakeChoices();
  }
  render();
}
function dodeokMakeChoices(){
  const q=S.dq, cur=q.items[q.idx]; if(!cur) return;
  q.pick=null; q.fromExam=false;
  // ① 실제 기출 4지선다 묶음이 있으면 그대로 사용 (출제자가 만든 오답 = 기출 난이도)
  const eg=examGroup(cur.answer);
  if(eg){ q.choices=shuffle(eg.group); q.answerText=eg.exact; q.fromExam=true; return; }
  q.answerText=cur.answer;
  // ② 없으면 같은 유형·같은 주제의 형제 개념을 오답으로
  const uniq=arr=>[...new Set(arr)].filter(a=>a!==cur.answer);
  const sameTopic=uniq(q.items.filter(i=>i.dk===cur.dk&&i.topic===cur.topic).map(i=>i.answer));
  const sameKind =uniq(q.items.filter(i=>i.dk===cur.dk).map(i=>i.answer));
  let picks=shuffle(sameTopic).slice(0,3);
  if(picks.length<3) picks=picks.concat(shuffle(sameKind.filter(a=>!picks.includes(a))).slice(0,3-picks.length));
  q.choices=shuffle([cur.answer, ...picks]);
}
function dodeokMakeOX(){
  const q=S.dq, cur=q.cards[q.idx]; if(!cur) return;
  const mkFalse=Math.random()<0.5;
  let shown=cur.label;
  if(mkFalse){
    const sameKind=q.cards.filter(c=>c.label!==cur.label && DSAGE.test(c.label)===DSAGE.test(cur.label));  // 사상가↔사상가
    const sameTopic=sameKind.filter(c=>c.topic===cur.topic);   // 같은 주제의 형제(인접) 우선
    const o=shuffle(sameTopic.length?sameTopic:(sameKind.length?sameKind:q.cards.filter(c=>c.label!==cur.label)))[0];
    if(o) shown=o.label;
  }
  q.ox={shown, statement:dqFirst(cur.content), truth:cur.label, answer:(shown===cur.label?'O':'X')}; q.pick=null;
}
function dodeokPick(v){
  const q=S.dq; if(!q||q.pick!=null) return;
  q.pick=v; q.answered++;
  const ok = q.mode==='ox' ? (v===q.ox.answer) : (v===(q.answerText||q.items[q.idx].answer));
  if(ok){ q.score++; toast('⚔️ 정답!','good'); }
  else { (q.wrong=q.wrong||[]).push(q.idx); toast('💧 오답','bad'); }
  render();
}
function dodeokNext(){
  const q=S.dq; if(!q) return;
  const arr=(q.mode==='ox'?q.cards:q.items), n=arr.length;
  if(q.idx+1>=n){ q.done=true; render(); return; }   // 한 바퀴 다 돌면 끝내고 결과 표시(기존: 무한 반복)
  q.idx++; q.reveal=false; q.pick=null;
  if(q.mode==='quiz') dodeokMakeChoices();
  if(q.mode==='ox') dodeokMakeOX();
  render();
}
// 틀린 것만 남겨 다시 한 바퀴
function dodeokRetryWrong(){
  const q=S.dq; if(!q) return;
  const arr=(q.mode==='ox'?q.cards:q.items);
  const rest=[...new Set(q.wrong||[])].map(i=>arr[i]).filter(Boolean);
  if(!rest.length){ dodeokStart(q.mode); return; }
  if(q.mode==='ox') S.dq={mode:q.mode, cards:shuffle(rest), idx:0, pick:null, score:0, answered:0, ox:null, wrong:[]};
  else S.dq={mode:q.mode, items:shuffle(rest), idx:0, reveal:false, pick:null, score:0, answered:0, choices:[], wrong:[]};
  if(q.mode==='quiz') dodeokMakeChoices();
  if(q.mode==='ox') dodeokMakeOX();
  render();
}

async function cqStart(subject){
  S.cq={loading:true, subject}; render();
  const r=await api('/api/conceptquiz?subject='+encodeURIComponent(subject));
  const items=shuffle(r.items||[]);
  S.cq={subject, items, idx:0, pick:null, score:0, answered:0};
  persist(); render();
}
function cqPick(n){
  const q=S.cq; if(!q||q.pick!=null) return;
  q.pick=n; q.answered++;
  if(n===q.items[q.idx].answer){ q.score++; toast('⚔️ 정답!','good'); } else toast('💧 오답','bad');
  persist(); render();
}
function cqNext(){ const q=S.cq; if(!q||!q.items.length) return; q.idx=(q.idx+1)%q.items.length; q.pick=null; persist(); render(); }

}
async function topicQuizStart(idx){

function fmtHM(m){ m=Math.round(m||0); const h=Math.floor(m/60); return h? `${h}<span style="font-size:.42em;">시간</span> ${m%60}<span style="font-size:.42em;">분</span>` : `${m}<span style="font-size:.42em;">분</span>`; }

  return s;

async function replayStart(){
  S.replay={loading:true}; render();
  const d=await api('/api/replay');
  if(!d || d.error || d.offline){ S.replay=null; toast('기록을 불러오지 못했어요','bad'); render(); return; }
  const slides=rpSlides(d);
  S.replay={data:d, slides, i:0};
  render();
}
function replayNav(step){
  const r=S.replay; if(!r||!r.slides) return;
  const n=r.i+step;
  if(n<0) return;
  if(n>=r.slides.length){ S.replay=null; render(); return; }
  r.i=n; render();
}
function replayView(){
  const r=S.replay; if(!r) return '';

// 인쇄 전용 레이아웃 — 과목별로 한 페이지, A4 가로 2단
function reviewPrintable(cls){
  const bySub={};
  cls.forEach(c=>{ (bySub[c.subject||'기타']=bySub[c.subject||'기타']||[]).push(c); });
  const order=['과학','도덕','수학','국어','한국사','사회'];
  const subs=Object.keys(bySub).sort((a,b)=>{
    const ia=order.indexOf(a), ib=order.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  const today=ymd(new Date());
  return `<div id="reviewPrint" class="printOnly">${subs.map(sub=>{
    const list=bySub[sub];
    return `<section class="rvPage">
      <div class="rvHead">
        <h1>${h(sub)} · 개념 총정리</h1>
        <span>내가 틀린 개념 ${list.length}개 · ${h(today)} · 지식의 탑</span></div>
      <div class="rvGrid">${list.map(c=>`<article class="rvCard">
        <h2>${h(c.concept)}<span class="rvCnt">${c.wrong_n}회 틀림${c.still?' · 아직 헷갈림':''}</span></h2>
        ${c.needs_original?`<p class="rvOrig">표·그림을 직접 봐야 하는 개념 — 원본 문항 확인</p>`:''}
        ${c.confuse?`<p class="rvConf"><b>헷갈린 지점</b> ${h(c.confuse)}</p>`:''}
        <ul class="rvCore">${(c.core||[]).map(x=>`<li>${h(x)}</li>`).join('')}</ul>
        ${c.trap?`<p class="rvTrap"><b>함정</b> ${h(c.trap)}</p>`:''}
        ${c.memorize?`<p class="rvMem">${h(c.memorize)}</p>`:''}
        ${(c.refs||[]).length?`<p class="rvRefs">근거 문항 · ${c.refs.map(r=>h(r.round)+' '+r.qnum+'번').join(' / ')}</p>`:''}
      </article>`).join('')}</div>
    </section>`;
  }).join('')}</div>`;
}
function reviewPrint(){
  const root=document.getElementById('root');
  // A4 가로 페이지 설정을 인쇄 순간에만 주입 (요약 시트 인쇄에는 영향 없음)
  const st=document.createElement('style');
  st.id='rvPageStyle';
  st.textContent='@page{ size: A4 landscape; margin: 11mm; }';
  document.head.appendChild(st);
  root.classList.add('printReview');
  const done=()=>{ root.classList.remove('printReview'); const e=document.getElementById('rvPageStyle'); if(e) e.remove(); };
  const mq=window.matchMedia('print');
  const onch=m=>{ if(!m.matches){ done(); mq.removeListener(onch); } };
  try{ mq.addListener(onch); }catch(e){}
  window.addEventListener('afterprint', done, {once:true});
  setTimeout(()=>{ window.print(); setTimeout(done, 1500); }, 60);
}

function flashMark(known){

}

let _upFiles=[];   // 선택한 업로드 파일(재렌더로 input이 비워져도 유지)
const SUBJS=['국어','수학','영어','사회','과학','도덕','한국사'];
function parseMeta(fn){
  // 파일명에서 연도·회차·과정·과목을 유연하게 추출 (구분자·순서 무관)
  // 맥 파일명은 NFD(자모 분리)라 NFC로 정규화해야 한글 매칭됨
  const base=fn.replace(/\.[pP][dD][fF]$/,'').normalize('NFC');
  const type=/정답|답안/.test(base)?'정답':'문제';
  const ym=base.match(/(20\d\d)/);
  const rm=base.match(/([12])\s*(?:차|회|교시)/) || base.replace(/20\d\d/,'').match(/(?:^|[_\-\s])([12])(?:[_\-\s]|$)/);
  const level=/고졸/.test(base)?'고졸학력':(/고등/.test(base)?'고등':'');
  const subject=SUBJS.find(s=>base.includes(s))||'';   // 정답표엔 과목이 없으면 회차 전체로 반영
  const meta={type, year:ym?ym[1]+'년도':'', exam_round:rm?rm[1]+'차시험':'', level, subject};
  const ok=meta.year&&meta.exam_round&&meta.level&&(type==='정답'||subject);
  return ok?meta:null;
}
async function uploadPdf(){
  const inp=document.getElementById('up_file');
  let files=_upFiles.length?_upFiles:(inp?[...inp.files]:[]);   // 저장분 우선(재렌더 대비)
  if(!files.length){ S.adminMsg='⚠️ 파일을 선택하세요.'; render(); return; }
  // 문제를 먼저 처리해야 정답표가 붙을 문제가 존재함(정답은 맨 뒤로)
  files=files.slice().sort((a,b)=>(/정답|답안/.test(a.name.normalize('NFC'))?1:0)-(/정답|답안/.test(b.name.normalize('NFC'))?1:0));
  const form={type:document.getElementById('up_type').value, year:document.getElementById('up_year').value.trim(), exam_round:document.getElementById('up_round').value, level:document.getElementById('up_level').value, subject:document.getElementById('up_subject').value.trim()};
  let ok=0, fail=0, errs=[];
  for(let i=0;i<files.length;i++){
    const f=files[i];
    let meta=parseMeta(f.name);
    if(!meta){ if(files.length===1 && form.year && (form.type!=='문제'||form.subject)) meta=form; else { fail++; errs.push(f.name+'(파일명 인식 실패)'); continue; } }
    S.adminMsg=`📤 ${i+1}/${files.length} 처리 중… ${f.name}`; render();
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f);});
    const res=await api('/api/upload',{method:'POST',...jbody({...meta, data})});
    if(res.ok) ok++; else { fail++; errs.push(f.name+'('+(res.error||res.status)+')'); }
  }
  _upFiles=[];   // 처리 끝 → 저장분 비움(다음 선택 위해)
  S.adminMsg=`✅ ${ok}건 완료${fail?` · ❌ ${fail}건 실패: ${errs.join(', ')}`:''}`;
  if(!S.qFacets.subject.length) await loadFacets(); await adminReload();
}

// 키보드 단축키 안내 (터치 기기에서는 숨김)
function kbdHint(extra){
  return `<div class="kbdHint" style="margin-top:10px;font-size:11.5px;color:var(--text3);display:flex;gap:11px;flex-wrap:wrap;align-items:center;">
    <span><kbd>1</kbd>~<kbd>5</kbd> 선지</span><span><kbd>0</kbd> 모름</span><span><kbd>←</kbd><kbd>→</kbd> 이전/다음</span><span><kbd>i</kbd> 원본 사진</span>${extra||''}<span style="margin-left:auto;"><kbd>Ctrl</kbd>+<kbd>K</kbd> 빠른 이동</span></div>`;
}
const TAGS=[['concept','개념 몰라서'],['mistake','실수'],['confuse','헷갈림'],['time','시간 부족'],['guess','찍음']];
const TAGLB=Object.fromEntries(TAGS);
// 문항 원본 이미지 (로딩 실패 시 재시도 폴백)
function qImg(qnum, qid){
  const src=`/api/qimage?question_id=${qid!=null?qid:S.qCurrent.id}&qnum=${qnum}`;
  return `<div class="qimgw" style="position:relative;">
    <img src="${src}" alt="${qnum}번 문항" loading="eager" decoding="async"
      onload="var f=this.parentNode.querySelector('.qimgfb');if(f)f.style.display='none';"
      onerror="this.style.display='none';var f=this.parentNode.querySelector('.qimgfb');if(f)f.style.display='flex';"
      style="width:100%;max-width:680px;border-radius:12px;background:#fff;display:block;margin:0 auto 4px;min-height:60px;">
    <div class="qimgfb" style="display:none;flex-direction:column;align-items:center;gap:10px;padding:26px;border:1px dashed var(--gold-d);border-radius:12px;background:rgba(255,224,102,.08);color:var(--gold);font-size:13px;">
      <span>🖼 이미지를 불러오지 못했어요</span>
      <button onclick="var w=this.closest('.qimgw'),i=w.querySelector('img');i.style.display='block';this.parentNode.style.display='none';i.src='${src}&r='+Date.now();" style="padding:9px 18px;border-radius:10px;border:1px solid var(--gold-d);background:var(--panel2);color:var(--gold);font-weight:700;cursor:pointer;">다시 불러오기</button>
    </div></div>`;
}
function quiz(){
  const its=S.quizItems;
  if(!its.length) return `<div style="border:1px solid var(--border);border-radius:16px;padding:24px;color:var(--text3);font-size:14px;text-align:center;">문항을 불러오는 중이거나 분해할 수 없는 기출이에요. <b>📄 전체 원문</b>으로 확인하세요.</div>`;
  const idx=Math.min(S.quizIdx,its.length-1), it=its[idx];
  const batch = (S.bankMode==='batch'||S.bankMode==='mock') && !S.graded;   // 한번에 채점·모의고사: 풀 땐 정답 숨김
  const picked = S.picks[it.qnum];
  const m=S.quizMarks[it.qnum];
  const marked=Object.keys(S.quizMarks).length, got=Object.values(S.quizMarks).filter(x=>x.correct).length;
  const prev=idx>0?its[idx-1]:null;
  const samePassage = it.passage && prev && prev.passage===it.passage;
  // 지문 (같은 지문 연속이면 그대로 노출)
  const passage = it.passage ? `<div style="border:1px solid var(--bluebd);background:var(--tintB);border-radius:14px;padding:14px 16px;margin-bottom:14px;">
      <div style="font-family:'Cinzel',serif;font-size:11px;color:var(--blue);letter-spacing:1px;margin-bottom:8px;">📖 지문 ${samePassage?'· 앞 문항과 동일':''}</div>
      <div style="max-height:34vh;overflow:auto;white-space:pre-wrap;font-size:14.5px;line-height:1.85;color:var(--text);">${h(it.passage)}</div></div>` : '';
  // 발문 (수학·그림·표: PDF 원본 이미지 / 텍스트 문항은 '원본 사진 보기' 버튼)
  const imgBtn = it.hasPdf ? `<button data-act="showimg" data-arg="${it.qnum}" style="margin-top:10px;padding:9px 15px;border-radius:10px;border:1px solid var(--gold-d);background:rgba(255,224,102,.1);color:var(--gold);font-size:13px;font-weight:700;cursor:pointer;">${S.showImg[it.qnum]?'🖼 사진 숨기기':'🖼 원본 사진(표·그림) 보기'}</button>` : '';
  const stem = it.img
    ? qImg(it.qnum)
    : `<div style="font-size:17.5px;font-weight:700;line-height:1.75;white-space:pre-wrap;letter-spacing:-.1px;">${h(it.stem)}</div>${S.showImg[it.qnum]?`<div style="margin-top:10px;">${qImg(it.qnum)}</div>`:''}${imgBtn}`;
  // 선지 (이미지 문항은 원 버튼만; 텍스트 문항은 선지 텍스트 포함)
  const act = batch ? 'pick' : 'mark';
  const disabled = batch ? false : !!m;
  const choices=it.choices.map(c=>{
    let bg='var(--panel2)', bd='var(--border)', col='var(--text)', extra='';
    if(batch && picked===c.n){ bg='rgba(255,224,102,.16)'; bd='var(--gold-d)'; col='var(--gold)'; extra='●'; }   // 선택만 표시(정답 숨김)
    else if(m){
      if(c.n===it.answer){ bg='rgba(20,117,92,.28)'; bd='rgba(46,230,166,.6)'; col='var(--accent-b)'; extra='✓'; }
      else if(c.n===m.chosen){ bg='rgba(255,84,104,.18)'; bd='rgba(255,84,104,.6)'; col='var(--danger-b)'; extra='✗'; }
      else { col='var(--text3)'; }
    }
    if(it.img) return `<button data-act="${act}" data-arg="${it.qnum}:${c.n}" ${disabled?'disabled':''} style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 0;border-radius:12px;border:1px solid ${bd};background:${bg};color:${col};font-size:20px;cursor:${disabled?'default':'pointer'};">${CIRC[c.n]}<span style="font-size:15px;font-weight:800;">${extra}</span></button>`;
    return `<button data-act="${act}" data-arg="${it.qnum}:${c.n}" ${disabled?'disabled':''} style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 15px;border-radius:12px;border:1px solid ${bd};background:${bg};color:${col};font-size:15.5px;cursor:${disabled?'default':'pointer'};line-height:1.6;">
      <span style="font-size:18px;flex:0 0 auto;">${CIRC[c.n]}</span><span style="flex:1;${c.text?'':'color:var(--text3)'}">${h(c.text)||'(원문·이미지 참조)'}</span><span style="color:inherit;font-weight:800;">${extra}</span></button>`;
  }).join('');
  const choiceWrap = it.img ? 'display:flex;gap:9px;' : 'display:grid;gap:9px;';
  const unknownBtn = (m||batch) ? '' : `<button data-act="mark" data-arg="${it.qnum}:0" style="width:100%;margin-top:9px;padding:11px;border-radius:12px;border:1px dashed var(--border);background:var(--panel2);color:var(--text3);font-size:14px;font-weight:600;cursor:pointer;">🤔 모름 · 정답 보기</button>`;
  const result = m ? `<div style="margin-top:12px;font-size:15px;font-weight:800;color:${m.correct?'var(--accent-b)':(m.chosen===0?'var(--pink)':'var(--danger-b)')};">${m.correct?'✓ 정답!':(m.chosen===0?`🤔 모름 — 정답은 ${CIRC[it.answer]}`:`✗ 오답 · 정답은 ${CIRC[it.answer]}`)}</div>` : '';
  const ex = S.explain[it.qnum];
  const explainBox = m ? (
    ex==='...' ? `<div style="margin-top:10px;font-size:13px;color:var(--pink);display:flex;align-items:center;gap:8px;"><span style="animation:blink 1s infinite;">🧚</span> 수호령이 해설을 영창하는 중...</div>`
    : ex ? `<div style="margin-top:10px;background:var(--inset);border:1px solid var(--pinkbd);color:var(--text);border-radius:12px;padding:13px;font-size:14px;line-height:1.75;white-space:pre-wrap;">${mdLite(ex)}</div>`
    : `<button data-act="explainq" data-arg="${it.qnum}" style="margin-top:10px;padding:9px 14px;border-radius:10px;border:1px solid var(--pinkbd);background:var(--tintP);color:var(--pink);font-size:13px;font-weight:700;cursor:pointer;">🧚 왜 이게 정답인지 해설 보기</button>`
  ) : '';
  const subj=S.qCurrent?S.qCurrent.subject:'', pts=PTS(subj);
  const gradeBtn = (S.bankMode==='batch'&&!S.graded) ? `<button data-act="gradeall" ${S.grading?'disabled':''} style="width:100%;margin-top:10px;padding:14px;border-radius:12px;border:1px solid var(--gold-d);background:linear-gradient(180deg,rgba(255,224,102,.2),rgba(255,180,60,.12));color:var(--gold);font-weight:800;font-size:15px;cursor:${S.grading?'default':'pointer'};opacity:${S.grading?'.65':'1'};">${S.grading?'⏳ 채점 중...':`🎯 한번에 채점하기 (${Object.keys(S.picks).length}/${its.length} 선택)`}</button>` : '';
  const scoreBanner = S.graded ? `<div style="margin-top:14px;border-radius:14px;padding:16px;text-align:center;background:rgba(20,117,92,.14);border:1px solid rgba(46,230,166,.5);">
      <div style="font-size:13px;color:var(--text2);">${h(subj)} · 문항당 ${pts}점</div>
      <div style="font-size:30px;font-weight:900;color:var(--accent-b);margin:2px 0;">${got*pts}<span style="font-size:15px;">점</span> <span style="font-size:15px;color:var(--text2);">/ ${its.length*pts}</span></div>
      <div style="font-size:14px;color:var(--text2);">맞음 ${got} · 틀림 ${marked-got} · 총 ${its.length}문항</div></div>` : '';
  // 즉시 채점 모드에서 회차를 다 풀면 결과 요약 + 다음 행동 제시 (기존엔 아무 일도 안 일어났음)
  const allDone = !batch && marked>=its.length && its.length>0;
  const wrongNums = its.filter(x=>S.quizMarks[x.qnum] && !S.quizMarks[x.qnum].correct).map(x=>x.qnum);
  const perfect = allDone && !wrongNums.length;
  const curId = S.qCurrent && S.qCurrent.id;
  const nextRound = S.qList.find(x=>!x.solved && x.id!==curId && x.subject===subj)
                 || S.qList.find(x=>!x.solved && x.id!==curId);
  const doneCard = allDone ? `<div style="margin-bottom:16px;border-radius:16px;padding:20px;text-align:center;border:1px solid ${perfect?'rgba(46,230,166,.6)':'var(--gold-d)'};background:linear-gradient(180deg,${perfect?'rgba(20,117,92,.2)':'rgba(255,224,102,.1)'},var(--panel2));animation:popIn .4s cubic-bezier(.34,1.56,.64,1);">
      <div style="font-size:40px;line-height:1;margin-bottom:6px;">${perfect?'🏆':'📊'}</div>
      <div style="font-size:19px;font-weight:900;color:${perfect?'var(--accent-b)':'var(--gold)'};">${perfect?'만점! 이 회차 완전 정복 ⚔️':'회차 완주!'}</div>
      <div style="font-size:30px;font-weight:900;color:${perfect?'var(--accent-b)':'var(--text)'};margin:8px 0 2px;">${got*pts}<span style="font-size:15px;">점</span> <span style="font-size:15px;color:var(--text2);">/ ${its.length*pts}</span></div>
      <div style="font-size:13.5px;color:var(--text2);">맞음 ${got} · 틀림 ${wrongNums.length} · ${h(subj)} 문항당 ${pts}점</div>
      ${wrongNums.length?`<div style="margin-top:12px;font-size:12.5px;color:var(--text2);">틀린 문항 — 눌러서 바로 확인
        <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:7px;">${wrongNums.map(n=>`<button data-act="qjump" data-arg="${n}" style="padding:5px 11px;border-radius:8px;border:1px solid rgba(255,84,104,.5);background:rgba(255,84,104,.12);color:var(--danger-b);font-size:12.5px;font-weight:700;cursor:pointer;">${n}번</button>`).join('')}</div></div>`:''}
      <div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:15px;">
        ${wrongNums.length?`<button data-act="goreviewwrong" style="padding:10px 18px;border-radius:11px;border:1px solid var(--danger-b);background:rgba(255,84,104,.14);color:var(--danger-b);font-weight:800;font-size:13.5px;cursor:pointer;">📕 오답노트에서 복습</button>`:''}
        ${nextRound?`<button data-act="gosolve" data-arg="${nextRound.id}" style="padding:10px 18px;border-radius:11px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.2);color:var(--accent-b);font-weight:800;font-size:13.5px;cursor:pointer;">▶ 다음 회차 (${h(nextRound.subject)} ${h(nextRound.year)})</button>`:''}
      </div></div>` : '';
  return `<div id="quizCard">${doneCard}
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-family:'Press Start 2P',monospace;font-size:10px;color:var(--gold);">${it.qnum}번 · ${idx+1}/${its.length}</span>${S.streak>=2?`<span style="font-family:'Press Start 2P',monospace;font-size:10px;color:#fff;background:linear-gradient(180deg,#ff8a3d,#e0384b);padding:4px 8px;border-radius:8px;box-shadow:0 0 12px rgba(255,120,60,.6);animation:popIn .3s ease;">🔥 ${S.streak} 연속</span>`:''}</div>
      <div style="font-size:12.5px;color:var(--text2);">맞음 <b style="color:var(--accent-b);">${got}</b> / 채점 ${marked} · 총 ${its.length}</div>
    </div>
    <div style="height:6px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;"><div style="height:100%;width:${(idx+1)/its.length*100}%;background:linear-gradient(90deg,#14755C,#2ee6a6,#ffe066);transition:width .3s;"></div></div>
    ${passage}
    <div style="border:1px solid var(--border);background:linear-gradient(180deg,var(--panel),var(--panel2));border-radius:16px;padding:20px;box-shadow:0 10px 26px rgba(0,0,0,.35);">
      ${stem}
      <div style="${choiceWrap}margin-top:16px;">${choices}</div>
      ${unknownBtn}
      ${result}
      ${explainBox}
      ${m&&!m.correct?similarBox(it.qnum):''}
    </div>
    ${scoreBanner}
    <div style="display:flex;gap:10px;margin-top:14px;">
      <button data-act="qnav" data-arg="-1" style="flex:1;padding:12px;border-radius:12px;border:1px solid var(--border);background:var(--panel2);color:var(--text2);font-weight:700;font-size:14px;cursor:pointer;">◀ 이전</button>
      <button data-act="qnav" data-arg="1" style="flex:2;padding:12px;border-radius:12px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.2);color:var(--accent-b);font-weight:700;font-size:14px;cursor:pointer;">다음 문제 ▶</button>
    </div>
    ${kbdHint()}
    ${gradeBtn}</div>`;
}

function vWrong(){
  const d=S.wrongData;
  if(!d) return _netDown
    ? `<div style="border:1px solid var(--border);border-radius:16px;padding:26px;text-align:center;background:var(--panel);">
        <div style="font-size:34px;margin-bottom:8px;">📡</div>
        <div style="font-size:15px;font-weight:800;margin-bottom:4px;">오답노트를 불러오지 못했어요</div>
        <div style="font-size:13px;color:var(--text2);margin-bottom:14px;">연결이 끊긴 것 같아요. 다시 시도해볼까요?</div>
        <button data-act="retrywrong" style="padding:10px 20px;border-radius:11px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.2);color:var(--accent-b);font-weight:800;font-size:14px;cursor:pointer;">다시 시도</button></div>`

  const fSubj=S.wrongSubjFilter;
  const chips=subs.length?subs.map(([s,n])=>{
    const on=fSubj===s;
    return `<button data-act="wrongsubj" data-arg="${h(s)}" style="padding:10px 14px;border-radius:12px;border:1px solid ${on?'var(--danger-b)':'rgba(255,84,104,.4)'};background:${on?'rgba(255,84,104,.22)':'rgba(255,84,104,.08)'};display:flex;gap:10px;align-items:center;cursor:pointer;"><span style="font-weight:700;color:${on?'var(--danger-b)':'inherit'};">${h(s)}</span><span style="font-family:'Press Start 2P',monospace;font-size:12px;color:var(--danger-b);">${n}</span></button>`;
  }).join(''):'<div style="color:var(--text3);">아직 틀린 문제가 없어요 🎉</div>';
  const item=w=>`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid ${w.repeat?'rgba(255,140,40,.55)':'var(--border)'};border-radius:12px;padding:12px 14px;background:${w.repeat?'rgba(255,140,40,.08)':'var(--panel)'};">
      ${w.repeat?`<span style="font-size:11px;font-weight:800;color:#fff;background:linear-gradient(180deg,#ff9a3d,#e0603b);padding:3px 8px;border-radius:7px;">🔁 반복 ${w.wrong_count}회</span>`:''}
      <span style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold);">${h(w.subject)}</span>
      <span style="font-size:13px;color:var(--text2);">${h(w.year)} · ${h(w.exam_round)}</span>
      <span style="font-size:14px;font-weight:700;">${w.qnum}번</span>
      <span style="font-size:13px;color:${w.chosen?'var(--danger-b)':'var(--pink)'};">${w.chosen?'내 선택 '+CIRC[w.chosen]:'🤔 모름'}</span>
      <span style="font-size:13px;color:var(--accent-b);">정답 ${CIRC[w.answer]}</span>
      <div style="width:100%;display:flex;gap:5px;flex-wrap:wrap;align-items:center;">
        <span style="font-size:11.5px;color:var(--text3);">왜 틀렸나</span>
        ${TAGS.map(([k,lb])=>`<button data-act="wrongtag" data-arg="${w.question_id}|${w.qnum}|${k}" style="padding:4px 9px;border-radius:8px;font-size:11.5px;cursor:pointer;border:1px solid ${w.tag===k?'var(--pink)':'var(--border)'};background:${w.tag===k?'var(--tintP)':'var(--panel2)'};color:${w.tag===k?'var(--pink)':'var(--text3)'};">${lb}</button>`).join('')}
      </div>
      <div style="margin-left:auto;display:flex;gap:6px;">
        ${w.wrong_count>1?`<button data-act="wrongdec" data-arg="${w.question_id}|${w.qnum}" title="오답 횟수 1회 차감" aria-label="오답 횟수 1회 차감" style="padding:6px 11px;border-radius:999px;border:1px solid var(--orangebd);background:var(--tintO);color:var(--orange);font-size:12.5px;font-weight:700;cursor:pointer;">−1 차감</button>`:''}
        <button data-act="wrongremove" data-arg="${w.question_id}|${w.qnum}" title="이 문제를 오답노트에서 제거" aria-label="이 문제를 오답노트에서 제거" style="padding:6px 11px;border-radius:999px;border:1px solid rgba(46,230,166,.5);background:rgba(20,117,92,.14);color:var(--accent-b);font-size:12.5px;font-weight:700;cursor:pointer;">✓ 해결</button>
        <button data-act="review" data-arg="${w.question_id}|${h(w.subject)}|${h(w.year)}|${h(w.exam_round)}|${w.qnum}" style="padding:6px 13px;border-radius:999px;border:1px solid var(--bluebd);background:var(--tintB);color:var(--blue);font-size:12.5px;font-weight:700;cursor:pointer;">↺ 복습</button>
      </div>
    </div>`;
  const scoped=fSubj?(d.wrong||[]).filter(w=>w.subject===fSubj):(d.wrong||[]);
  const repeats=scoped.filter(w=>w.repeat), normals=scoped.filter(w=>!w.repeat);
  const filterBar=fSubj?`<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--text2);">
      <span>📌 <b style="color:var(--danger-b);">${h(fSubj)}</b>만 보는 중 (${scoped.length}문항)</span>
      <button data-act="wrongsubj" data-arg="${h(fSubj)}" style="padding:4px 11px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);color:var(--text3);font-size:12px;cursor:pointer;">전체 보기</button></div>`:'';

const EXAM_SUBJECTS=['국어','수학','사회','과학','한국사','도덕'];   // 영어 제외(이미 응시) · 평균은 영어 100 포함해 7로 나눔

async function loadExamKeys(){
  const s=S.examSel;
  if(!s.year||!s.exam_round||!s.level){ S.examMsg='연도·회차·과정을 모두 고르세요.'; render(); return; }
  S.examMsg='정답키 불러오는 중...'; render();
  const r=await api(`/api/examkeys?year=${encodeURIComponent(s.year)}&exam_round=${encodeURIComponent(s.exam_round)}&level=${encodeURIComponent(s.level)}`);
  S.examKeys=r.keys||{}; S.examInputs={}; S.examScore=null;
  const n=Object.keys(S.examKeys).filter(k=>k!=='영어').length;
  S.examMsg=n?'':'이 회차의 정답키가 없어요. 관리소에서 정답 PDF를 먼저 업로드하세요.';

function gradeExam(){
  if(!S.examKeys || S.examReveal) return;
  const detail={}; let sum=0, cnt=0;
  for(const subj of EXAM_SUBJECTS){
    const key=S.examKeys[subj]; if(!key) continue;
    const raw=(S.examInputs[subj]||'').match(/[1-5]/g)||[];   // 내가 적은 답(숫자만 추출)
    const nums=Object.keys(key).map(Number).sort((a,b)=>a-b);
    let correct=0, wrongList=[];
    nums.forEach((qn,i)=>{ const mine=+raw[i]; if(mine===key[qn]) correct++; else wrongList.push(qn); });
    const score=correct*PTS(subj);
    detail[subj]={total:nums.length, entered:raw.length, correct, wrong:nums.length-correct, score, wrongList, pts:PTS(subj)};
    sum+=score; cnt++;
  }
  const avg=cnt?Math.round((sum+100)/7*10)/10:0;   // 영어 100 포함, 7과목 평균
  startResultReveal({detail, avg, cnt, pass:avg>=60});
}
// ========== 결과 발표 연출 (카운트다운 → 집계 → 공개) ==========
function startResultReveal(result){
  S.examScore=null; S.examLetter=null; S.examLetterLoading=false;
  S.examReveal={phase:'count', n:3, display:0, real:result};
  render();
  loadExamLetter(result);            // 발표 연출(약 7초) 동안 편지를 미리 받아둔다
  setTimeout(()=>revealTick(), 600);
}
function revealTick(){
  const rv=S.examReveal; if(!rv) return;
  if(rv.phase==='count'){
    playSfx('examroll');
    if(rv.n>1){ rv.n--; render(); setTimeout(revealTick, 800); }
    else { rv.phase='roll'; rv.roll=0; rv.display=rv.real.avg; render(); setTimeout(revealTick, 70); }
    return;
  }
  if(rv.phase==='roll'){
    rv.roll++;
    const t=Math.min(1, rv.roll/26);
    if(t>=1){
      rv.phase='reveal'; rv.display=rv.real.avg; render();
      playSfx('examreveal');
      setTimeout(()=>{ S.examScore=rv.real; S.examReveal=null; render(); }, 1500);
      return;
    }
    const jitter=(1-t)*32;
    rv.display=Math.round(Math.max(0,Math.min(100,rv.real.avg+(Math.random()*2-1)*jitter))*10)/10;
    if(rv.roll%3===0) playSfx('examroll');
    render();
    setTimeout(revealTick, 55+t*90);
  }
}

async function loadExamLetter(result){
  S.examLetterLoading=true; S.examLetter=null; render();
  // AI 편지는 20초 넘게 걸릴 수 있음 → 그 이상 기다리게 두지 않고 준비된 편지로 대체

async function loadDodeok(){

// 기출 개념 매칭: 정답 용어가 실제 기출 선지에 등장하는지 (부분일치 포함)
function examHit(term){
  const f=(S.dodeokExam&&S.dodeokExam.freq)||{}; if(f[term]) return f[term];
  const t=term.replace(/\s|\(.*?\)|（.*?）/g,'');
  for(const k in f){ const kk=k.replace(/\s/g,''); if(kk&&(kk.includes(t)||t.includes(kk))&&Math.min(kk.length,t.length)>=2) return f[k]; }
  return 0;
}
// 정답이 포함된 '실제 기출 4지선다 묶음' → 출제자가 만든 오답 보기 그대로 사용
function examGroup(term){
  const gs=(S.dodeokExam&&S.dodeokExam.groups)||[];
  const t=term.replace(/\s|\(.*?\)/g,'');
  for(const g of gs){ const hit=g.find(x=>{const xx=x.replace(/\s/g,''); return xx===t||(xx.length>=2&&t.length>=2&&(xx.includes(t)||t.includes(xx)));});
    if(hit) return {group:g, exact:hit}; }
  return null;
}

let _ac;
function tone(freq,dur,type='square',vol=0.11,when=0){
  if(!_ac) return;
  const t=_ac.currentTime+when, o=_ac.createOscillator(), g=_ac.createGain();
  o.type=type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+0.008); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(_ac.destination); o.start(t); o.stop(t+dur+0.02);
}

const ALLOC=[['과학',55],['수학',55],['도덕',40],['국어',35],['한국사',30],['사회',25]];   // 일일 배분(분) — 기존 dday()/examDate() 사용
// ========== 남은 시간 과목별 배분 ==========
const MEMO_SUBJ=new Set(['도덕','한국사','사회']);   // 암기 위주 — 이해보다 반복 노출량이 회복 속도를 좌우해 같은 정답률 격차라도 시간이 더 필요
function timeAllocCard(){
  const stat=(S.diag||[]).reduce((m,s)=>(m[s.subject]=s,m),{});
  const weight=s=>{
    const st=stat[s];
    const a=st?st.acc:(LASTYEAR[s]||80);
    const gap=Math.max(4,100-a);
    const repeatRate=st&&st.wrong?st.repeat/st.wrong:0;    // 반복해서 틀림 = 안 고쳐지는 구조적 취약점
    const unknownRate=st&&st.wrong?st.unknown/st.wrong:0;  // 아예 모름 = 개념 자체가 안 잡힘
    const structural=1+repeatRate*0.7+unknownRate*0.4;
    const memoBoost=MEMO_SUBJ.has(s)?1.25:1;               // 암기과목 회복엔 반복 시간이 더 듦
    return gap*structural*memoBoost;
  };
  const subs=ALLOC.map(([s])=>s);
  const totalW=subs.reduce((sum,s)=>sum+weight(s),0);
  const totalMin=S.allocHours*60;
  const rows=subs.map(s=>{ const st=stat[s]; return {
      subj:s, acc:st?st.acc:(LASTYEAR[s]||80), src:st?'풀이':'전년',
      repeat:st?st.repeat:0, unknown:st?st.unknown:0, wrong:st?st.wrong:0,
      min:Math.round(totalMin*weight(s)/totalW)}; })
    .sort((a,b)=>a.acc-b.acc);
  return `<div style="border:1px solid var(--gold-d);border-radius:16px;padding:18px;background:linear-gradient(180deg,rgba(255,224,102,.08),var(--panel2));margin-bottom:18px;">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--gold-d);letter-spacing:1px;">TIME ALLOCATION · 남은 시간 배분</div>
      <div style="display:flex;gap:5px;">${[2,4,6,8].map(hh=>`<button data-act="allochours" data-arg="${hh}" style="padding:5px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid ${S.allocHours===hh?'var(--gold-d)':'var(--border)'};background:${S.allocHours===hh?'rgba(255,224,102,.16)':'var(--panel2)'};color:${S.allocHours===hh?'var(--gold)':'var(--text2)'};">${hh}시간</button>`).join('')}</div></div>
    <div style="font-size:12.5px;color:var(--text2);margin-bottom:10px;">오늘 <b style="color:var(--gold);">${S.allocHours}시간</b> 공부한다면, 정답률·반복오답·모름 비율·암기과목 가중을 종합해 이렇게 나눠보세요.</div>
    <div style="display:grid;gap:6px;">${rows.map(r=>`<div style="display:flex;align-items:center;gap:9px;font-size:13px;">
      <span style="width:44px;font-weight:700;">${h(r.subj)}</span>
      <div style="flex:1;height:9px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;"><div style="height:100%;width:${Math.min(100,r.min/(totalMin*0.4)*100)}%;background:${r.acc<80?'var(--danger-b)':r.acc<92?'var(--gold)':'var(--accent-b)'};"></div></div>
      <span style="width:150px;text-align:right;color:var(--text2);">${Math.floor(r.min/60)?Math.floor(r.min/60)+'시간 ':''}${r.min%60}분 <span style="font-size:10.5px;color:var(--text3);">(${r.acc}%·${r.src}${r.repeat?`·반복${r.repeat}`:''}${r.unknown?`·모름${r.unknown}`:''})</span></span></div>`).join('')}</div>
  </div>`;
}

function planCard(){
  const r=S.recommend; const d=dday();

  const rep=(r&&r.repeat)||{};
  const un=(r&&r.tasks)||[];
  // 취약도 순 정렬(정답률 낮을수록, 전년 실적 낮을수록 우선)
  const rank=[...ALLOC].sort((a,b)=>{
    const av=acc[a[0]]!=null?acc[a[0]]:(LASTYEAR[a[0]]||80), bv=acc[b[0]]!=null?acc[b[0]]:(LASTYEAR[b[0]]||80);
    return av-bv; });
  const days=[];

  for(let i=0;i<Math.min(d,7);i++){

           `🔁 ${main}${rep[main]?` 반복오답 ${rep[main]}개`:' 오답 복습'}`,
           `📖 ${sub} 개념/기출 (${(ALLOC.find(x=>x[0]===sub)||[])[1]}분)`,
           i%2===0?'⏱ 실전 모의고사 1과목(40분)':'✏️ 도덕 빈칸·OX 퀴즈 20문항']});

        <div style="display:grid;gap:3px;font-size:12.8px;color:var(--text2);">${x.tasks.map(t=>`<div>· ${h(t)}</div>`).join('')}</div>

// 캔버스에 그리기: 입 아래 영역을 말하기 진폭만큼 늘려 립싱크
function drawAvatarCanvas(cv){
  if(!cv||!IMG.ready) return;
  const e=eyeInit(), im=IMG.el, ctx=cv.getContext('2d');
  const W=cv.width, H=cv.height;
  const scale=Math.max(W/im.width, H/im.height);
  const dw=im.width*scale, dh=im.height*scale, dx=(W-dw)/2, dy=(H-dh)/2;
  const t=Date.now()/1000;
  const breathe=Math.sin(t*1.1)*1.2 + (e.pose==='dance'?Math.abs(Math.sin(t*6.5))*5:0);
  const swayX=(e.pose==='dance')?Math.sin(t*3.2)*6:Math.sin(t*0.7)*1.0;
  ctx.clearRect(0,0,W,H);
  ctx.save(); ctx.translate(swayX,-breathe);
  const my=(e.mouthY!=null?e.mouthY:0.66);            // 입 세로 위치(0~1)
  const mxr=(e.mouthX!=null?e.mouthX:0.5);             // 입 가로 위치(0~1)
  const cut=dy+dh*my;
  const amp=EYE.speaking? (1.6+Math.abs(Math.sin(t*9))*4.6) : 0;
  ctx.drawImage(im, dx, dy, dw, dh);                   // 전체(정지) — 절단선 없음
  if(amp>0.4){
    // 턱 부분만 타원으로 잘라 아래로 이동 → 입 벌어짐 (어깨·배경은 고정)
    const mw=dw*(e.mouthW||0.17), mcx=dx+dw*mxr, jawH=dh*0.16;
    ctx.save();
    ctx.beginPath(); ctx.ellipse(mcx, cut+jawH*0.45, mw*1.7, jawH, 0, 0, Math.PI*2); ctx.clip();
    ctx.drawImage(im, dx, dy+amp, dw, dh);
    ctx.restore();
    const g=ctx.createLinearGradient(0,cut-2,0,cut+amp+2);
    g.addColorStop(0,'rgba(60,20,26,.9)'); g.addColorStop(1,'rgba(130,55,66,.4)');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(mcx, cut+amp*0.45, mw/2, Math.max(1.2,amp*0.6), 0,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
  if(EYE.speaking){ ctx.strokeStyle='rgba(46,230,166,.85)'; ctx.lineWidth=4; ctx.strokeRect(2,2,W-4,H-4); }
}

const MALE_RX=/injoon|인준|minsu|민수|현우|지훈|male\b|남성|hyunwoo|jihun|eddy|reed|rocko|grandpa|junior|ralph|fred|aaron|nathan|daniel|이준|준서/i;

function pickVoice(){

  if(e.voiceURI){ const f=vs.find(v=>v.voiceURI===e.voiceURI); if(f) return f; }
  const score=v=>{ let sc=0; const n=(v.name||'')+' '+(v.voiceURI||'');

let _speakGen=0;
function speak(text){
  const e=eyeInit(); if(e.muteTTS||!text||!('speechSynthesis' in window)) return;
  const clean=String(text).replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim();
  if(!clean) return;
  const gen=++_speakGen;   // 이 발화 세션의 식별자 — 도중에 새 speak()가 끼어들면 옛 세션의 종료 처리를 무시

    if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel();
    if(EYE.keep) clearInterval(EYE.keep);
    EYE.keep=setInterval(()=>{ try{ if(speechSynthesis.speaking) speechSynthesis.resume(); else { clearInterval(EYE.keep); EYE.keep=null; } }catch(x){} },7000);
    // 문장 단위로 끊어 읽으면 더 자연스럽고 중간에 끊기지 않음
    const parts=clean.match(/[^.!?…\n]+[.!?…]?/g)||[clean];
    let done=false;
    const finishSpeak=()=>{
      if(done||gen!==_speakGen) return;             // 이미 처리됐거나 새 발화로 대체됨 → 무시
      done=true; EYE.speaking=false;

      const ee=eyeInit(); if(ee.always&&ee.on&&!ee.muteMic) setTimeout(startRec,400);

      if(i===0){ u.onstart=()=>{ EYE.speaking=true; avatarLoop(); }; }
      if(i===parts.length-1){ u.onend=finishSpeak; u.onerror=finishSpeak; }
      speechSynthesis.speak(u);
    });

    setTimeout(finishSpeak, Math.min(30000, clean.length*95+1500));
  }catch(err){ EYE.speaking=false; }
}

}

      <span style="flex:1;color:var(--text2);">${txt}</span>
      <span style="font-weight:800;font-size:12px;color:${ok?'var(--accent-b)':'var(--danger-b)'};">${ok?'✅ 도달':'❌ 미달'}</span></div>`;
  const rows=order.map(name=>{
    const d=ADMIT[name]; if(!d) return '';
    const tag=d.star?`<span style="font-size:11px;font-weight:800;color:${d.star.includes('주력')?'var(--gold)':'var(--blue)'};margin-left:5px;">${d.star}</span>`:'';
    const openRow = d.open ? line('학종', `평균 ${d.open.avgG}등급 · 최저 ${d.open.minG}등급`, p.grade<=d.open.minG) : '';
    const gyoRow = d.gyo ? line('교과', `평균 ${d.gyo.avg}점 · 최저 ${d.gyo.min}점`, p.score>=d.gyo.min) : '';
    return `<div style="border:1px solid ${d.star?'var(--gold-d)':'var(--border)'};border-radius:10px;padding:9px 12px;background:${d.star?'rgba(255,224,102,.06)':'var(--panel)'};">

      <div style="border-top:1px dashed var(--border);margin-top:4px;">${openRow}${gyoRow}</div></div>`;
  }).join('');
  return `<div style="margin-top:14px;">
    <div style="font-size:12.5px;font-weight:800;color:var(--text2);margin-bottom:8px;">📋 계열별 컷라인 일람 <span style="font-weight:600;color:var(--text3);">· 2025 입결 vs 내 예상(${p.grade}등급·${p.score}점)</span></div>

    <div style="margin-top:8px;font-size:11px;color:var(--text3);">학종(열린인재)은 등급 낮을수록 유리 · 교과성적은 500점 만점 환산 기준. 학종은 서류·면접 결과에 따라 실제와 달라질 수 있어요.</div>
  </div>`;
}
// ========== 성적 추이 그래프 ==========
function trendCard(){
  const rs=(S.examResults||[]).slice().reverse();
  if(rs.length<1) return '';
  const W=560,H=140,P=26, max=100, min=Math.min(80,...rs.map(r=>r.avg))-2;
  const x=i=>P+(rs.length<2?0:i*(W-2*P)/(rs.length-1)), y=v=>H-P-((v-min)/(max-min))*(H-2*P);
  const pts=rs.map((r,i)=>`${x(i)},${y(r.avg)}`).join(' ');
  const line=v=>`<line x1="${P}" y1="${y(v)}" x2="${W-P}" y2="${y(v)}" stroke="${v>=98?'rgba(46,230,166,.5)':'rgba(255,224,102,.45)'}" stroke-dasharray="4 4" stroke-width="1"/><text x="${W-P+2}" y="${y(v)+3}" font-size="9" fill="var(--text3)">${v}</text>`;
  return `<div style="border:1px solid var(--bluebd);border-radius:16px;padding:18px;background:linear-gradient(180deg,var(--tintB),var(--panel2));margin-bottom:18px;">
    <div style="font-family:'Press Start 2P',monospace;font-size:9px;color:var(--blue);letter-spacing:1px;margin-bottom:10px;">SCORE TREND · 성적 추이</div>
    <div style="overflow-x:auto;"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:320px;height:auto;">
      ${line(98)}${line(94)}
      ${rs.length>1?`<polyline points="${pts}" fill="none" stroke="var(--blue)" stroke-width="2.5" stroke-linejoin="round"/>`:''}
      ${rs.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.avg)}" r="4.5" fill="${r.avg>=98?'#2ee6a6':r.avg>=94?'#ffe066':'#ff5468'}"/>
        <text x="${x(i)}" y="${y(r.avg)-9}" font-size="10" fill="var(--text)" text-anchor="middle" font-weight="700">${r.avg}</text>
        <text x="${x(i)}" y="${H-8}" font-size="9" fill="var(--text3)" text-anchor="middle">${h((r.year||'').replace('년도','')+' '+(r.exam_round||'').replace('시험',''))}</text>`).join('')}
    </svg></div>
    <div style="font-size:11.5px;color:var(--text3);margin-top:4px;">점선 = 98(교과 3등급선) · 94(학종 마지노선)</div></div>`;
}

function diagCard(){
  const st=S.diag;
  if(!st) return '';
  if(!st.length) return '';
  const bar=s=>{const c=s.acc>=80?'var(--accent-b)':s.acc>=60?'var(--gold)':'var(--danger-b)';
    return `<div style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px;margin-bottom:5px;">
        <span><b style="font-size:14.5px;">${h(s.subject)}</b> <span style="color:var(--text3);font-size:12px;">${s.correct}/${s.total}문항</span>

          ${s.unknown?`<span style="margin-left:6px;font-size:11px;color:var(--pink);">🤔 모름 ${s.unknown}</span>`:''}</span>

      <div style="height:8px;border-radius:99px;background:var(--panel2);border:1px solid var(--border);overflow:hidden;"><div style="height:100%;width:${s.acc}%;background:${c};transition:width .4s;"></div></div>
      <div style="margin-top:5px;font-size:11.5px;color:var(--text3);">${s.rounds.filter(r=>r.wrong).slice(0,4).map(r=>`${h(r.k)} <span style="color:var(--danger-b);">-${r.wrong}</span>`).join(' · ')||'회차별 오답 없음'}</div>
    </div>`;};

    ${st.map(bar).join('')}
    ${S.diagLoading?`<div style="margin-top:12px;font-size:13px;color:var(--pink);display:flex;align-items:center;gap:8px;"><span style="animation:blink 1s infinite;">🧚</span> 수호령이 과목별 취약 단원을 진단하는 중... (30초 정도 걸려요)</div>`
      : S.diagText?`<div style="margin-top:14px;background:var(--inset);border:1px solid var(--pinkbd);border-radius:12px;padding:16px;font-size:14px;line-height:1.8;white-space:pre-wrap;color:var(--text);">${mdLite(S.diagText)}</div>
        <button data-act="diagai" style="margin-top:10px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--panel2);color:var(--text3);font-size:12.5px;cursor:pointer;">↻ 다시 진단</button>`
      : `<button data-act="diagai" style="margin-top:12px;padding:12px 20px;border-radius:12px;border:1px solid var(--pinkbd);background:var(--tintP);color:var(--pink);font-weight:800;font-size:14.5px;cursor:pointer;">🔬 취약 단원·원인 상세 진단받기</button>`}
  </div>`;
}
