  eyetest:()=>speak('안녕 수영아, 나는 루하야. 오늘도 같이 공부하자!'),
  eyedance:()=>{ const e=eyeInit(); e.dancing=true; avatarLoop(); clearTimeout(EYE.danceT); EYE.danceT=setTimeout(()=>{e.dancing=false;render();},8000); render(); }, eyemute:()=>{ const e=eyeInit(); e.muteTTS=!e.muteTTS; if(e.muteTTS)try{speechSynthesis.cancel();}catch(x){} render(); },
  finaldodeok:()=>{ S.tab='tower'; S.towerSubject='도덕'; S.dodeokMode='blank';
    (S.dodeok?Promise.resolve():loadDodeok()).then(()=>{ dodeokStart('blank'); render(); }); },
  wrongsubj:s=>{ S.wrongSubjFilter = S.wrongSubjFilter===s?'':s; render(); },
  wrongdec:arg=>{const[id,qn]=arg.split('|'); wrongAdjust(id,qn,'dec');},
  wrongremove:arg=>{const[id,qn]=arg.split('|'); wrongAdjust(id,qn,'remove');},
  hdrmenu:()=>{ S.hdrMenu=!S.hdrMenu; render(); },
  cramopen:key=>{ S.cram=S.cram||{done:{},open:{}}; S.cram.open=S.cram.open||{};
    const cur=S.cram.open[key]; S.cram.open[key] = (cur===undefined) ? false : !cur; persist(); render(); },
  cramvid:arg=>{ const[y,r,s]=arg.split('|'); cramPlay(y,r,s); },
  vidclose:()=>{ S.video=null; render(); },
  vidbg:(a,el)=>{ if(el&&el.id==='vidModal'){ S.video=null; render(); } },
  cramquiz:async id=>{ S.tab='bank'; await pickQuestionById(+id); render(); scrollTop(); },
  crammem:async arg=>{ const[y,r,s]=arg.split('|');
    cramToggle(cramKey(y,r,s,'m'));
    S.tab='wrong'; await loadWrong(); S.wrongSubjFilter=s; render(); scrollTo({top:0}); },
  resumebank:async()=>{ const rb=S.resumeBank; if(!rb) return;
    await pickQuestionById(rb.qid);
    S.quizMarks=rb.marks||{}; S.picks=rb.picks||{}; S.graded=!!rb.graded;
    if(rb.mode) S.bankMode=rb.mode;
    S.quizIdx=Math.min(rb.idx||0, Math.max(0,S.quizItems.length-1));
    S.resumeBank=null; render(); scrollTop(); },
  resumedrop:()=>{ S.resumeBank=null; persist(); render(); },
  cmdk:()=>openCmdk(), cmdkrun:i=>cmdkRun(+i), cmdkbg:(a,el)=>{ if(el&&el.id==='cmdk') closeCmdk(); },
  banksearch:()=>{},
  sheet:()=>loadSheet(), sheetclose:()=>{ S.sheet=null; render(); },
  sheetprint:()=>{ var r=document.getElementById('root'); r.classList.remove('printReview'); window.print(); },
  reviewprint:()=>reviewPrint(),
  qjump:n=>{ const i=S.quizItems.findIndex(x=>x.qnum===+n); if(i>=0){ S.quizIdx=i; persist(); render(); scrollTop(); } },
  retrywrong:async()=>{ await loadWrong(); await loadDiag(false); render(); },
  simadj:arg=>{ const[subj,d]=arg.split(':'); const sim=simInit();
    const max=(EXAM6.find(x=>x[0]===subj)||[,25])[1];
    sim[subj]=Math.max(0, Math.min(max, (sim[subj]||0)+(+d))); render(); },
  simpreset:kind=>{ if(kind==='perfect'){ const sim={}; EXAM6.forEach(([s])=>sim[s]=0); S.sim=sim; }
    else S.sim=null; render(); },
  jump:id=>{ const el=document.getElementById('sec-'+id);
    if(el) scrollTo({top: el.getBoundingClientRect().top+scrollY-116, behavior:'smooth'});
    else toast('그 섹션은 지금 없어요','bad'); },
  goreviewwrong:async()=>{ S.tab='wrong'; await loadWrong(); await loadDiag(false); render(); scrollTo({top:0}); },
  review:()=>loadConceptReview(),
  revskip:k=>{ if(S.reviewSkip[k]) delete S.reviewSkip[k]; else S.reviewSkip[k]=1; persist(); render(); },
  revskipclear:()=>{ S.reviewSkip={}; persist(); render(); },
  replay:()=>replayStart(), rpnext:()=>replayNav(1), rpclose:()=>{ S.replay=null; render(); },
  flash:()=>flashStart(), flashreveal:()=>flashReveal(),
  flashyes:()=>flashMark(true), flashno:()=>flashMark(false),
  flashretry:()=>flashRetryUnsure(), flashclose:()=>{ S.flash=null; render(); },
};
$.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=el.getAttribute('data-act'); playSfx(a); if(ACTS[a]) ACTS[a](el.getAttribute('data-arg'), el); });
function bindInputs(){
  $.querySelectorAll('[data-model]').forEach(el=>{ el.oninput=()=>{ S[el.getAttribute('data-model')]=el.value; }; });
  $.querySelectorAll('[data-filter]').forEach(el=>{ el.onchange=()=>{ S.qFilter[el.getAttribute('data-filter')]=el.value; }; });
  const uf=document.getElementById('up_file'); if(uf) uf.onchange=()=>{ _upFiles=[...uf.files]; };  // 선택 즉시 저장 → 재렌더에도 안 날아감
  const wf=document.getElementById('wn_file'); if(wf) wf.onchange=()=>{ _wnFile=wf.files[0]||null; };
  $.querySelectorAll('[data-exam]').forEach(el=>{ el.onchange=()=>{ S.examSel[el.getAttribute('data-exam')]=el.value; }; });
  $.querySelectorAll('[data-examin]').forEach(el=>{ el.oninput=()=>{ S.examInputs[el.getAttribute('data-examin')]=el.value; }; });
  const af=document.getElementById('ask_file'); if(af) af.onchange=()=>{ _askFile=af.files[0]||null; };
  const avf=document.getElementById('avatarFile'); if(avf) avf.onchange=()=>{ if(avf.files[0]) uploadAvatar(avf.files[0]); };
  ['avatarBox','pipBox','avatarPrev'].forEach(id=>{ const cv=document.getElementById(id);
    if(cv&&cv.tagName==='CANVAS'){ drawAvatarCanvas(cv);
      cv.onclick=ev=>{ const r=cv.getBoundingClientRect(); const e2=eyeInit();
        e2.mouthY=Math.min(.95,Math.max(.3,(ev.clientY-r.top)/r.height));
        e2.mouthX=Math.min(1,Math.max(0,(ev.clientX-r.left)/r.width));
        toast('👄 입 위치 설정됨','good'); persist(); render(); }; } });
  const ev2=document.getElementById('eyeVoice'); if(ev2) ev2.onchange=()=>{ eyeInit().voiceURI=ev2.value; persist(); };
  const ep=document.getElementById('eyePitch'); if(ep) ep.oninput=()=>{ eyeInit().pitch=+ep.value; persist(); render(); };
  const er=document.getElementById('eyeRate'); if(er) er.oninput=()=>{ eyeInit().rate=+er.value; persist(); render(); };
  const ei=document.getElementById('eyeInput'); if(ei){ ei.oninput=()=>{ eyeInit().input=ei.value; };
    ei.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); eyeSay(); } }; }
  $.querySelectorAll('[data-model="askq"]').forEach(el=>{ el.oninput=()=>{ S.askImg.q=el.value; }; });
  const ci=document.getElementById('chatInput'); if(ci) ci.onkeydown=e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); send(); } };
  const ck=document.getElementById('cmdkInput');
  if(ck) ck.oninput=()=>{ S.cmdk.q=ck.value; S.cmdk.sel=0; const p=ck.selectionStart; render(); const n=document.getElementById('cmdkInput'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
  const bs=document.getElementById('bankSearch');
  if(bs) bs.oninput=()=>{ S.bankSearch=bs.value; const p=bs.selectionStart; render(); const n=document.getElementById('bankSearch'); if(n){ n.focus(); try{n.setSelectionRange(p,p);}catch(e){} } };
}

// mic (native Web Speech)
let _rec=null;
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('이 브라우저는 받아쓰기를 지원하지 않아요.'); return; }
  if(S.recording){ if(_rec) try{_rec.stop();}catch(e){} S.recording=false; render(); return; }
  const rec=new SR(); rec.lang='ko-KR'; rec.interimResults=false; rec.continuous=false;
  rec.onresult=e=>{ let t=''; for(let i=0;i<e.results.length;i++) t+=e.results[i][0].transcript; S.blankText=(S.blankText?S.blankText+' ':'')+t; render(); };
  rec.onend=()=>{ S.recording=false; render(); }; rec.onerror=()=>{ S.recording=false; render(); };
  _rec=rec; try{ rec.start(); S.recording=true; render(); }catch(e){ S.recording=false; }
}

// ========== 키보드 단축키 ==========
function isTyping(e){
  const t=e.target;
  return t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
}
// 지금 화면에서 '풀고 있는' 대상 판별 → 숫자키·화살표를 그쪽으로 보냄
function activeSolver(){
  if(S.defense && !S.defense.loading && (S.defense.items||[]).length) return 'defense';
  if(S.cq && !S.cq.loading && (S.cq.items||[]).length) return 'cq';
  if(S.tab==='bank' && (S.quizItems||[]).length) return 'quiz';
  return null;
}
document.addEventListener('keydown', e=>{
  // ---- 커맨드 팔레트는 입력 중에도 동작 ----
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); S.cmdk?closeCmdk():openCmdk(); return; }
  if(S.cmdk){
    const list=cmdkFiltered();
    if(e.key==='Escape'){ e.preventDefault(); closeCmdk(); return; }
    if(e.key==='ArrowDown'){ e.preventDefault(); S.cmdk.sel=Math.min(list.length-1,(S.cmdk.sel||0)+1); render(); setTimeout(()=>{const el=document.getElementById('cmdkInput');if(el)el.focus();},0); return; }
    if(e.key==='ArrowUp'){ e.preventDefault(); S.cmdk.sel=Math.max(0,(S.cmdk.sel||0)-1); render(); setTimeout(()=>{const el=document.getElementById('cmdkInput');if(el)el.focus();},0); return; }
    if(e.key==='Enter'){ e.preventDefault(); cmdkRun(); return; }
    return;
  }
  if(isTyping(e)) return;
  if(S.gateMode!=='open') return;
  if(S.replay && !S.replay.loading){
    if(e.key==='ArrowRight'||e.key===' '||e.key==='Enter'){ e.preventDefault(); replayNav(1); return; }
    if(e.key==='ArrowLeft'){ e.preventDefault(); replayNav(-1); return; }
    return;
  }
  if(e.metaKey||e.ctrlKey||e.altKey) return;

  if(e.key==='Escape'){
    if(S.replay){ S.replay=null; render(); return; }
    if(S.video){ S.video=null; render(); return; }
    if(S.hdrMenu){ S.hdrMenu=false; render(); return; }
    if(S.flash){ S.flash=null; render(); return; }
    if(S.sheet){ S.sheet=null; render(); return; }
    if(S.openLetter){ S.openLetter=null; render(); return; }
    return;
  }
  // 도덕 학습(빈칸/용어퀴즈/OX): 숫자=선지, O·X=참거짓, Space·→=다음
  if(S.tab==='tower' && S.towerSubject==='도덕' && S.dq && !S.dq.done && S.dodeokMode!=='read'){
    const q=S.dq;
    if(e.key===' '||e.key==='ArrowRight'){ e.preventDefault();
      if(S.dodeokMode==='blank' && !q.reveal){ q.reveal=true; render(); } else dodeokNext(); return; }
    if(S.dodeokMode==='quiz' && /^[1-9]$/.test(e.key)){
      const t=(q.choices||[])[+e.key-1]; if(t!=null){ e.preventDefault(); dodeokPick(t); } return; }
    if(S.dodeokMode==='ox'){
      if(e.key==='o'||e.key==='O'||e.key==='1'||e.key==='ㅐ'){ e.preventDefault(); dodeokPick('O'); return; }
      if(e.key==='x'||e.key==='X'||e.key==='2'||e.key==='ㅌ'){ e.preventDefault(); dodeokPick('X'); return; }
    }
    return;
  }
  // 빠른 복습: Space=정답 확인, 1=헷갈려, 2=알겠어
  if(S.flash && !S.flash.done && !S.flash.loading){
    if(e.key===' '||e.key==='Enter'){ e.preventDefault(); S.flash.revealed?flashMark(true):flashReveal(); return; }
    if(e.key==='1'){ e.preventDefault(); flashMark(false); return; }
    if(e.key==='2'){ e.preventDefault(); flashMark(true); return; }
    return;
  }
  const solver=activeSolver();
  if(!solver) return;
  // 1~5 = 선지 선택 / 0 = 모름
  if(/^[0-5]$/.test(e.key)){
    const n=+e.key;
    if(solver==='defense'){
      const d=S.defense, it=d.items[Math.min(d.idx,d.items.length-1)];
      if(it && (n===0 || n<=it.choices.length)){ e.preventDefault(); defenseMark(it.qid,it.qnum,n); }
      return;
    }
    if(solver==='cq'){
      if(n===0) return;                       // 집중 연습엔 '모름' 없음
      const q=S.cq, it=q.items[q.idx];
      if(it && n<=it.choices.length){ e.preventDefault(); cqPick(n); }
      return;
    }
    const its=S.quizItems, it=its[Math.min(S.quizIdx,its.length-1)];
    if(!it) return;
    const batch=(S.bankMode==='batch'||S.bankMode==='mock') && !S.graded;
    if(n===0){ if(!batch && !S.quizMarks[it.qnum]){ e.preventDefault(); ACTS.mark(it.qnum+':0'); } return; }
    if(n<=it.choices.length){ e.preventDefault(); ACTS[batch?'pick':'mark'](it.qnum+':'+n); }
    return;
  }
  // 좌우 = 이전/다음 문항
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    const d=e.key==='ArrowRight'?1:-1;
    e.preventDefault();
    if(solver==='defense') defenseNav(d);
    else if(solver==='cq'){ if(d>0) cqNext(); else { const q=S.cq; q.idx=(q.idx-1+q.items.length)%q.items.length; q.pick=null; persist(); render(); } }
    else quizNav(d);
    return;
  }
  // i = 원본 사진 토글
  if(e.key==='i'||e.key==='ㅑ'){
    if(solver==='quiz'){ const it=S.quizItems[Math.min(S.quizIdx,S.quizItems.length-1)];
      if(it&&it.hasPdf){ e.preventDefault(); ACTS.showimg(String(it.qnum)); } }
    else if(solver==='cq'){ const it=S.cq.items[S.cq.idx];
      if(it&&it.hasPdf){ e.preventDefault(); cqShowImg(it.question_id+'_'+it.qnum); } }
  }
});
// ========== 모바일 스와이프로 이전/다음 문항 ==========
let _swX=0, _swY=0, _swT=0;
addEventListener('touchstart', e=>{
  if(e.touches.length!==1) return;
  _swX=e.touches[0].clientX; _swY=e.touches[0].clientY; _swT=Date.now();
}, {passive:true});
addEventListener('touchend', e=>{
  if(!_swT || !activeSolver()) return;
  const t=e.changedTouches[0], dx=t.clientX-_swX, dy=t.clientY-_swY, dt=Date.now()-_swT;
  _swT=0;
  // 가로로 충분히 · 세로는 거의 안 움직였고 · 빠르게 → 스크롤과 구분
  if(dt>600 || Math.abs(dx)<70 || Math.abs(dy)>45 || Math.abs(dx)<Math.abs(dy)*2) return;
  if(getSelection && String(getSelection()).length) return;   // 텍스트 선택 중이면 무시
  const d=dx<0?1:-1, solver=activeSolver();
  if(solver==='defense') defenseNav(d);
  else if(solver==='cq'){ const q=S.cq; q.idx=(q.idx+d+q.items.length)%q.items.length; q.pick=null; persist(); render(); }
  else quizNav(d);
}, {passive:true});
// ========== 맨 위로 버튼 ==========
addEventListener('scroll', ()=>{ const b=document.getElementById('toTop'); if(b) b.classList.toggle('on', scrollY>420); }, {passive:true});

boot();
